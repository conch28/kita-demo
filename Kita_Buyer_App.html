  '<div class="ans-band"><b>Sensitivity.</b> Between '+CX.num(Math.round(s.high.ha))+' and '+
   CX.num(Math.round(s.low.ha))+' hectares depending on '+
   (conv.kind==="direct"?"field yield and grade acceptance":("realised "+esc(conv.lab.toLowerCase())+", field yield and grade acceptance"))+
   '. The wide end is what a bad season looks like, and it is what you should contract against.</div>'+
  '</div>';

 h+=note(s.continuous?"Why this crop needs no buffer stock":"The constraint the specification does not mention",

 h+='<h2 class="sec">Assumptions used</h2>'+

 if(s.clusters&&s.clusters.length)

   '<tr><th>Province</th><th>Municipalities</th><th class="right">Hectares</th><th class="right">Farmers</th>'+
   '<th class="right">Volume</th><th class="right">Haul</th></tr>'+
   s.clusters.map(function(x){
    return '<tr><td><b>'+esc(x.prov)+'</b></td><td class="sub">'+esc(x.muni)+'</td>'+

 h+='<h2 class="sec">Production and delivery schedule</h2><div class="card"><table class="sched">'+

  '<tr><td>Delivery to you</td>'+s.sched.map(function(x){return '<td class="right sub">'+x.powderOut.toFixed(1)+'</td>';}).join("")+'</tr>'+
  '</table><div class="sub" style="margin-top:7px">Intake in MT of raw crop. Delivery in MT of '+esc(conv.unit.replace("MT ",""))+
  '. Where the two do not line up, inventory carries the difference &mdash; and someone pays to carry it.</div></div>';

 h+='<div style="margin-top:12px"><button class="btn" onclick="submitDemand()">Submit as a request for quotation</button>'+
  '<button class="btn sec" style="margin-left:8px" onclick="reserveCap()">Reserve production capacity</button></div>';
 return h;
}
function fld(l,v,raw){return '<div class="fitem"><div class="fl">'+l+'</div><div class="fv">'+(raw?v:esc(v))+'</div></div>';}
function ansv(l,v){return '<div class="av"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>';}
function submitDemand(){
 var s=D().solve(DEM.crop,{mtYr:DEM.mtYr,form:DEM.form});
 CXP.log({obj:"order",id:"RFQ-"+ME,from:"—",to:"RFQ submitted "+DEM.mtYr+" MT",role:"buyer",actor:me().n,ai:null});
 openM('<h2>Request for quotation submitted</h2>'+
  '<p class="sub">'+esc(s.statement)+'</p>'+
  '<div class="card" style="margin-top:10px"><b>What happens next</b><ol class="ol">'+

  '<li>A price collar is quoted — a floor that protects the farmer and a ceiling that protects you.</li>'+
  '<li>On your trial PO, hectares are allocated and loan applications enter the LANDBANK pipeline.</li>'+
  '<li>Production begins only after credit approval. That is the part that makes the volume real.</li></ol></div>'+
  '<div style="margin-top:10px"><button class="btn" onclick="closeM()">Close</button></div>');
}
function reserveCap(){
 var g=D().gap(DEM.crop);
 openM('<h2>Reserve Philippine production capacity</h2>'+
  '<p class="sub">A capacity reservation is not a purchase order. It is a commitment to take a defined share of a defined '+
  'planting window, at a collar, before the crop is in the ground.</p>'+
  '<div class="card"><table>'+
  '<tr><td>Commodity</td><td class="right"><b>'+CX.CROPS[DEM.crop].n+'</b></td></tr>'+
  '<tr><td>Volume reserved</td><td class="right"><b>'+DEM.mtYr+' MT / year</b></td></tr>'+
  '<tr><td>Hectares committed to you</td><td class="right"><b>'+CX.num(Math.round(
    D().solve(DEM.crop,{mtYr:DEM.mtYr,form:DEM.form}).base.ha))+' ha</b></td></tr>'+

/* ---------------- ALLOCATION RISK ---------------- */
function vRisk(){
 var b=me(),M=D(),c=CX.CROPS[b.crop];
 var mine=CX.book().filter(function(f){return f.buyerId===b.id&&f.status!=="waitlist";});
 /* A powder contract is not measured in fresh tonnes. Convert before comparing,
    or the cover figure is wrong by the conversion ratio — a factor of six on ube. */
 var conv=c.processed?c.conv:1;
 var unit=c.processed?"MT powder":"MT";
 var rows=mine.map(function(f){
  var p=CXAI.projYield(f);
  var planned=(c.yld/1000)*f.ha/conv, proj=p.y*f.ha/conv;
  return {f:f,p:p,planned:planned,proj:proj,gap:proj-planned,
   pct:planned?proj/planned:1,
   cause:p.lateDays&&p.fertDays?"late planting and delayed inputs":
     p.lateDays?"late planting":p.fertDays?"delayed input delivery":
     (f.water!=="irrigated"?"rain-fed exposure":"on plan")};
 }).sort(function(x,y){return x.pct-y.pct;});
 var planned=rows.reduce(function(t,x){return t+x.planned;},0);
 var proj=rows.reduce(function(t,x){return t+x.proj;},0);
 var atRisk=rows.filter(function(x){return x.pct<0.9;});
 var contracted=b.mtYr;
 var cover=contracted?proj/contracted:1;
 var h='<h1 class="pg">Allocation risk</h1>'+
  '<p class="lede">Not a list of orders &mdash; a view of whether the hectares allocated to you will actually produce '+
  'what you contracted for, while there is still time to do something about it.</p>';
 h+='<div class="grid g4">'+
  kpi("Contracted",CX.num(contracted)+" "+unit,"annual requirement")+
  kpi("Allocated capacity",CX.num(Math.round(planned*10)/10)+" "+unit,rows.length+" farms, "+
    CX.num(Math.round(rows.reduce(function(t,x){return t+x.f.ha;},0)*10)/10)+" ha")+
  kpi("Projected at current execution",CX.num(Math.round(proj*10)/10)+" "+unit,
    (proj>=planned?"+":"")+CX.num(Math.round((proj-planned)*10)/10)+" against plan",proj>=planned?"hi":"")+
  kpi("Cover against contract",(cover*100).toFixed(0)+"%",cover>=1?"covered":"short",cover>=1?"hi":"")+'</div>';

 /* the honest gap */
 if(cover<1){
  var shortMt=contracted-proj;
  var haNeed=Math.ceil(shortMt*conv/(c.yld/1000));
  h+=CXAI.card({
   obs:"Allocated hectares project "+CX.num(Math.round(proj*10)/10)+" "+unit+" against a "+
     CX.num(contracted)+" "+unit+" contract"+(c.processed?" — after the "+c.conv+":1 fresh-to-powder conversion.":"."),
   band:cover<0.6?"bad":"warn",
   reasons:[{t:"Farms allocated to this contract",v:rows.length+" farms, "+
     CX.num(Math.round(rows.reduce(function(t,x){return t+x.f.ha;},0)*10)/10)+" ha"},
    {t:"Planned output on those hectares",v:CX.num(Math.round(planned*10)/10)+" "+unit},
    {t:"Projected at current execution",v:CX.num(Math.round(proj*10)/10)+" "+unit},
    (c.processed?{t:"Fresh crop required per unit of finished product",v:c.conv+":1"}:null),
    {t:"Farms running more than 10% below plan",v:atRisk.length+" of "+rows.length},
    {t:"Shortfall against contract",v:CX.num(Math.round(shortMt*10)/10)+" "+unit}].filter(Boolean),
   impact:{v:CX.num(Math.round(shortMt*10)/10)+" "+unit+" short — "+CX.pesoX(Math.round(shortMt*1000*b.price))+" of contract value",
    d:"A shortfall found at delivery is a breach. Found now it is "+CX.num(haNeed)+
      " hectares of contracting and a planting window that is still open."},
   rec:"Contract "+CX.num(haNeed)+" additional hectares before the window closes, or agree a revised schedule now "+
     "rather than in delivery month.",
   actions:[{verb:"po",ctx:b.id,label:"Request "+CX.num(haNeed)+" additional hectares"},
    {verb:"contact",ctx:b.id,label:"Agree a revised delivery schedule"},
    {verb:"report",ctx:b.id,label:"Generate the allocation note"}],
   src:"Allocated farm list, planting dates, input delivery receipts, irrigation status, yield history."});
 }

 /* farm-level risk, charted */
 if(rows.length){
  h+='<h2 class="sec">Where the risk sits</h2><div class="card">'+
   CXC.bars(rows.slice(0,12).map(function(x){
    return {n:x.f.muni+" · "+CX.num(x.f.ha,1)+" ha · "+x.cause,v:Math.round(x.pct*100),
     k:x.pct<0.8?"bad":x.pct<0.92?"warn":""};}),
    {fmt:function(v){return v+"% of plan";}})+
   '<div class="sub" style="margin-top:7px">Percentage of planned yield each allocated block is currently projected to '+
   'deliver. Farmer identity is withheld; the municipality and the cause are what you can act on.</div></div>';
  h+='<div class="card"><table>'+
   '<tr><th>Cluster</th><th class="right">Hectares</th><th class="right">Planned '+unit+'</th>'+
   '<th class="right">Projected</th><th class="right">Variance</th><th>Probable cause</th><th>Status</th></tr>'+
   rows.map(function(x){
    return '<tr><td><b>'+esc(x.f.muni)+'</b><div class="sub">'+esc(x.f.prov)+'</div></td>'+
     '<td class="right">'+CX.num(x.f.ha,1)+'</td>'+
     '<td class="right sub">'+CX.num(x.planned,2)+'</td>'+
     '<td class="right"><b>'+CX.num(x.proj,2)+'</b></td>'+
     '<td class="right '+(x.gap<0?"bad":"ok")+'">'+(x.gap>=0?"+":"")+CX.num(x.gap,2)+'</td>'+
     '<td class="sub">'+esc(x.cause)+(x.p.lateDays?" ("+x.p.lateDays+"d)":"")+'</td>'+
     '<td>'+(x.pct>=0.92?'<span class="chip c-ok">on plan</span>':
        x.pct>=0.8?'<span class="chip c-warn">watch</span>':'<span class="chip c-bad">at risk</span>')+'</td></tr>';
   }).join("")+'</table></div>';
 } else {
  h+='<div class="card"><b>No hectares are allocated to this contract yet.</b>'+
   '<div class="sub" style="margin:6px 0 10px">Allocation happens when a purchase order is raised — that is what '+
   'triggers the loan applications behind the hectares.</div>'+
   '<button class="btn" onclick="go(\'demand\')">Create demand</button></div>';
 }
 h+=note("Why this screen exists and an order list does not",
  "An order list tells you what you asked for. It cannot tell you whether it is coming. Every number here is derived "+
  "from planting dates, input delivery receipts and irrigation status on the specific hectares assigned to your "+
  "contract — which is only possible because the same platform financed them.","ok");
 return h;
}

KBS.testPrice=function(p,c){
 var f=KBS.floorFor(c), hard=Math.max(f.svc,f.stat||0);

 return {k:"ok",f:f,msg:"At or above the viability floor for this cohort and cycle."};
};

 return h;

/* ---- 11. register ------------------------------------------------------ */
function mount(){
 if(!window.setNav||!window.VIEWS){setTimeout(mount,60);return;}
 var main=document.getElementById("main");
 var add=[{k:"struct",n:"How this is contracted",r:KBS.vStructure},
          {k:"ready",n:"Contract readiness",r:KBS.vReady},
          {k:"cred", n:"Supply credibility",r:KBS.vCred},
          {k:"supply",n:"Contracted supply",r:KBS.vSupply},
          {k:"accept",n:"Acceptance",r:KBS.vAccept},
          {k:"ladder",n:"Commitment state",r:KBS.vLadder}];
 add.forEach(function(v){
  if(document.getElementById("v-"+v.k)) return;
  var d=document.createElement("div"); d.className="view"; d.id="v-"+v.k; main.appendChild(d);
 });
 var cur=window.VIEWS.slice();
 /* decorate home with the action block */
 cur.forEach(function(v){
  if(v.k==="home"&&!v._kbs){var o=v.r;v._kbs=1;v.r=function(){return KBS.actions()+o();};}
  if(v.k==="demand"&&!v._kbs){var o2=v.r;v._kbs=1;v.r=function(){
    var out=o2()+KBS.guardPanel(); setTimeout(KBS.guard,0); return out;};}
 });
 /* insert new views after "demand" so the order tracks the buyer journey */
 var out=[],done=false;
 cur.forEach(function(v){out.push(v); if(v.k==="demand"&&!done){out=out.concat(add);done=true;}});
 if(!done) out=out.concat(add);
 setNav(out,"home");
}
if(document.readyState==="complete"||document.readyState==="interactive") setTimeout(mount,120);
else document.addEventListener("DOMContentLoaded",function(){setTimeout(mount,120);});
})();

<script>
/* ============================================================================
   KITA — ANSWER-FIRST LANDING
   Adds one view, "Today", to the front of each console and makes it the
   default. Every number on it is computed live from the app's own model
   (CX.book(), CX.deliveries(), CX.gates(), CX.buyers()) — nothing is hardcoded,
   so the landing stays true when state changes and when another app writes to
   the shared store. No existing view is moved, renamed or removed.
   Additive. Delete the <!--KBS:home--> block to revert.
   ========================================================================== */
(function(){
if(window.KHOME) return;
var H=window.KHOME={v:"1.0"};

/* ---- wait for the host app ---------------------------------------------- */
function ready(){
 return window.CX && window.setNav && window.VIEWS && typeof window.go==="function"
        && document.getElementById("main");
}

/* ---- small helpers, using the host's own primitives where they exist ----- */
function E(s){ return (window.esc?esc(s):String(s==null?"":s)); }
function num(n){ return (window.CX&&CX.num)?CX.num(n):Number(n).toLocaleString("en-US"); }
function peso(n){ return "₱"+num(Math.round(n)); }
function pesoM(n){
 if(Math.abs(n)>=1e6) return "₱"+(n/1e6).toFixed(n>=1e7?1:2)+"M";
 if(Math.abs(n)>=1e3) return "₱"+Math.round(n/1e3)+"k";
 return "₱"+Math.round(n);
}
function has(k){ return (window.VIEWS||[]).some(function(v){return v.k===k;}); }
function firstView(){ for(var i=0;i<arguments.length;i++) if(has(arguments[i])) return arguments[i];
                      return null; }
function pct(a,b){ return b? Math.round(a/b*100) : 0; }

/* ---- CSS ---------------------------------------------------------------- */
var st=document.createElement("style");
st.id="khome-css";
st.textContent=[
 "#v-kx .kh-ans{border:1px solid var(--line,rgba(128,128,128,.25));border-radius:14px;",
 "padding:20px 22px;margin:2px 0 12px;background:var(--card,rgba(128,128,128,.03))}",
 "#v-kx .kh-who{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;",
 "opacity:.55;margin-bottom:8px}",
 "#v-kx .kh-h1{font-size:25px;line-height:1.2;letter-spacing:-.025em;font-weight:700;margin:0}",
 "#v-kx .kh-h1 em{font-style:normal;color:#2a78d6}",
 "#v-kx .kh-sub{font-size:13.5px;opacity:.7;margin-top:7px;max-width:82ch}",
 "#v-kx .kh-verd{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;",
 "padding:4px 11px;border-radius:999px;border:1px solid;margin-bottom:9px}",
 "#v-kx .kh-verd.ok{color:#0a7a0a;border-color:rgba(12,163,12,.4);background:rgba(12,163,12,.09)}",
 "#v-kx .kh-verd.warn{color:#8a6100;border-color:rgba(250,178,25,.5);background:rgba(250,178,25,.13)}",
 "#v-kx .kh-verd.bad{color:#c0392b;border-color:rgba(208,59,59,.4);background:rgba(208,59,59,.09)}",
 "#v-kx .kh-nba{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:#161615;",
 "color:#fff;border-radius:14px;padding:17px 21px;margin-bottom:14px}",
 "#v-kx .kh-nba .l{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;opacity:.6}",
 "#v-kx .kh-nba .t{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-top:3px}",
 "#v-kx .kh-nba .w{font-size:13px;opacity:.74;margin-top:3px;max-width:66ch}",
 "#v-kx .kh-nba button{margin-left:auto;background:#fff;color:#161615;border:0;border-radius:9px;",
 "padding:11px 19px;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}",
 "#v-kx .kh-nba button:hover{background:#2a78d6;color:#fff}",
 "#v-kx .kh-2{display:grid;gap:12px;grid-template-columns:1.5fr 1fr}",
 "@media(max-width:900px){#v-kx .kh-2{grid-template-columns:1fr}}",
 "#v-kx .kh-row{display:flex;align-items:center;gap:10px;padding:9px 0;",
 "border-bottom:1px solid var(--line,rgba(128,128,128,.16))}",
 "#v-kx .kh-row:last-child{border-bottom:0}",
 "#v-kx .kh-row .g{flex:1;min-width:0}",
 "#v-kx .kh-row b{font-size:13px;font-weight:650}",
 "#v-kx .kh-row .s{font-size:11.5px;opacity:.6}",
 "#v-kx .kh-jump{background:none;border:1px solid var(--line,rgba(128,128,128,.3));border-radius:7px;",
 "padding:5px 11px;font-size:12px;cursor:pointer;color:inherit;white-space:nowrap}",
 "#v-kx .kh-jump:hover{border-color:#2a78d6;color:#2a78d6}",
 "#v-kx svg{display:block;width:100%}",
 "#v-kx .kh-lg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;opacity:.7;margin-top:9px}",
 "#v-kx .kh-lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}"
].join("");
document.head.appendChild(st);

/* ---- funnel, drawn from real state counts -------------------------------- */
function funnel(rows){
 var W=620,rh=34,max=Math.max.apply(null,rows.map(function(r){return r[1];}))||1;
 var ord=["#86b6ef","#5598e7","#2a78d6","#184f95","#0d366b"];
 var s='<svg viewBox="0 0 '+W+' '+(rows.length*rh+6)+'" role="img" aria-label="Loan cycle by state">';
 rows.forEach(function(r,i){
  var w=(r[1]/max)*(W-330), y=i*rh+6;
  s+='<text x="0" y="'+(y+14)+'" font-size="12" font-weight="600" fill="currentColor" '+
     'opacity=".72">'+E(r[0])+'</text>'+
     '<rect x="150" y="'+y+'" width="'+Math.max(w,3)+'" height="22" rx="4" fill="'+ord[Math.min(i,4)]+'"/>'+
     '<text x="'+(150+Math.max(w,3)+9)+'" y="'+(y+15)+'" font-size="12.5" font-weight="700" '+
     'fill="currentColor">'+r[1]+'</text>'+
     '<text x="'+(150+Math.max(w,3)+40)+'" y="'+(y+15)+'" font-size="11" fill="currentColor" '+
     'opacity=".55">'+E(r[2]||"")+'</text>';
 });
 return s+'</svg>';
}

/* ---- horizontal split bar ------------------------------------------------ */
function split(parts){
 var tot=parts.reduce(function(a,p){return a+p[1];},0)||1;
 var s='<div style="display:flex;height:22px;border-radius:7px;overflow:hidden;'+
       'background:rgba(128,128,128,.16)">';
 parts.forEach(function(p,i){
  s+='<div style="width:'+(p[1]/tot*100)+'%;background:'+p[2]+
     (i?';margin-left:2px':'')+'" title="'+E(p[0])+': '+p[1]+'"></div>';});
 s+='</div><div class="kh-lg">'+parts.map(function(p){
   return '<span><i style="background:'+p[2]+'"></i>'+p[1]+' '+E(p[0])+'</span>';}).join("")+'</div>';
 return s;
}

/* ---- shared computation over the live model ------------------------------ */
function model(){
 var bk=[]; try{ bk=CX.book()||[]; }catch(e){}
 var dl=[]; try{ dl=CX.deliveries()||[]; }catch(e){}
 var by=function(f){ return bk.reduce(function(a,x){var k=f(x);a[k]=(a[k]||0)+1;return a;},{}); };
 var sum=function(f){ return bk.reduce(function(a,x){return a+(f(x)||0);},0); };
 var m={
  bk:bk, dl:dl, n:bk.length,
  value:sum(function(f){return f.amt;}),
  state:by(function(f){return f.state;}),
  cycle:by(function(f){return f.cycleState;}),
  crop:by(function(f){return f.crop;}),
  prov:by(function(f){return f.prov;}),
  noDocs:bk.filter(function(f){return !f.docsOk;}),
  noGps :bk.filter(function(f){return !f.gpsOk;}),
  noPcic:bk.filter(function(f){return !f.pcic;}),
  atIssue:dl.filter(function(d){return d.status==="at-issue"||d.atIssue>0;}),
  unpaid:dl.filter(function(d){return !d.paid;})
 };
 m.blocked=bk.filter(function(f){return !f.docsOk||!f.gpsOk||!f.pcic;});
 m.blockedValue=m.blocked.reduce(function(a,f){return a+(f.amt||0);},0);
 m.awaitingRelease=bk.filter(function(f){return f.state==="Approved";});
 m.awaitingValue=m.awaitingRelease.reduce(function(a,f){return a+(f.amt||0);},0);
 /* gate failures, asked of the model rather than assumed */
 m.gateFail=[];
 try{
  bk.slice(0,200).forEach(function(f){
   (CX.gates(f)||[]).forEach(function(g){ if(!g.ok) m.gateFail.push({f:f,g:g}); });
  });
 }catch(e){}
 m.gateByType={};
 m.gateFail.forEach(function(x){ (m.gateByType[x.g.t]=m.gateByType[x.g.t]||[]).push(x); });
 /* CX.gates() answers "could a NEW commitment be released", so a portfolio rule
    such as concentration fails against every record at once. That is a real
    control but it is not a per-file defect, and surfacing it as one would bury
    the 22 files that genuinely need a document. Keep only gates failing on a
    minority of the book. */
 Object.keys(m.gateByType).forEach(function(t){
   if(m.gateByType[t].length > bk.length*0.5) delete m.gateByType[t]; });
 /* repayment cover distribution */
 m.thin=[];
 try{ bk.forEach(function(f){ var r=CX.riskScore(f); if(r&&r.cover&&r.cover<1.5) m.thin.push({f:f,c:r.cover}); }); }catch(e){}
 return m;
}

function blockerRows(m){
 var rows=[];
 if(m.noDocs.length)  rows.push(["Land and tenure documents incomplete",m.noDocs,"docsOk"]);
 if(m.noPcic.length)  rows.push(["PCIC enrolment not effected",m.noPcic,"pcic"]);
 if(m.noGps.length)   rows.push(["Farm boundary not GPS-verified",m.noGps,"gpsOk"]);
 Object.keys(m.gateByType).forEach(function(t){
   rows.push([t+" gate failing",m.gateByType[t].map(function(x){return x.f;}),"gate"]); });
 rows.sort(function(a,b){
   return b[1].reduce(function(x,f){return x+(f.amt||0);},0) -
          a[1].reduce(function(x,f){return x+(f.amt||0);},0); });
 return rows;
}

function blockerCard(m,jump){
 var rows=blockerRows(m);
 if(!rows.length) return '<div class="card"><b>Nothing is blocked</b>'+
   '<div class="sub" style="margin-top:6px">Every file in the book clears its release gates.</div></div>';
 var top=rows[0][1].reduce(function(a,f){return a+(f.amt||0);},0)||1;
 /* the same file often fails more than one check, so these rows overlap and
    must not be added together — the union is m.blocked */
 var union=m.blocked.length, sumRows=rows.reduce(function(a,r){return a+r[1].length;},0);
 return '<div class="card"><b>What is blocking release</b>'+
  '<div class="sub" style="margin:2px 0 10px">Grouped by what each file needs, ranked by value '+
  'unblocked.</div>'+
  rows.slice(0,5).map(function(r,i){
   var val=r[1].reduce(function(a,f){return a+(f.amt||0);},0);
   return '<div class="kh-row"><div class="g"><b>'+E(r[0])+'</b>'+
    '<div class="s">'+r[1].length+' file'+(r[1].length>1?"s":"")+' · '+pesoM(val)+' held up</div>'+
    bar(val/top*100,i===0?"bad":"")+'</div>'+
    (jump?'<button class="kh-jump" data-jump="'+jump+'">Open</button>':'')+'</div>';
  }).join("")+
  (sumRows>union? '<div class="sub" style="margin-top:10px">These rows overlap — <b>'+union+
    ' distinct files</b> are blocked in total, and a file that needs a land document usually needs '+
    'PCIC enrolment too. Do not add the rows together.</div>' : '')+
  '</div>';
}

/* ==========================================================================
   ROLE 1 — KITA OPERATIONS
   ======================================================================== */
function opsHome(){
 var m=model();
 var b=blockerRows(m);
 var topBlock=b[0];
 var topVal=topBlock?topBlock[1].reduce(function(a,f){return a+(f.amt||0);},0):0;
 /* the files worth acting on first are the ones already approved AND blocked —
    clearing those releases money today */
 var actionable=m.blocked.filter(function(f){return f.state==="Approved";});
 var actionableVal=actionable.reduce(function(a,f){return a+(f.amt||0);},0);
 var released=(m.state["Released"]||0)+(m.state["Closed"]||0);
 var deliveryClean=m.dl.length? pct(m.dl.filter(function(d){return d.clean;}).length,m.dl.length):0;
 var verd = actionable.length? "warn":"ok";
 if(actionable.length && actionable.length >= m.awaitingRelease.length*0.5) verd="bad";

 var h='<div class="kh-ans"><div class="kh-who">Kita operations · today</div>'+
  '<div class="kh-verd '+verd+'">'+(verd==="ok"?"✓ Nothing approved is blocked":
    "! "+actionable.length+" of "+m.awaitingRelease.length+
    " approved files are held by paperwork")+'</div>'+
  '<h1 class="kh-h1">'+pesoM(m.value)+' across <em>'+m.n+' farmers</em> — '+
  m.awaitingRelease.length+' approved loans worth '+pesoM(m.awaitingValue)+' are waiting to be released</h1>'+
  '<div class="kh-sub">'+released+' loans have been released or closed. Of the '+
  m.awaitingRelease.length+' still waiting, '+actionable.length+' are held only by paperwork — '+
  pesoM(actionableVal)+' that is already underwritten and not deployed. Every figure here is computed '+
  'from the live book, so it moves when anyone in any console changes a file.</div></div>';

 if(topBlock){
  var jump=firstView("gate","loans","farmers","dash");
  h+='<div class="kh-nba"><div><div class="l">Next best action</div>'+
   '<div class="t">'+E(topBlock[0])+' — '+topBlock[1].length+' file'+
   (topBlock[1].length>1?"s":"")+'</div>'+
   '<div class="w">The largest single block in the book: '+pesoM(topVal)+' held behind one document '+
   'type. Ranked by value unblocked, not by age. Every one of these files has already been '+
   'underwritten.</div></div>'+
   (jump?'<button data-jump="'+jump+'">Open '+E(navName(jump))+'</button>':'')+'</div>';
 }

 h+='<div class="grid g4">'+
  kpi("Book value",pesoM(m.value),m.n+" farmers · "+Object.keys(m.prov).length+" provinces",1)+
  kpi("Released or closed",released,pct(released,m.n)+"% of the book")+
  kpi("Approved, awaiting release",m.awaitingRelease.length,pesoM(m.awaitingValue)+" held")+
  kpi("Delivery receipts clean",deliveryClean+"%",m.dl.length+" receipts · "+
      m.unpaid.length+" unpaid")+
  '</div>';

 h+='<div class="kh-2" style="margin-top:12px">'+
  '<div class="card"><b>Where the book sits in the cycle</b>'+
  '<div class="sub" style="margin:2px 0 10px">Counted by state, never summed across states.</div>'+
  funnel([["Approved",m.state["Approved"]||0,"awaiting release"],
          ["Released",m.state["Released"]||0,"funds out"],
          ["Growing",m.cycle["Growing"]||0,"in season"],
          ["Harvested",m.cycle["Harvested"]||0,"awaiting settlement"],
          ["Completed",m.cycle["Completed"]||0,"settled"]])+
  '<div style="margin-top:14px"><b style="font-size:13px">By crop</b>'+
  split(Object.keys(m.crop).sort(function(a,b){return m.crop[b]-m.crop[a];}).slice(0,4).map(function(k,i){
    return [(CX.CROPS[k]||{n:k}).n,m.crop[k],["#2a78d6","#eb6834","#1baf7a","#86b6ef"][i]];}))+
  '</div></div>'+
  blockerCard(m,firstView("gate","loans","farmers"))+
  '</div>';

 if(m.thin.length){
  h+=note("Repayment cover below 1.5× on "+m.thin.length+" file"+(m.thin.length>1?"s":""),
   "Thinnest is "+E(m.thin.sort(function(a,b){return a.c-b.c;})[0].f.name)+" at "+
   m.thin[0].c.toFixed(2)+"×. Cover is projected crop value against principal, computed by the "+
   "model rather than entered. These are the files where a price move matters most.","warn");
 }
 h+=note("Nothing here is a signed buyer commitment",
  "Buyer volumes in this console sit on the commitment ladder. No farmer is presented as financeable "+
  "on anything below a conditional demand commitment.","acc");
 return h;
}

/* ==========================================================================
   ROLE 2 — LANDBANK OFFICER
   ======================================================================== */
function officerHome(){
 var m=model();
 var ready=m.awaitingRelease.filter(function(f){return f.docsOk&&f.gpsOk&&f.pcic;});
 var waiting=m.awaitingRelease.filter(function(f){return !(f.docsOk&&f.gpsOk&&f.pcic);});
 var judge=m.thin.filter(function(x){return x.f.state==="Approved";});
 var readyVal=ready.reduce(function(a,f){return a+(f.amt||0);},0);
 var jump=firstView("kbfin","queue","home2","policy");

 var h='<div class="kh-ans"><div class="kh-who">Landbank · lending officer · today</div>'+
  '<div class="kh-verd '+(ready.length?"ok":"warn")+'">'+
  (ready.length? "✓ "+ready.length+" files ready for your decision"
               : "! No file is complete yet")+'</div>'+
  '<h1 class="kh-h1"><em>'+ready.length+' of '+m.awaitingRelease.length+'</em> approved files are '+
  'complete and pre-checked</h1>'+
  '<div class="kh-sub">Kita is still collecting on '+waiting.length+'. '+
  (judge.length? judge.length+" file"+(judge.length>1?"s":"")+" sit"+(judge.length>1?"":"s")+
   " below 1.5× cover and need your credit judgement rather than a pre-check. ":"")+
  'The mechanical verification is done; the decision is not.</div></div>';

 if(ready.length){
  h+='<div class="kh-nba"><div><div class="l">Next best action</div>'+
   '<div class="t">Review the '+ready.length+' complete files as one batch</div>'+
   '<div class="w">'+pesoM(readyVal)+' across '+
   Object.keys(ready.reduce(function(a,f){a[f.crop]=1;return a;},{})).length+
   ' crop'+(Object.keys(ready.reduce(function(a,f){a[f.crop]=1;return a;},{})).length>1?"s":"")+
   '. All documents present, boundaries verified, PCIC effected. Reviewing them together makes the '+
   'outliers obvious.</div></div>'+
   (jump?'<button data-jump="'+jump+'">Open '+E(navName(jump))+'</button>':'')+'</div>';
 }

 h+='<div class="grid g4">'+
  kpi("Ready for review",ready.length,pesoM(readyVal)+" · pre-checks passed",1)+
  kpi("Kita resolving",waiting.length,"no action from you")+
  kpi("Need credit judgement",judge.length,"cover below 1.5×")+
  kpi("Released or closed",(m.state["Released"]||0)+(m.state["Closed"]||0),"lifetime on this book")+
  '</div>';

 h+='<div class="kh-2" style="margin-top:12px">'+
  '<div class="card"><b>The '+ready.length+' files, and what was verified on each</b>'+
  '<div class="sub" style="margin:2px 0 10px">Every check below is computed from the record, not '+
  'asserted. The credit decision remains yours.</div>'+
  ready.slice(0,8).map(function(f){
   var cov=null; try{cov=CX.riskScore(f).cover;}catch(e){}
   return '<div class="kh-row"><div class="g"><b>'+E(f.name)+'</b> '+
    '<span class="s">· '+E(f.muni)+' · '+E((CX.CROPS[f.crop]||{n:f.crop}).n)+
    ' · '+f.ha+' ha</span>'+
    '<div class="s">'+peso(f.amt)+(cov?' · cover '+cov.toFixed(2)+'×':'')+
    ' · docs ✓ boundary ✓ PCIC ✓</div></div>'+
    chip(cov&&cov>=1.5?"Ready":"Judgement",cov&&cov>=1.5?"ok":"warn")+'</div>';
  }).join("")+
  (ready.length>8?'<div class="sub" style="margin-top:8px">and '+(ready.length-8)+' more</div>':'')+
  '</div>'+
  blockerCard(m,jump)+
  '</div>';

 h+=note("What the buyer evidence does and does not do",
  "The repayment source is identified before release and the payment instruction routes settlement to "+
  "the Landbank account. <b>Whether the buyer's undertaking is enforceable by Landbank, who is not a "+
  "party to the Kita–Buyer agreement, has not been confirmed by counsel.</b> That question is open.","warn");
 return h;
}

/* ==========================================================================
   ROLE 3 — LANDBANK COMMAND CENTRE
   ======================================================================== */
function centreHome(){
 var m=model();
 var released=(m.state["Released"]||0)+(m.state["Closed"]||0);
 var settled=m.cycle["Completed"]||0;
 var exposure=m.bk.filter(function(f){return f.state!=="Closed";})
                  .reduce(function(a,f){return a+(f.amt||0);},0);
 var provs=Object.keys(m.prov).sort(function(a,b){return m.prov[b]-m.prov[a];});
 var topProv=provs[0], conc=pct(m.prov[topProv],m.n);
 var jump=firstView("kbfin","home","prod","repay","pipe");

 var h='<div class="kh-ans"><div class="kh-who">Landbank · AGRISENSO Plus · programme</div>'+
  '<div class="kh-verd '+(conc>50?"warn":"ok")+'">'+
  (conc>50? "! "+topProv+" is "+conc+"% of the book" : "✓ Exposure inside tolerance")+'</div>'+
  '<h1 class="kh-h1">'+pesoM(exposure)+' outstanding across <em>'+
  (m.n-(m.state["Closed"]||0))+' live files</em>, '+settled+' cycles settled</h1>'+
  '<div class="kh-sub">'+released+' of '+m.n+' files have been released. Concentration, cover and '+
  'delivery integrity below are computed from the same book the officers work in.</div></div>';

 h+='<div class="kh-nba"><div><div class="l">Next best action</div>'+
  '<div class="t">'+(m.blocked.length?
    "Unblock "+pesoM(m.blockedValue)+" sitting behind documentation":
    "Review concentration in "+topProv)+'</div>'+
  '<div class="w">'+(m.blocked.length?
    m.blocked.length+" approved files cannot be released until documentation clears. That is throughput "+
    "the programme has already underwritten and is not deploying.":
    topProv+" carries "+m.prov[topProv]+" of "+m.n+" files. Single-province exposure is the "+
    "concentration control most likely to bind first.")+'</div></div>'+
  (jump?'<button data-jump="'+jump+'">Open '+E(navName(jump))+'</button>':'')+'</div>';

 h+='<div class="grid g4">'+
  kpi("Outstanding exposure",pesoM(exposure),(m.n-(m.state["Closed"]||0))+" live files",1)+
  kpi("Cycles settled",settled,pct(settled,m.n)+"% of the book")+
  kpi("Largest province",topProv,conc+"% of files")+
  kpi("Files below 1.5× cover",m.thin.length,"price sensitivity concentrated here")+
  '</div>';

 h+='<div class="kh-2" style="margin-top:12px">'+
  '<div class="card"><b>Where the programme is deployed</b>'+
  '<div class="sub" style="margin:2px 0 10px">By province, then by crop. Both are concentration '+
  'controls and they are not the same control.</div>'+
  split(provs.map(function(p,i){return [p,m.prov[p],["#2a78d6","#eb6834","#1baf7a"][i]||"#86b6ef"];}))+
  '<div style="margin-top:16px">'+
  funnel([["Approved",m.state["Approved"]||0,"awaiting release"],
          ["Released",m.state["Released"]||0,"funds out"],
          ["Growing",m.cycle["Growing"]||0,"in season"],
          ["Harvested",m.cycle["Harvested"]||0,"awaiting settlement"],
          ["Completed",m.cycle["Completed"]||0,"settled"]])+
  '</div></div>'+
  blockerCard(m,jump)+
  '</div>';
 return h;
}

/* ==========================================================================
   ROLE 4 — BUYER
   ======================================================================== */
function buyerHome(){
 var m=model();
 var CR=(window.CX&&CX.CROPS)||{};
 /* qualified supply = financed farms actually in the ground, by crop */
 var growing=m.bk.filter(function(f){
   return f.cycleState==="Growing"||f.cycleState==="Harvested"||f.state==="Released";});
 var supply={};
 growing.forEach(function(f){
   var c=CR[f.crop]; if(!c) return;
   supply[f.crop]=(supply[f.crop]||0)+(c.yld||0)*(f.ha||0)/1000; });
 var crops=Object.keys(supply).sort(function(a,b){return supply[b]-supply[a];});
 var lead=crops[0]||"palay";
 var leadMT=Math.round(supply[lead]||0);
 var bs=[]; try{ bs=CX.buyers()||[]; }catch(e){}
 var signed=bs.filter(function(b){return /^contracted$/i.test(b.status||"")||b.state==="Contracted";});
 var jump=firstView("supply","demand","struct","ready","map","ord");

 var h='<div class="kh-ans"><div class="kh-who">Institutional buyer · supply position</div>'+
  '<div class="kh-verd warn">! Qualified forecast is not contracted volume</div>'+
  '<h1 class="kh-h1"><em>'+num(leadMT)+' MT</em> of '+E((CR[lead]||{n:lead}).n)+
  ' is financed and in the ground</h1>'+
  '<div class="kh-sub">Qualified means a financed farm, a validated plan and a crop at a known stage. '+
  growing.length+' farms across '+crops.length+' crops are at that standard right now. '+
  'It is a forecast, not a commitment by anyone.</div></div>';

 h+='<div class="kh-nba"><div><div class="l">Next best action</div>'+
  '<div class="t">Confirm which of the '+num(leadMT)+' MT you want reserved</div>'+
  '<div class="w">Volume moves from qualified to allocated only when a buyer commits. Until then it '+
  'is visible to every buyer on the platform and allocated to none.</div></div>'+
  (jump?'<button data-jump="'+jump+'">Open '+E(navName(jump))+'</button>':'')+'</div>';

 h+='<div class="grid g4">'+
  kpi("Qualified forecast",num(leadMT)+" MT",E((CR[lead]||{n:lead}).n)+" · financed and planted",1)+
  kpi("Farms behind it",growing.length,"validated plans")+
  kpi("Under signed contract",signed.length?signed.length+" buyer"+(signed.length>1?"s":""):"0 MT",
      signed.length?"see the commitment ladder":"no agreement executed")+
  kpi("Crops available",crops.length,crops.slice(0,3).map(function(k){
      return (CR[k]||{n:k}).n;}).join(", "))+
  '</div>';

 h+='<div class="kh-2" style="margin-top:12px">'+
  '<div class="card"><b>Qualified supply by crop</b>'+
  '<div class="sub" style="margin:2px 0 10px">Derived from financed hectares × the modelled yield '+
  'for the crop, counted only where the crop is actually in the ground.</div>'+
  crops.slice(0,6).map(function(k){
   var mt=Math.round(supply[k]), top=Math.round(supply[crops[0]])||1;
   var n=growing.filter(function(f){return f.crop===k;}).length;
   return '<div class="kh-row"><div class="g"><b>'+E((CR[k]||{n:k}).n)+'</b>'+
    '<div class="s">'+n+' farm'+(n>1?"s":"")+' · '+num(mt)+' MT expected</div>'+
    bar(mt/top*100,k===crops[0]?"":"")+'</div>'+
    (jump?'<button class="kh-jump" data-jump="'+jump+'">View</button>':'')+'</div>';
  }).join("")+'</div>'+
  '<div class="card"><b>Where each relationship actually is</b>'+
  '<div class="sub" style="margin:2px 0 10px">The ladder is the control. Volume below a conditional '+
  'demand commitment causes no loan.</div>'+
  bs.slice(0,7).map(function(b){
   var s=b.state||b.status||"lead";
   var fin=/contract|allocat|commit/i.test(s);
   return '<div class="kh-row"><div class="g"><b>'+E(b.n)+'</b>'+
    '<div class="s">'+E((CR[b.crop]||{n:b.crop}).n)+' · '+E(b.loc||"")+'</div></div>'+
    chip(s,fin?"ok":"mut")+'</div>';}).join("")+
  '</div></div>';

 h+=note("No signed offtake agreement is represented anywhere in this app",
  "Every buyer figure is illustrative. No farmer is presented to Landbank as financeable on the "+
  "strength of an indication, an interest or an LOI.","bad");
 return h;
}

/* ---- nav label lookup ---------------------------------------------------- */
function navName(k){
 var v=(window.VIEWS||[]).filter(function(x){return x.k===k;})[0];
 return v?v.n:k;
}

/* ---- which role is this app? -------------------------------------------- */
function role(){
 var t=(document.title||"").toLowerCase();
 if(t.indexOf("officer")>=0||t.indexOf("workbench")>=0) return "officer";
 if(t.indexOf("landbank")>=0) return "centre";
 if(t.indexOf("buyer")>=0) return "buyer";
 return "ops";
}
var RENDER={ops:opsHome,officer:officerHome,centre:centreHome,buyer:buyerHome};

/* ---- mount --------------------------------------------------------------- */
function mount(){
 if(!ready()){ setTimeout(mount,80); return; }
 if(document.getElementById("v-kx")) return;
 var main=document.getElementById("main");
 var d=document.createElement("div"); d.className="view"; d.id="v-kx";
 main.insertBefore(d,main.firstChild);
 var r=RENDER[role()];
 H.role=role();
 var cur=window.VIEWS.slice();
 if(!cur.some(function(v){return v.k==="kx";}))
   cur.unshift({k:"kx",n:(role()==="officer"?"My day":"Today"),r:function(){
     try{ return r(); }
     catch(e){ return note("Landing unavailable",E(e.message),"bad"); }}});
 /* honour a ?v= deep link, otherwise land on Today */
 var q=null; try{ q=(location.search.match(/v=(\w+)/)||[])[1]; }catch(e){}
 setNav(cur, (q&&cur.some(function(v){return v.k===q;}))?q:"kx");

 /* jump buttons */
 document.addEventListener("click",function(ev){
  var b=ev.target.closest?ev.target.closest("[data-jump]"):null;
  if(!b) return;
  ev.preventDefault();
  try{ window.go(b.getAttribute("data-jump")); }catch(e){}
 });

 /* stay live: re-render when the shared model changes */
 try{ CX.onChange(function(){ if(window.CURV==="kx") window.render(); }); }catch(e){}
 window.addEventListener("storage",function(e){
  if(window.CURV==="kx"&&/cx_/.test(e.key||"")) setTimeout(function(){window.render();},60); });
}
if(document.readyState==="complete"||document.readyState==="interactive") setTimeout(mount,240);
else document.addEventListener("DOMContentLoaded",function(){setTimeout(mount,240);});
})();

</script>
