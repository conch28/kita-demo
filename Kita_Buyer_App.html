<style>/* Kita design system — institutional, dense, neutral.
   Reference points: Stripe, Linear, Mercury. Not a government portal. */
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
:root{
 --bg:#ffffff; --canvas:#fafafa; --ink:#0a0a0a; --ink2:#404040; --mut:#737373;
 --line:#e5e5e5; --line2:#f0f0f0;
 --accent:#4f46e5; --accent-w:#eef2ff;
 --ok:#047857; --ok-w:#ecfdf5; --warn:#b45309; --warn-w:#fffbeb;
 --bad:#b91c1c; --bad-w:#fef2f2; --info:#0369a1; --info-w:#f0f9ff;
 --r:8px; --sh:0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.06);
}
body{margin:0;background:var(--canvas);color:var(--ink);
 font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif}
/* ---- top bar ---- */
#top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;
 background:var(--bg);border-bottom:1px solid var(--line);padding:0 18px;height:52px}
.brand{font-weight:640;font-size:14px;letter-spacing:-.2px;display:flex;align-items:center;gap:7px}
.brand .mk{width:19px;height:19px;border-radius:5px;background:var(--ink);color:#fff;
 display:grid;place-items:center;font-size:11px;font-weight:700}
.brand em{font-style:normal;color:var(--mut);font-weight:450}
#nav{display:flex;gap:1px;margin-left:8px;flex-wrap:wrap}
#nav button{background:none;border:0;padding:6px 11px;border-radius:6px;cursor:pointer;
 font:inherit;font-size:13px;color:var(--mut);white-space:nowrap}
#nav button:hover{background:var(--line2);color:var(--ink)}
#nav button.on{background:var(--ink);color:#fff}
.sp{flex:1}
.util{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--mut)}
.util button{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;
 cursor:pointer;font:inherit;font-size:12px;color:var(--ink2)}
.util button:hover{border-color:var(--mut)}
/* ---- layout ---- */
#main{max-width:1360px;margin:0 auto;padding:20px 18px 64px}
.view{display:none}.view.on{display:block}
h1.pg{font-size:19px;font-weight:640;letter-spacing:-.3px;margin:0 0 3px}
p.lede{color:var(--mut);margin:0 0 18px;max-width:76ch;font-size:13px}
h2.sec{font-size:11px;font-weight:640;letter-spacing:.55px;text-transform:uppercase;
 color:var(--mut);margin:26px 0 9px}
h3{font-size:13.5px;font-weight:620;margin:0 0 7px;letter-spacing:-.1px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
 padding:14px 15px;box-shadow:var(--sh)}
.card+.card{margin-top:10px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:1080px){.g4,.g5,.g6{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
/* ---- metric ---- */
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.kpi .l{font-size:11px;color:var(--mut);letter-spacing:.2px;margin-bottom:5px}
.kpi .v{font-size:21px;font-weight:640;letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .d{font-size:11.5px;color:var(--mut);margin-top:4px}
.kpi.hi{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
/* ---- table ---- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;font-weight:620;letter-spacing:.5px;text-transform:uppercase;
 color:var(--mut);padding:0 10px 7px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click:hover{background:var(--canvas);cursor:pointer}
.right{text-align:right;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.sub{font-size:11.5px;color:var(--mut);margin-top:1px}
/* ---- chips ---- */
.chip{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:560;
 line-height:1.5;white-space:nowrap}
.c-ok{background:var(--ok-w);color:var(--ok)} .c-warn{background:var(--warn-w);color:var(--warn)}
.c-bad{background:var(--bad-w);color:var(--bad)} .c-info{background:var(--info-w);color:var(--info)}
.c-mut{background:var(--line2);color:var(--mut)} .c-acc{background:var(--accent-w);color:var(--accent)}
/* ---- notes ---- */
.note{border:1px solid var(--line);border-left:3px solid var(--mut);border-radius:6px;
 padding:10px 12px;margin:10px 0;font-size:12.5px;background:var(--bg);color:var(--ink2)}
.note b{display:block;color:var(--ink);margin-bottom:3px;font-size:13px}
.note.ok{border-left-color:var(--ok)} .note.warn{border-left-color:var(--warn)}
.note.bad{border-left-color:var(--bad)} .note.acc{border-left-color:var(--accent)}
/* ---- bars ---- */
.bar{height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.spark{display:flex;align-items:flex-end;gap:2px;height:30px}
.spark i{flex:1;background:var(--accent-w);border-radius:1px 1px 0 0;min-height:2px}
.spark i.on{background:var(--accent)}
/* ---- buttons ---- */
.btn{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:7px 13px;font:inherit;
 font-size:12.5px;font-weight:540;cursor:pointer}
.btn:hover{opacity:.88}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--mut);opacity:1}
.btn.sm{padding:4px 9px;font-size:11.5px}
/* ---- modal ---- */
#modal{position:fixed;inset:0;background:rgba(10,10,10,.35);display:none;z-index:200;
 align-items:flex-start;justify-content:center;padding:38px 16px;overflow:auto}
#modal.on{display:flex}
#mbody{background:var(--bg);border-radius:11px;max-width:940px;width:100%;padding:22px 24px;
 box-shadow:0 20px 50px rgba(0,0,0,.2)}
.mclose{float:right;background:none;border:0;font-size:20px;cursor:pointer;color:var(--mut);line-height:1}
/* ---- kv ---- */
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--mut)} .kv b{font-weight:580;font-variant-numeric:tabular-nums;text-align:right}
/* ---- agent ---- */
.agent{border:1px solid var(--line);border-radius:7px;padding:10px 12px;background:var(--bg)}
.agent .hd{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.agent .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.agent .dot.bad{background:var(--warn)}
.agent .nm{font-weight:600;font-size:12.5px}
.agent .st{font-size:12px;color:var(--ink2)}
.agent ul{margin:6px 0 0;padding-left:16px;font-size:12px;color:var(--ink2)}
.agent .ev{font-size:11px;color:var(--mut);margin-top:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);
 color:#fff;padding:9px 16px;border-radius:7px;font-size:13px;z-index:900;opacity:0;
 transition:opacity .18s;pointer-events:none}
.lst{margin:6px 0 8px;padding-left:18px;font-size:13px;line-height:1.9;color:var(--ink2)}
code{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--line2);padding:1px 5px;border-radius:4px}
.bhero{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:18px 20px;
 background:linear-gradient(135deg,var(--canvas),var(--bg));border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.bh-l{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut)}
.bh-n{font-size:26px;font-weight:680;letter-spacing:-.02em;margin:3px 0 5px}
.bh-s{font-size:12.5px;color:var(--mut);max-width:62ch;line-height:1.5}
.bh-r{text-align:right;border-left:3px solid var(--accent);padding-left:14px;min-width:210px}
.bh-r .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut)}
.bh-r .v{font-size:28px;font-weight:680;letter-spacing:-.02em}
.bh-r .d{font-size:11px;color:var(--mut);margin-top:2px}
.gapcard{padding:0;overflow:hidden}
.gc-hd{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 15px}
.gc-pct{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1;text-align:right}
.gc-pct span{display:block;font-size:9.5px;font-weight:500;text-transform:uppercase;letter-spacing:.09em;color:var(--mut)}
.gc-pct.ok{color:var(--ok)}.gc-pct.warn{color:var(--warn)}.gc-pct.bad{color:var(--bad)}
.gc-bar{height:9px;background:var(--line);position:relative;margin:0}
.gc-bar i{display:block;height:100%;background:var(--accent)}
.gc-bar em{position:absolute;top:-3px;width:2px;height:15px;background:var(--ink)}
table.gc{width:100%;border-collapse:collapse}
table.gc td{padding:9px 15px;font-size:12.5px;border-top:1px solid var(--line)}
table.gc tr.need td{background:var(--warn-w);font-weight:500}
.frm{padding:14px 15px}
.frow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.frow label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);min-width:88px}
.fsel{display:flex;gap:6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.fitem{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--canvas)}
.fl{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.fv{font-size:12.5px;font-weight:520;margin-top:2px;line-height:1.35}
.fv input{font:inherit;font-size:12.5px;font-weight:520;border:none;border-bottom:1px solid var(--accent);
 background:transparent;color:var(--ink);width:78px;padding:1px 0}
.fv input:disabled{border-bottom-color:var(--line);color:var(--mut)}
.ans{border:2px solid var(--accent);border-radius:14px;padding:16px 18px;margin:14px 0;background:var(--accent-w)}
.ans-l{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:650}
.ans-t{font-size:16.5px;font-weight:600;line-height:1.45;margin:6px 0 5px;letter-spacing:-.01em}
.ans-s{font-size:12.5px;color:var(--mut);line-height:1.5}
.ans-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);
 border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:13px 0 11px}
.av{background:var(--bg);padding:10px 12px}
.av .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);line-height:1.3}
.av .v{font-size:17px;font-weight:660;letter-spacing:-.02em;margin-top:2px}
.ans-band{font-size:11.5px;line-height:1.55;color:var(--ink);background:var(--bg);border-radius:9px;padding:9px 11px}
table.sched td,table.sched th{padding:5px 7px;font-size:11px}
table.sched td:first-child,table.sched th:first-child{text-align:left;white-space:nowrap;font-weight:520}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.dot.p{background:var(--accent)}
.provmap{margin-top:9px}
.pm{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.pm-n{font-size:12px;min-width:106px}
.pm-b{flex:1;height:14px;background:var(--line);border-radius:3px;overflow:hidden}
.pm-b i{display:block;height:100%;background:var(--accent)}
.pm-v{font-size:11.5px;color:var(--mut);min-width:62px;text-align:right}
tr.mine td{background:var(--accent-w)}
.funnel{display:flex;gap:5px;margin-bottom:12px;overflow-x:auto}
.fn{flex:1;min-width:96px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:var(--canvas);opacity:.5}
.fn.on{opacity:1;background:var(--bg);border-color:var(--accent)}
.fn-n{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);line-height:1.25}
.fn-c{font-size:21px;font-weight:670;letter-spacing:-.02em;margin-top:3px}
.fn-m{font-size:10.5px;color:var(--mut)}
.flow{border-left:2px solid var(--line);margin:6px 0 0 11px;padding-left:0}
.fl{display:flex;gap:12px;padding:0 0 15px 17px;position:relative}
.fl-d{position:absolute;left:-13px;top:0;width:24px;height:24px;border-radius:50%;background:var(--bg);
 border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:680;color:var(--mut)}
.fl.done .fl-d{background:var(--ok);border-color:var(--ok);color:#fff}
.fl.active .fl-d{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 5px var(--accent-w)}
.fl-n{font-size:13.5px;font-weight:620}
.fl.waiting .fl-n{color:var(--mut)}
.fl-t{font-size:11.5px;color:var(--mut);line-height:1.5;margin-top:2px;max-width:76ch}
.fl-a{font-size:10.5px;color:var(--ok);margin-top:3px;font-weight:560}
.fl-a.mut{color:var(--mut);font-weight:400}
table.kv2 td{padding:7px 11px;font-size:12.5px;border-bottom:1px solid var(--line)}
table.kv2 td:first-child{color:var(--mut);width:26%}
.askbar{display:flex;gap:8px}
.askbar input{flex:1;font:inherit;font-size:13px;padding:9px 12px;border:1px solid var(--line);
 border-radius:9px;background:var(--canvas);color:var(--ink)}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.aiq{font-size:13px;font-weight:600;margin:4px 0 7px}
.aia{font-size:15px;font-weight:600;line-height:1.45;letter-spacing:-.01em;margin-bottom:8px}
ul.ol,ol.ol{margin:6px 0 8px;padding-left:19px}
ul.ol li,ol.ol li{font-size:12.5px;line-height:1.6;margin-bottom:4px}
.vp p{font-size:12.5px;color:var(--mut);line-height:1.55;margin:5px 0 0}
.chip.c-acc{background:var(--accent-w);color:var(--accent)}
/* ---- Approval & Signature Centre ---- */
.tl-wrap{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0;margin:14px 0;overflow:hidden}
.tl-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--canvas)}
.tl-t{font-size:15px;font-weight:650;letter-spacing:-.01em}
.tl-s{font-size:11.5px;color:var(--mut);margin-top:2px}
.tl-holder{text-align:right;border-left:3px solid var(--accent);padding-left:12px;min-width:190px}
.tl-holder .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut)}
.tl-holder .v{font-size:14px;font-weight:640;margin-top:1px}
.tl-holder .d{font-size:11px;color:var(--mut)}
.tl-rail{display:flex;align-items:stretch;padding:18px 14px 14px;overflow-x:auto;gap:0}
.tl-node{flex:1 1 0;min-width:132px;text-align:center;position:relative;padding:0 6px}
.tl-dot{width:22px;height:22px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;
 font-size:11px;font-weight:700;border:2px solid var(--line);background:var(--bg);color:var(--mut)}
.tl-node.done .tl-dot{background:var(--ok);border-color:var(--ok);color:#fff}
.tl-node.active .tl-dot{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 5px var(--accent-w)}
.tl-node.wet.active .tl-dot{background:var(--warn);border-color:var(--warn);box-shadow:0 0 0 5px var(--warn-w)}
.tl-org{display:inline-block;font-size:8.5px;text-transform:uppercase;letter-spacing:.08em;padding:1px 6px;border-radius:4px;margin-bottom:4px}
.tl-org.cx{background:var(--accent-w);color:var(--accent)}
.tl-org.lb{background:var(--ok-w);color:var(--ok)}
.tl-org.mp{background:var(--warn-w);color:var(--warn)}
.tl-n{font-size:11.5px;font-weight:620;line-height:1.25}
.tl-a{font-size:10.5px;color:var(--mut);margin-top:1px}
.tl-sig{font-size:9.5px;color:var(--ok);margin-top:6px;line-height:1.35}
.tl-live{font-size:9.5px;font-weight:700;color:var(--accent);margin-top:6px;letter-spacing:.03em}
.tl-node.wet.active .tl-live{color:var(--warn)}
.tl-wait{font-size:9.5px;color:var(--mut);margin-top:6px;opacity:.65}
.tl-v{font-size:9px;color:var(--mut);font-weight:400;letter-spacing:0}
.tl-link{flex:0 0 26px;height:2px;background:var(--line);align-self:flex-start;margin-top:10px}
.tl-link.on{background:var(--ok)}
.tl-foot{display:flex;gap:0;border-top:1px solid var(--line);background:var(--canvas)}
.tl-m{flex:1;padding:10px 14px;border-right:1px solid var(--line)}
.tl-m.wide{flex:2.2;border-right:none}
.tl-m .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.tl-m .v{font-size:17px;font-weight:650;margin-top:1px}
.tl-m .v.sm{font-size:13px}
.tl-m .v.bad{color:var(--bad)}
.tl-m .d{font-size:10.5px;color:var(--mut);margin-top:2px;line-height:1.35}
.tl-bar{height:4px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.tl-bar i{display:block;height:100%;background:var(--ok)}
.tl-re{padding:10px 16px;background:var(--warn-w);border-top:1px solid var(--line);font-size:11.5px;line-height:1.5}
.sigpanel{border-left:3px solid var(--line)}
.sigpanel.live{border-left-color:var(--accent)}
.sp-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:10px}
.sp-acts{display:flex;flex-wrap:wrap;gap:7px}
.ab{font:inherit;font-size:10.5px;font-weight:640;letter-spacing:.03em;padding:7px 11px;border-radius:7px;
 border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.ab:hover:not(:disabled){border-color:var(--accent)}
.ab:disabled{opacity:.4;cursor:not-allowed}
.ab.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.ab.danger{color:var(--bad);border-color:var(--bad-w)}
.ab.ghost{background:transparent}
.sp-sig{margin-top:11px;padding:9px 11px;background:var(--ok-w);border-radius:8px;font-size:11.5px}
.sp-note{margin-top:5px;font-style:italic;color:var(--mut);font-size:11px}
table.sigboard tr.pend td{background:var(--canvas)}
.pk-hd{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px}
.pk-qr{text-align:center}
.qr{width:40px;height:40px;margin:0 auto 3px;
 background:repeating-conic-gradient(var(--ink) 0 25%,transparent 0 50%) 0 0/9px 9px;border:2px solid var(--ink)}
table.pk tr.wet td{background:var(--warn-w)}
.sep{color:var(--mut)}
.mdl{position:fixed;inset:0;background:rgba(10,12,16,.55);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px}
.mdl-box{background:var(--bg);border:1px solid var(--line);border-radius:14px;max-width:660px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.mdl-hd{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.mdl-steps{display:flex;flex-wrap:wrap;gap:4px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--canvas)}
.ms{font-size:9.5px;color:var(--mut);display:flex;align-items:center;gap:4px;padding:2px 7px 2px 2px;border-radius:20px}
.ms i{width:15px;height:15px;border-radius:50%;background:var(--line);color:var(--mut);display:flex;align-items:center;
 justify-content:center;font-style:normal;font-size:8.5px;font-weight:700}
.ms.done{color:var(--ok)}.ms.done i{background:var(--ok);color:#fff}

/* ---------- 3. The margin bridge --------------------------------
   Four operational causes, each measurable and each fixable. This
   is the difference between a company that quotes a target and one

/* ---------- 4. Gates -------------------------------------------- */
var CAPS={maxCropShare:.40,maxPerCropMuni:3500000};
function gateSoil(k,m){
 var c=CROPS[k],mu=muni(m);
 if(!mu)return {id:"soil",ok:true,t:"Soil suitability",d:"Site not recognised."};
 var ok=(c.soilOk||[]).indexOf(mu.soil)>=0;
 if(ok)return {id:"soil",ok:true,t:"Soil suitability",
  d:c.n+" on "+SOIL[mu.soil].n.toLowerCase()+" in "+m+". "+SOIL[mu.soil].note};
 return {id:"soil",ok:false,t:"Soil suitability",
  d:c.n+" cannot be sited on "+SOIL[mu.soil].n.toLowerCase()+". "+SOIL[mu.soil].note+
    (c.needsDrainage?" A yam tuber in flooded clay rots; no planting date changes that.":""),
  fix:"Move to "+(c.soilOk||[]).map(function(s){return SOIL[s].n.toLowerCase();}).join(" or ")+
      " — for "+c.n.toLowerCase()+" in this corridor that means "+
      MUNIS.filter(function(x){return (c.soilOk||[]).indexOf(x.soil)>=0;}).slice(0,4)
        .map(function(x){return x.m;}).join(", ")+"."};
}
function gateConc(k,m,amt,book){
 var tot=book.reduce(function(a,b){return a+b.amt;},0)+amt;
 var same=book.filter(function(b){return b.crop===k&&b.muni===m;}).reduce(function(a,b){return a+b.amt;},0)+amt;
 var ct=book.filter(function(b){return b.crop===k;}).reduce(function(a,b){return a+b.amt;},0)+amt;
 var share=tot?ct/tot:0;
 if(same>CAPS.maxPerCropMuni)return {id:"conc",ok:false,t:"Concentration",
  d:CROPS[k].n+" in "+m+" would reach "+peso(same)+", over the "+peso(CAPS.maxPerCropMuni)+" single-municipality cap.",
  fix:"Release into another municipality in the cluster."};
 if(share>CAPS.maxCropShare)return {id:"conc",ok:false,t:"Concentration",
  d:CROPS[k].n+" would be "+(share*100).toFixed(0)+"% of the book, over the "+(CAPS.maxCropShare*100)+"% ceiling.",
  fix:"Grow the rest of the book first, or split the commitment across two seasons."};
 return {id:"conc",ok:true,t:"Concentration",
  d:CROPS[k].n+" at "+(share*100).toFixed(0)+"% of book, inside the "+(CAPS.maxCropShare*100)+"% ceiling."};
}
function gateBuyer(rec){
 var alloc=rec.buyerId;
 if(alloc)return {id:"buyer",ok:true,t:"Buyer allocation",d:"Allocated to "+alloc+" before release."};
 return {id:"buyer",ok:false,t:"Buyer allocation",
  d:"No buyer allocated. The loan would be released into an unsold crop, which is how a cohort ends up selling at whatever the trader offers on the day.",
  fix:"Allocate to a contracted buyer, or hold the release."};
}
function gates(rec,book){
 return [gateSoil(rec.crop,rec.muni),gateConc(rec.crop,rec.muni,rec.amt,(book||[]).filter(function(b){return b.id!==rec.id;})),gateBuyer(rec)];
}
function gatesPass(g){return g.every(function(x){return x.ok;});}

/* ---------- 5. Buyer-first demand cascade ----------------------- */
function cascade(dm){
 var c=CROPS[dm.crop], out={crop:c,demand:dm};
 var finishedKg=dm.mt*1000;
 out.finishedKg=finishedKg;
 out.freshKg = c.processed ? finishedKg*c.conv : finishedKg;
 out.buffer  = out.freshKg*1.12;
 out.ha      = out.buffer/c.yld;
 out.farmers = Math.max(1,Math.ceil(out.ha/(c.k==="palay"?1.6:1.3)));
 out.loan    = out.ha*c.loanHa;
 out.inputs  = out.loan*c.inputShare;
 out.grossToFarmers = out.freshKg*c.price;

 out.sites=MUNIS.filter(function(x){return (c.soilOk||[]).indexOf(x.soil)>=0 && (c.provs||[]).indexOf(x.p)>=0;});
 return out;
}

function save(s){write(SKEY,s);try{BC&&BC.postMessage({k:"sync"});}catch(e){}fire();}
var subs=[];
function onChange(f){subs.push(f);}
function fire(){subs.forEach(function(f){try{f();}catch(e){}});}

 return "₱"+n.toLocaleString("en-PH");
}

function seed(force){
 var s=state();
 if(!force&&s.farmers&&s.farmers.length&&s.v===3)return s;
 var recs=[],n=0;
 var MIX=[["palay",26],["corn",18],["ube",14],["chili",7],["coconut",5]];

  for(var j=0;j<cnt;j++){

   var r3=rnd("s"+k+j+n);
   if(r3<.30){st="in-season";coll=0;}

 });
 recs.forEach(function(f){f.risk=riskScore(f,recs).score;});
 var s2={farmers:recs,buyers:BUYERS,opened:"2026-09-01",v:3};

function normalise(bk){
 /* Premium Kinampay is the strategic crop, so a slice of the Pampanga ube cohort
    is contracted on it. Facilities are resized to the corrected loan-per-hectare
    in the same pass — every downstream hectare figure depends on this. */
 var n=0;
 bk.forEach(function(f){
  if(f.crop==="ube"&&f.prov==="Pampanga"&&n<7){f.crop="ubep";f.variety="Kinampay";n++;}
  var c=CROPS[f.crop];
  if(c&&c.loanHa)f.amt=Math.round(f.ha*c.loanHa/1000)*1000;
 });
 return bk;
}
function book(){return normalise(state().farmers||[]);}
function buyers(){return state().buyers||BUYERS;}

/* ---------- 7. Risk ---------------------------------------------- */
function riskScore(f,bk){
 bk=bk||book();
 var c=CROPS[f.crop],pts=[],s=0;
 var g=gates(f,bk),bad=g.filter(function(x){return !x.ok;});
 if(bad.length){s+=22*bad.length;pts.push({l:"Gate not clear",d:bad.map(function(x){return x.t;}).join(", "),bad:true});}
 else pts.push({l:"All release gates clear",d:"Soil, concentration and buyer allocation verified.",bad:false});
 if(!f.buyerId){s+=18;pts.push({l:"No buyer allocated",d:"Output has no committed home.",bad:true});}
 if(!f.docsOk){s+=12;pts.push({l:"Documents incomplete",d:"Submission package has open items.",bad:true});}
 if(!f.gpsOk){s+=10;pts.push({l:"Farm polygon unverified",d:"No GPS boundary captured — duplicate-farm risk.",bad:true});}
 if(!f.pcic){s+=8;pts.push({l:"No PCIC cover",d:"Weather loss has no parametric offset.",bad:true});}
 else pts.push({l:"PCIC parametric enrolled",d:"Payout in 3–5 days after the storm exits.",bad:false});
 if(c.extHarvest){s-=10;pts.push({l:"Weekly settlement",d:"Repaid from 26 weekly deliveries, not one harvest.",bad:false});}
 else if(!c.perennial){s+=6;pts.push({l:"Single-harvest settlement",d:"One repayment moment.",bad:true});}
 var cover=projValue(f)/(f.amt||1);
 if(cover<1.35){s+=14;pts.push({l:"Thin repayment cover",d:"Projected crop value is "+cover.toFixed(2)+"× the loan.",bad:true});}
 else pts.push({l:"Repayment cover "+cover.toFixed(2)+"×",d:"Projected crop value against principal.",bad:false});
 s=Math.max(0,Math.min(100,s));
 return {score:s,band:s<20?"low":(s<45?"watch":"high"),factors:pts,cover:cover};
}
function projValue(f){var c=CROPS[f.crop];return c.yld*f.ha*c.price;}

function inputKit(f){
 var c=CROPS[f.crop];
 return (c.inputs||[]).map(function(L,i){
  var sell=Math.round(L[1]*f.ha);
  return {sku:"SKU-"+c.k.toUpperCase().slice(0,3)+"-"+String(i+1).padStart(2,"0"),
   item:L[0], sell:sell,
   };
 });
}
function loanSplit(f){
 var c=CROPS[f.crop];
 return {total:f.amt,input:Math.round(f.amt*c.inputShare),cash:Math.round(f.amt*(1-c.inputShare))};
}
function deliveries(){
 var out=[],bk=book();
 bk.forEach(function(f){
  if(f.status==="in-season"&&rnd(f.id+"d")>.5)return;
  var kit=inputKit(f), lines=[], ex=[];
  kit.forEach(function(L,i){
   var r=rnd(f.id+"L"+i), plan=L.sell, deliv=plan, conf=true, code=null;
   if(r<.016){deliv=Math.round(plan*.86);code="SHORT";}
   else if(r<.024){deliv=Math.round(plan*1.07);code="OVER";}
   else if(r<.036){deliv=Math.round(plan*1.05);code="PRICE";}
   else if(r<.044){conf=false;code="NOCONF";}
   else if(r<.050){code="NODOC";}
   lines.push({sku:L.sku,item:L.item,plan:plan,deliv:deliv,conf:conf,code:code});
   if(code)ex.push(code);
  });
  var plan=lines.reduce(function(a,l){return a+l.plan;},0);
  var billed=lines.reduce(function(a,l){return a+l.deliv;},0);
  var pay=lines.filter(function(l){return !l.code;}).reduce(function(a,l){return a+l.deliv;},0);
  var issue=lines.filter(function(l){return l.code;}).reduce(function(a,l){
   return a+((l.code==="NOCONF"||l.code==="NODOC")?l.deliv:Math.abs(l.deliv-l.plan));},0);
  var sub=addD(f.plant,-12), age=Math.round((NOW()-new Date(sub))/864e5);
  var clean=ex.length===0, paid=clean&&rnd(f.id+"p")<.70;
  var overdue=clean&&!paid&&age>10;
  out.push({id:"DR-"+f.id.slice(1),fid:f.id,name:f.name,crop:f.crop,muni:f.muni,lc:f.lc,fro:f.fro,
   lines:lines,plan:plan,billed:billed,payable:pay,atIssue:issue,submitted:sub,age:age,
   clean:clean,paid:paid,status:paid?"paid":(clean?(overdue?"overdue-bank":"ready"):"exception")});
 });
 return out;
}

function NOW(){

 _now=new Date((mx||Date.parse("2026-12-01"))+70*864e5);
 return _now;
}

}

}

function validate(k,o,ctx){

 (RULES[k]||[]).forEach(function(r){
  var v=o[r.f], bad=false;

  else if(r.t==="truthy")bad=!v;
  else if(r.t==="range")bad=!(typeof v==="number"&&v>=r.min&&v<=r.max);
  if(bad)(r.sev==="warn"?warns:errs).push(r.m);
 });

}

<script>/* ==================================================================

 });

/* ---- step 1: eligibility --------------------------------------- */
function evalElig(e){
 var fail=[],warn=[],ok=[];
 if(e.age===null)fail.push({q:"Age",m:"Not answered."});
 else if(e.age<P("ageMin"))fail.push({q:"Age",m:"Applicants must be at least "+P("ageMin")+".",fix:null});
 else if(e.age>P("ageMax"))warn.push({q:"Age",m:"Above the age band configured for this programme ("+P("ageMax")+"). This band is not published by LANDBANK and must be confirmed — a field officer will check before this becomes a decline.",fix:"talk"});
 else ok.push("Age within the configured band.");
 if(e.rsbsa===false)fail.push({q:"RSBSA",m:"Registration in the Registry System for Basic Sectors in Agriculture is required for this programme.",fix:"rsbsa"});
 else if(e.rsbsa===null)fail.push({q:"RSBSA",m:"Not answered."});
 else ok.push("RSBSA registered.");
 if(e.active===false)fail.push({q:"Farming",m:"You must be farming the land yourself, directly supervising it, or be a leaseholder who farms it personally.",fix:"talk"});
 else if(e.active===true)ok.push("Actively farming or supervising.");
 if(!e.crop)fail.push({q:"Crop",m:"Not answered."});
 else if(!APPCROPS[e.crop])fail.push({q:"Crop",m:"This crop is not in the current programme.",fix:"talk"});
 else ok.push(APPCROPS[e.crop].n+" is supported.");
 if(e.ha===null)fail.push({q:"Area",m:"Not answered."});
 else if(e.ha<P("haMin"))fail.push({q:"Area",m:"Below the minimum of "+P("haMin")+" hectares."});
 else if(e.ha>P("haMax"))warn.push({q:"Area",m:"Above the smallholder band of "+P("haMax")+" hectares. A different facility may fit better.",fix:"talk"});
 else ok.push("Area within the smallholder band.");
 if(!e.prov||!e.muni)fail.push({q:"Location",m:"Not answered."});
 if(e.hasLoan===true)warn.push({q:"Existing loan",m:"An existing agricultural loan does not disqualify you. It does mean additional credit review, and LANDBANK requires that you have no loan elsewhere for this same project and no past-due accounts.",fix:null});
 else if(e.hasLoan===false)ok.push("No existing agricultural loan declared.");
 if(!e.tenure)fail.push({q:"Land use",m:"Not answered."});
 var c=e.crop&&APPCROPS[e.crop];
 var maxFin=c&&e.ha?Math.round(c.cost*e.ha*P("financePct")):null;
 return {eligible:fail.length===0,fail:fail,warn:warn,ok:ok,maxFinance:maxFin,
  track:(e.age!==null&&e.age<=P("ageGradMax"))?"Small farmer · may also qualify for the agriculture-graduate track":"Small farmer"};
}

/* ---- step 2: ID OCR (simulated, three-value audit) ------------- */
/* Which fields each ID type actually carries. Anything on the card is read,
   never asked. The farmer should only ever be asked for what no document holds. */
var ID_FIELDS={
 "PhilSys National ID":["name","dob","sex","address","idNo"],
 "Driver's licence":["name","dob","sex","address","idNo","expiry"],
 "UMID":["name","dob","sex","idNo"],
 "Postal ID":["name","dob","address","idNo","expiry"],
 "Voter's ID":["name","dob","address","idNo"]
};
function ocr(idType,name){
 var conf={"PhilSys National ID":0.97,"Driver's licence":0.93,"UMID":0.91,"Postal ID":0.86,"Voter's ID":0.79}[idType]||0.8;
 var all={name:name||"[read from ID]",dob:"1978-04-12",sex:"Male",
  address:"Brgy. San Isidro, Talavera, Nueva Ecija",
  idNo:"XXXX-XXXX-XXXX-XX",expiry:"2031-04-12"};
 var has=ID_FIELDS[idType]||["name","dob","idNo"];
 var f={}; has.forEach(function(k){f[k]=all[k];});
 return {source:"MOCK OCR",confidence:conf,fields:f,captured:has,low:conf<0.85,
  /* what the card cannot tell us, so the farmer still has to answer */
  stillNeeded:["civil","mobile"].concat(has.indexOf("address")<0?["addr"]:[])};
}
function ageFromDob(dob){
 if(!dob)return null;
 var d=new Date(dob); if(isNaN(d))return null;
 var n=new Date(), a=n.getFullYear()-d.getFullYear();
 var m=n.getMonth()-d.getMonth();
 if(m<0||(m===0&&n.getDate()<d.getDate()))a--;
 return a;
}


/* ---- RSBSA card scan: OCR + cross-check against the ID -------- */
/* The card already carries the number, the registered name, the
   location, the crops and the area. Asking a farmer to type a
   17-digit reference off a card he is holding is a design failure. */
function ocrRsbsa(seed,idName,variant){
 var conf=0.88+((seed||0)%7)/100;
 /* The card is an independent source. Its registered name is whatever was
    captured at registration, which is not always what the ID says — married
    name, dropped middle name, a typo at the MAO desk. That divergence is a
    real control point, so the simulation must be able to produce it. */
 var cardName=idName||"[read from card]";
 if(variant==="mismatch"&&idName){
  var p=idName.split(" ");
  cardName=p[0]+" "+(p.length>2?p[1].charAt(0)+". ":"")+p[p.length-1];
 }
 var f={
  number:"03-49-12-001-0"+String(100000+((seed||1)*7919)%899999).slice(0,5),
  name:cardName,
  address:"Brgy. San Isidro, Talavera, Nueva Ecija",
  province:"Nueva Ecija", municipality:"Talavera", barangay:"San Isidro",
  crops:"Palay", area:2.0, registered:"2021-06-14"
 };
 var issues=[];
 if(idName&&f.name&&idName.trim().toLowerCase()!==f.name.trim().toLowerCase())
  issues.push({field:"name",m:"The name on the RSBSA card does not match the name on the ID.",
   idValue:idName,cardValue:f.name});
 return {source:"MOCK OCR",confidence:+conf.toFixed(2),fields:f,low:conf<0.85,issues:issues};
}

/* ---- step 4: area reconciliation ------------------------------- */
function areaCheck(declared,mapped){
 if(!declared||!mapped)return {state:"NOT_MAPPED",msg:"Farm not yet mapped."};
 var d=Math.abs(mapped-declared)/declared;
 if(d<=P("areaTolerance"))return {state:"OK",diff:d,
  msg:"Mapped area is within "+(P("areaTolerance")*100)+"% of the declared area."};
 return {state:"VERIFY",diff:d,
  msg:"Declared "+declared+" ha, mapped "+mapped.toFixed(2)+" ha — a difference of "+(d*100).toFixed(0)+
      "%. A field officer must verify the boundary before submission.",
  action:"FRO field verification"};
}

/* ---- step 6: farm plan ----------------------------------------- */
function farmPlan(crop,ha,water){
 var c=APPCROPS[crop]; if(!c||!ha)return null;
 var mult=(water==="irrigated")?1.0:0.88;
 var cost=Math.round(c.cost*ha);
 var fin=Math.round(cost*P("financePct"));
 var own=cost-fin;
 var yieldKg=Math.round(c.yld*ha*mult);
 var sales=Math.round(yieldKg*c.price);
 var interest=Math.round(fin*P("interestRate")*(c.days/365));
 var repay=fin+interest;
 var lines=[
  ["Seed or planting material",0.18,true],["Fertiliser",0.30,true],["Crop protection",0.13,true],
  ["Land preparation and services",0.14,false],["Labour",0.15,false],
  ["Harvest and post-harvest",0.07,false],["Transport",0.03,false]
 ].map(function(l){return {item:l[0],amt:Math.round(cost*l[1]),supplied:l[2]};});
 return {crop:c,ha:ha,cost:cost,finance:fin,own:own,yieldKg:yieldKg,sales:sales,
  interest:interest,repay:repay,net:sales-repay,lines:lines,
  suppliedTotal:lines.filter(function(l){return l.supplied;}).reduce(function(a,l){return a+l.amt;},0)};
}

/* ---- step 7: repayment capacity -------------------------------- */
function capacity(plan,debt){
 if(!plan)return null;
 var existing=(debt&&debt.items||[]).reduce(function(a,x){return a+(+x.bal||0);},0);
 var cover=plan.sales/(plan.repay+existing*0.35);
 return {existing:existing,cover:cover,
  band:cover>=1.6?"comfortable":cover>=1.25?"adequate":"tight",
  flag:cover<1.25,
  msg:cover<1.25?"Projected sales cover the repayment "+cover.toFixed(2)+" times. Additional credit review required — this is not a decline."
     :"Projected sales cover the repayment "+cover.toFixed(2)+" times."};
}

/* Built from the published SFF/ARB documentary requirements, filtered by
   what actually applies to this farmer. Nobody is shown a requirement that
   does not apply to them. */
function checklist(a){
 var items=[];
 DOCS_SFF.forEach(function(d){

  if(d.k==="appform")done=!!a.consents.esign;

  else if(d.k==="nia")done=!!a.docs.nia;

  else if(d.k==="orientation")done=!!a.docs.orientation;
  else if(d.k==="farmplan")done=!!a.plan;
  else if(d.k==="tin")done=!!(a.tin&&a.tin.no);
  else if(d.k==="proforma")done=!!a.docs.proforma;
  items.push({k:d.k,n:d.n,why:d.why,ok:d.ok,src:d.src,done:done});
 });
 items.push({k:"id",n:"Valid government ID",src:"CONFIRMED",
  why:"LANDBANK must confirm who you are.",
  ok:"PhilSys, driver's licence, UMID, postal or voter's ID.",
  done:!!(a.id.idNo&&a.id.confirmed)});
 items.push({k:"map",n:"Farm map",src:"MANUAL",
  why:"Establishes the parcel being financed and prevents the same field being financed twice.",
  ok:"Boundary walked on the app, a dropped pin, or a field officer mapping visit.",
  done:!!a.farm.polygon||a.farm.mapMode==="fro"});
 items.push({k:"consent",n:"Consent forms",src:"MANUAL",
  why:"Permission to check your details and to share them with LANDBANK.",

var A={};
A.palay=function(c){return '<svg viewBox="0 0 48 48" fill="none">'+

<script>/* ==================================================================
   CXPRICE — the collar
   Floor protects the farmer: it must clear the loan plus a margin.
   Ceiling protects the buyer: it caps what a shortage year can cost.
   Both are explainable — every ceiling recommendation lists the
   drivers that produced it, so a buyer can argue with the reasoning
   rather than with the number.
   ================================================================== */
var CXPRICE=(function(){
"use strict";
var FLOOR_MARGIN=0.15;   /* loan + 15% — the farmer's protected margin */

/* Historical anchors per crop. Ranges are indicative operating bands,
   not a published series — replace with PSA farmgate data before use. */
var BANDS={
 palay:{lo:17,typ:23,hi:27,vol:"low",policyFloor:20,
   policy:"Government floor pricing and NFA buying support set a practical base.",
   season:"Wet-season harvest in Sept–Oct depresses price; dry-season crop sells higher.",
   store:"Storable as dry palay, so a glut can be held back.",
   logi:"Short haul to local mills. Fuel is a small share of value."},
 corn:{lo:12,typ:16,hi:21,vol:"low-medium",
   policy:"Feed demand and the import tariff on feed wheat move the price more than any farm policy.",
   season:"Price softens at the main harvest peak when dryer capacity is tight.",
   store:"Storable at 14% moisture. Wet corn cannot wait and sells at a discount.",
   logi:"Haul to the mill matters. Diesel moves delivered cost materially."},
 ube:{lo:60,typ:85,hi:120,vol:"medium",
   policy:"No price policy. Export demand for powder is the driver.",
   season:"Single harvest after 8–10 months, so supply arrives in a narrow window.",
   store:"Cured tubers hold for weeks; as powder, for a year.",
   logi:"Long haul from producing provinces plus processing cost."},
 chili:{lo:90,typ:180,hi:320,vol:"high",
   policy:"No policy support. Purely supply and demand.",
   season:"Picked continuously for 26 weeks, which smooths the farmer's exposure but not the market's.",
   store:"Fresh, highly perishable. Price collapses in a local glut.",
   logi:"Small volumes, high value. Freight is not the constraint."},
 mungbean:{lo:60,typ:85,hi:115,vol:"low",
   policy:"No policy support. Imports fill any shortfall.",
   season:"Short 63-day cycle, so supply responds quickly to price.",
   store:"Dry grain. Holds for 9–12 months, which caps both spikes and crashes.",
   logi:"Light and dry. Freight is a small share of value."},
 onion:{lo:22,typ:52,hi:180,vol:"very high",
   policy:"Import timing is the single biggest driver. A permit released into the local harvest halves the farmgate price.",
   season:"Harvest concentrates in Feb–Apr; the shortage window is Sept–Dec.",
   store:"Cold storage holds for 3–6 months, which is why the trade, not the farmer, captures the spike.",
   logi:"Cold chain cost is real and rises with fuel."},
 citronella:{lo:4,typ:6.5,hi:10,vol:"unknown",placeholder:true,
   policy:"No data held. Essential-oil pricing is set by the distiller contract.",
   season:"Ratooned, harvested several times a year.",
   store:"Oil stores well; fresh herbage does not.",
   logi:"Bulky fresh material. Distillation must be close to the field."}
};

/* Drivers that push the ceiling recommendation up or down. */
function drivers(k){
 var b=BANDS[k]||{},d=[];
 d.push({n:"Historical price band",v:b.lo+"–"+b.hi+" per kg",eff:"sets the range",
  note:"Typical operating band. The ceiling should sit inside it, not above it."});
 d.push({n:"Price volatility",v:b.vol,eff:b.vol==="very high"||b.vol==="high"?"raises the ceiling":"holds the ceiling near typical",
  note:b.vol==="very high"?"A wide ceiling is the only way a buyer will sign, because the downside they are insuring against is enormous."
   :"A narrow band means the ceiling can sit close to the typical price."});
 d.push({n:"Government policy",v:b.policyFloor?("statutory floor "+b.policyFloor):"none",eff:b.policyFloor?"lifts the floor":"neutral",note:b.policy});
 d.push({n:"Season and harvest window",v:"—",eff:"timing risk",note:b.season});
 d.push({n:"Storability",v:"—",eff:b.store&&/Fresh|perishable/.test(b.store)?"raises spike risk":"dampens spikes",note:b.store});
 d.push({n:"Fuel and logistics",v:"—",eff:"raises the delivered floor",note:b.logi});
 return d;
}

/* Floor: the farmer must clear the loan plus a margin, whatever the market does. */
function floorFor(loanAmt,yieldKg,policyFloor){
 var perKg=(loanAmt*(1+FLOOR_MARGIN))/(yieldKg||1);
 var binds="cost-plus";
 if(policyFloor&&policyFloor>perKg){perKg=policyFloor;binds="statutory";}
 return {perKg:perKg,total:perKg*yieldKg,margin:FLOOR_MARGIN,binds:binds};
}

/* Ceiling: capped participation. Above it, the buyer keeps the upside;
   the farmer takes an agreed share so the contract still feels fair. */
function ceilingFor(k,floorKg){
 var b=BANDS[k]||{lo:0,typ:0,hi:0,vol:"medium"};
 var mult={"low":1.35,"low-medium":1.45,"medium":1.60,"high":1.95,"very high":2.40,"unknown":1.60}[b.vol]||1.6;
 /* The ceiling is a market number, not a loan number. Anchoring it to the
    loan-derived floor produced ceilings below the typical market price for
    high-value crops, which would have handed the farmer's entire upside to
    the buyer. It is anchored to the typical price and capped at the
    historical high, with the floor only as a lower bound. */
 var byVol=(b.typ||0)*mult;
 var byHist=b.hi;
 var rec=Math.min(byVol,byHist);
 if(rec<floorKg*1.12)rec=floorKg*1.12;
 return {perKg:rec,mult:mult,byVol:byVol,byHist:byHist,
  share:0.30,   /* farmer's share of anything above the ceiling */
  basis:byVol<byHist?"volatility multiple on the typical price":"historical high",
  floorBound:rec<=floorKg*1.12+0.001,
  band:b};
}
function collar(k,loanAmt,yieldKg){
 var b=BANDS[k]||{};
 var f=floorFor(loanAmt,yieldKg,b.policyFloor);
 var c=ceilingFor(k,f.perKg);
 return {crop:k,floor:f,ceiling:c,typ:b.typ,drivers:drivers(k),placeholder:!!b.placeholder};
}

/* Quality grades — the agreed price is a Grade A price. */
var GRADES={
 palay:[["A","14% moisture, ≥95% purity, no discolouration",1.00],
        ["B","14–16% moisture, minor foreign matter",0.90],
        ["C","Above 16% moisture, needs drying",0.74]],
 corn:[["A","≤14% moisture, aflatoxin under 20 ppb",1.00],
       ["B","14–16% moisture, needs drying",0.88],
       ["C","Above 16% moisture or aflatoxin flag",0.60]],
 ube:[["A","Firm cured tuber, ≥300 g, no rot or cuts",1.00],
      ["B","150–300 g, minor blemish",0.85],
      ["C","Under 150 g, cut or soft",0.58]],
 chili:[["A","Firm, uniform colour, no soft fruit",1.00],
        ["B","Mixed colour, slight softness",0.82],
        ["C","Soft, blemished or wet",0.55]],
 mungbean:[["A","≤12% moisture, ≥98% purity, no weevil",1.00],
           ["B","12–14% moisture or minor foreign matter",0.90],
           ["C","Weevil damage or above 14% moisture",0.62]],
 onion:[["A","Cured, ≥45 mm, firm, no sprouting",1.00],
        ["B","35–45 mm or minor blemish",0.82],
        ["C","Under 35 mm, soft or sprouting",0.55]],
 citronella:[["A","Fresh herbage delivered within 24 hours of cutting",1.00],
             ["B","24–48 hours",0.88],
             ["C","Over 48 hours or wilted",0.65]]
};
function grades(k){return GRADES[k]||GRADES.palay;}

/* Quadripartite settlement */
var QUAD={
 parties:[
  {k:"lbp",n:"LANDBANK",role:"Lends the money and is repaid first from the sale."},
  {k:"farmer",n:"Farmer",role:"Grows the crop and receives whatever is left after the loan is settled."},
  {k:"cx",n:"Kita",role:"Supplies the inputs, monitors the crop and arranges the sale."},
  {k:"buyer",n:"Buyer",role:"Buys the harvest and pays the loan portion directly to LANDBANK."}
 ],
 steps:[
  {n:"Buyer accepts the delivery",d:"Volume and grade are agreed at intake. The grade sets the price."},
  {n:"Buyer pays LANDBANK first",d:"The loan portion goes straight to the bank against the farmer's account. It does not pass through anyone else."},
  {n:"Balance goes to the farmer",d:"Whatever remains after the loan is settled is paid to the farmer."},
  {n:"LANDBANK records repayment",d:"The loan closes and the farmer qualifies for the next cycle."}
 ],
 why:"The farmer never has to set money aside to repay, and the bank is not relying on him to remember. This is the arrangement that makes the loan safe enough to price at a concessional rate."
};
function settle(salePrice,yieldKg,gradeMult,loanAmt){
 var gross=salePrice*yieldKg*(gradeMult||1);
 var toBank=Math.min(gross,loanAmt);
 return {gross:gross,toBank:toBank,toFarmer:Math.max(0,gross-toBank),shortfall:Math.max(0,loanAmt-gross)};
}
return {FLOOR_MARGIN:FLOOR_MARGIN,BANDS:BANDS,drivers:drivers,floorFor:floorFor,
 ceilingFor:ceilingFor,collar:collar,GRADES:GRADES,grades:grades,QUAD:QUAD,settle:settle};
})();
</script>

  {d:60,k:"pest1",n:"Thrips and mite scouting",impact:340,crit:true,ev:["photo"],why:"Thrips damage fruit surface, which is a grade problem, not just a yield problem."},
  {d:150,k:"pick1",n:"First picking",impact:420,crit:true,ev:["photo","gps"],why:"Picking on schedule keeps the plant producing and starts weekly repayment."},
  {d:200,k:"fert2",n:"Mid-season fertiliser",impact:380,crit:true,ev:["photo"],why:"Feeding through the picking run sustains fruit set to week 26."}
 ]},
 mungbean:{n:"Mungbean",base:1100,unit:"kg",cycle:63,
  quality:[["Moisture","12% or below","Above 12% invites weevil and mould in storage."],
           ["Purity","≥98%, no weevil damage","Weevil damage is the main downgrade."]],
  t:[
  {d:-7,k:"land",n:"Land preparation",impact:60,crit:true,ev:["photo"],why:"A firm, moist seedbed on residual soil moisture is enough."},
  {d:0,k:"plant",n:"Sow at recommended rate",impact:120,crit:true,ev:["photo","gps"],why:"Plant population sets pod number."},
  {d:5,k:"inoc",n:"Rhizobium inoculant applied",impact:70,crit:false,ev:["photo"],why:"Inoculant lets the crop fix its own nitrogen and feeds the next rice crop."},
  {d:18,k:"weed1",n:"Weed control",impact:90,crit:true,ev:["photo"],why:"Mungbean is short and shades weeds poorly early on."},
  {d:35,k:"pest1",n:"Pod borer scouting",impact:110,crit:true,ev:["photo"],why:"Pod borer at flowering is the main yield loss in mungbean."},
  {d:58,k:"harvest",n:"Harvest and dry",impact:130,crit:true,ev:["photo","gps"],why:"Harvest when most pods are black. Dry promptly to 12%."}
 ]},
 onion:{n:"Onion",base:12000,unit:"kg",cycle:105,
  quality:[["Bulb size","45 mm and above for Grade A","Small bulbs are heavily discounted."],
           ["Curing","Properly cured before storage","Uncured bulbs rot in store."],
           ["No sprouting","Firm, dormant bulbs","Sprouted bulbs are rejected."]],
  t:[
  {d:-15,k:"land",n:"Land preparation and bed forming",impact:600,crit:true,ev:["photo"],why:"Raised beds prevent the waterlogging that causes basal rot."},
  {d:0,k:"plant",n:"Transplant at correct spacing",impact:800,crit:true,ev:["photo","gps"],why:"Spacing sets bulb size, and bulb size sets your grade and your price."},
  {d:15,k:"fert1",n:"First fertiliser",impact:600,crit:true,ev:["photo"],why:"Early nitrogen builds the leaves that fill the bulb."},
  {d:30,k:"weed1",n:"Weed control",impact:500,crit:true,ev:["photo"],why:"Onion has no canopy. Weeds take the crop if left."},
  {d:45,k:"fert2",n:"Second fertiliser — bulbing",impact:700,crit:true,ev:["photo","gps"],why:"Nutrition at bulbing is what produces 45 mm bulbs instead of 35 mm."},
  {d:60,k:"pest1",n:"Thrips and purple blotch scouting",impact:550,crit:true,ev:["photo"],why:"Thrips reduce bulb size; purple blotch reduces storability."},
  {d:85,k:"stop",n:"Stop irrigation before harvest",impact:400,crit:true,ev:["photo"],why:"Drying the crop off firms the bulb and improves storage life."},
  {d:100,k:"harvest",n:"Harvest and cure",impact:750,crit:true,ev:["photo","gps"],
   why:"Curing is what lets the crop be held for the shortage window instead of dumped at harvest."}
 ]}
};

/* ---------- 2. state ---------------------------------------------- */
function rd(){try{return JSON.parse(localStorage.getItem(KEY)||"null")||{};}catch(e){return {};}}
function wr(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function twin(fid){var a=rd();return a[fid]||null;}
function saveTwin(t){var a=rd();a[t.fid]=t;wr(a);}
function dISO(d){return d.toISOString().slice(0,10);}
function addD(iso,n){var d=new Date(iso);d.setDate(d.getDate()+n);return dISO(d);}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5);}

/* ---------- 3. build the twin from an approved loan --------------- */
function build(rec,today){
 var p=PROTO[rec.crop]||PROTO.palay;
 var t={fid:rec.id,crop:rec.crop,ha:rec.ha,plant:rec.plant,
  target:Math.round(p.base*rec.ha),unit:p.unit,cycle:p.cycle,
  loan:rec.amt,done:{},photos:[],events:[],readiness:{},profile:null,
  tasks:p.t.map(function(x){
   return {k:x.k,n:x.n,why:x.why,d:x.d,due:addD(rec.plant,x.d),
    impact:Math.round(x.impact*rec.ha),crit:x.crit,ev:x.ev,src:x.src||null};})};
 return t;
}
/* Seed a realistic execution history so a farm mid-season looks like a
   farm mid-season: most things done, one or two slipping. Deterministic
   from the farmer id so every surface shows the same twin. */
function seedHistory(t,rec,today){
 var h=0,id=t.fid||"x";
 for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;
 var openTasks=0;
 t.tasks.forEach(function(x,i){
  var dd=daysBetween(x.due,today);
  if(dd<0)return;                      /* not due yet */
  var r=((h>>(i%16))%100);
  if(dd>=0&&openTasks<2&&r<22){openTasks++;return;}   /* leave a couple open */
  var late=(r%17===0)?4+(r%6):(r%5===0?1+(r%3):0);
  if(late>dd)late=dd;
  t.done[x.k]={at:addD(x.due,late),late:late,ev:x.ev,conf:"high"};
 });
 var n=Math.max(0,Math.floor(daysBetween(t.plant,today)/16));
 for(var p=0;p<n;p++)t.photos.push({at:addD(t.plant,p*16+3),by:"farmer"});
 t.actionsRec=3+(h%4); t.actionsDone=Math.max(0,t.actionsRec-((h>>3)%2));
 return t;
}
function ensure(rec,today){
 var t=twin(rec.id);
 if(!t){t=build(rec,today);seedHistory(t,rec,today);saveTwin(t);}
 return t;
}

/* ---------- 4. readiness before planting -------------------------- */
var READY=[
 {k:"land",n:"Land prepared",w:20},
 {k:"inputs",n:"Inputs received",w:20},
 {k:"seed",n:"Seed or planting material received",w:15},
 {k:"equip",n:"Equipment available",w:8},
 {k:"labor",n:"Labour arranged",w:10},
 {k:"water",n:"Water source ready",w:10},
 {k:"weather",n:"Weather suitable",w:7},
 {k:"buyer",n:"Buyer allocation confirmed",w:10}
];
function readiness(t,rec){
 var r=t.readiness||{},got=0,miss=[];
 READY.forEach(function(x){
  var ok=r[x.k];
  if(x.k==="buyer")ok=(r.buyer!==undefined)?r.buyer:!!rec.buyerId;
  if(ok)got+=x.w; else miss.push(x);
 });
 var pct=Math.round(got);
 return {pct:pct,missing:miss,
  action:miss.length?("Complete "+miss[0].n.toLowerCase()+" before planting."):"Ready to plant."};
}

/* ---------- 5. status of each task -------------------------------- */
function taskState(t,x,today){
 if(t.done[x.k])return {s:"done",late:t.done[x.k].late||0};
 var dd=daysBetween(x.due,today);
 if(dd<0)return {s:"upcoming",inDays:-dd};
 if(dd===0)return {s:"due"};
 if(dd<=3)return {s:"late",by:dd};
 return {s:"missed",by:dd};
}
function complete(t,k,evidence,today){
 var x=t.tasks.filter(function(y){return y.k===k;})[0]; if(!x)return null;
 var late=Math.max(0,daysBetween(x.due,today));
 t.done[k]={at:today,late:late,ev:evidence||[],conf:evidence&&evidence.length?"high":"low"};
 saveTwin(t);
 return t.done[k];
}

/* ---------- 6. yield forecast ------------------------------------- */
/* Start from the protocol target and subtract what execution has cost. */
function forecast(t,today,weatherHits){
 var lost=0,drivers=[];
 t.tasks.forEach(function(x){
  var st=taskState(t,x,today);
  if(st.s==="missed"){lost+=x.impact;drivers.push({n:x.n,kg:-x.impact,why:"not done "+st.by+" days after it was due"});}
  else if(st.s==="late"){var l=Math.round(x.impact*0.35);lost+=l;drivers.push({n:x.n,kg:-l,why:st.by+" days late"});}
  else if(st.s==="done"&&t.done[x.k].late>3){var l2=Math.round(x.impact*0.25);lost+=l2;
   drivers.push({n:x.n,kg:-l2,why:"completed "+t.done[x.k].late+" days late"});}
 });
 (weatherHits||[]).forEach(function(w){lost+=w.kg;drivers.push({n:w.n,kg:-w.kg,why:w.why});});
 var expected=Math.max(0,t.target-lost);
 return {target:t.target,expected:expected,
  best:Math.round(expected*1.08),worst:Math.round(expected*0.82),
  lostKg:lost,pct:t.target?expected/t.target:0,drivers:drivers};
}

/* ---------- 7. scores --------------------------------------------- */
function scores(t,today){
 var due=t.tasks.filter(function(x){return daysBetween(x.due,today)>=0;});
 var doneOnTime=due.filter(function(x){return t.done[x.k]&&t.done[x.k].late<=3;}).length;
 var protocolPct=due.length?Math.round(doneOnTime/due.length*100):100;
 var expectedPhotos=Math.max(1,Math.floor(daysBetween(t.plant,today)/14));
 var photoPct=Math.min(100,Math.round((t.photos.length/expectedPhotos)*100));
 var plantSt=t.done.plant?(t.done.plant.late<=3?100:Math.max(0,100-t.done.plant.late*6)):
   (daysBetween(t.plant,today)>0?Math.max(0,100-daysBetween(t.plant,today)*6):100);
 var acts=(t.actionsDone||0),actsRec=(t.actionsRec||0);
 var actionPct=actsRec?Math.round(acts/actsRec*100):100;
 var engage=Math.min(100,60+(t.photos.length*8)+(acts*5));
 var overall=Math.round(protocolPct*0.35+photoPct*0.15+plantSt*0.2+actionPct*0.2+engage*0.10);
 return {protocol:protocolPct,photo:photoPct,planting:plantSt,actions:actionPct,engagement:engage,
  overall:Math.max(0,Math.min(100,overall)),
  band:overall>=85?"on track":overall>=65?"needs attention":"at risk"};
}

/* ---------- 8. weather → farm action ------------------------------ */
var WX=[
 {k:"rain",n:"Heavy rain expected in 2 days",
  act:"Hold the fertiliser application until after the rain. Applying now washes it off the field.",
  blocks:["fert1","fert2","side","basal"],kgIfIgnored:180},
 {k:"wind",n:"Strong winds tomorrow",
  act:"Do not spray. The chemical will drift off target and you will pay for it twice.",
  blocks:["pest1"],kgIfIgnored:60},
 {k:"dry",n:"Dry spell for the next 10 days",
  act:"Irrigate if you can. If not, delay the next fertiliser — it needs moisture to work.",
  blocks:["water1"],kgIfIgnored:220}
];
function weatherToday(t,today){
 var seed=(t.fid||"x").length+daysBetween(t.plant,today);
 var i=Math.abs(seed)%7;
 if(i>=3)return null;
 var w=WX[i%WX.length];
 var pending=t.tasks.filter(function(x){return w.blocks.indexOf(x.k)>=0&&!t.done[x.k]&&Math.abs(daysBetween(x.due,today))<=3;});
 return {w:w,affects:pending,relevant:pending.length>0};
}

/* ---------- 9. photo AI (simulated, confidence-gated) ------------- */
var FINDINGS=[
 {k:"stand",n:"Plant stand and uniformity",good:"Even emergence across the frame.",bad:"Gappy stand — roughly 15% of the row is missing plants.",kg:220},
 {k:"weed",n:"Weed pressure",good:"Weed pressure low.",bad:"Broadleaf weeds visible between rows and competing with the crop.",kg:180},
 {k:"nutrient",n:"Possible nutrient deficiency",good:"Leaf colour normal for this stage.",bad:"Lower leaves yellowing from the tip — a pattern consistent with nitrogen deficiency.",kg:260},
 {k:"pest",n:"Possible insect damage",good:"No visible feeding damage.",bad:"Window-pane feeding on young leaves, consistent with early armyworm.",kg:300},
 {k:"lodge",n:"Lodging",good:"Crop standing well.",bad:"A section of the crop is leaning after wind.",kg:150}
];
function analysePhoto(t,today,seedTweak){
 var seed=(t.fid+"|"+today+"|"+(seedTweak||"")).split("").reduce(function(a,c){return a+c.charCodeAt(0);},0);
 var out=[],conf=0.62+((seed%30)/100);
 FINDINGS.forEach(function(f,i){
  var bad=((seed>>i)%5)===0;
  out.push({k:f.k,n:f.n,ok:!bad,text:bad?f.bad:f.good,kg:bad?Math.round(f.kg*t.ha):0});
 });
 var issues=out.filter(function(x){return !x.ok;});
 return {confidence:+conf.toFixed(2),findings:out,issues:issues,
  lowConfidence:conf<0.75,
  verdict:issues.length?"Possible issues detected":"No issues detected",
  disclaimer:conf<0.75
   ? "Confidence is low on this image. This is a possible reading, not a diagnosis — an agronomist should look before you act on it."
   : "This is an automated reading of one photograph. It suggests what to check; it does not confirm a diagnosis."};
}

/* ---------- 10. minimum effective intervention -------------------- */
/* Every option has a real operating cost and an expected recovery
   share. We pick the one with the highest expected value, and if the
   best option is negative we correctly do nothing. */
var OPTIONS=[
 {k:"none",n:"No intervention",cost:0,rec:0,who:"—",
  d:"The farm is on track. Leave the farmer alone — unnecessary contact trains him to ignore us."},
 {k:"push",n:"App reminder",cost:2,rec:0.22,who:"Automated",d:"Push notification with the action and why it matters."},
 {k:"video",n:"Short instructional video",cost:4,rec:0.28,who:"Automated",d:"Sixty-second clip in Tagalog showing the task being done."},
 {k:"sms",n:"SMS",cost:6,rec:0.32,who:"Automated",d:"For farmers who do not open the app."},
 {k:"call",n:"Call from the field officer",cost:130,rec:0.55,who:"FRO",d:"Two-minute call to confirm the farmer understood and can act."},
 {k:"visit",n:"Field officer visit",cost:850,rec:0.75,who:"FRO",d:"On-farm visit to verify and assist."},
 {k:"agro",n:"Agronomist visit",cost:2400,rec:0.90,who:"Agronomist",d:"Diagnosis and prescription on site."}
];
function valuePerKg(crop){
 var m={palay:23,corn:16,ube:85,chili:180,mungbean:85,onion:52,citronella:6.5};
 return m[crop]||20;
}
/* How much of the loss each channel can realistically recover, by the
   nature of the problem. A farmer who simply has not got to a routine
   task needs reminding, not diagnosing — an agronomist adds almost
   nothing there and costs 2,400 pesos. */
var CAP={
 reminder:{push:0.70,video:0.78,sms:0.72,call:0.85,visit:0.90,agro:0.92,none:0},
 capability:{push:0.25,video:0.55,sms:0.28,call:0.65,visit:0.88,agro:0.92,none:0},
 diagnosis:{push:0.12,video:0.20,sms:0.14,call:0.35,visit:0.60,agro:0.92,none:0}
};
function decide(t,atRiskKg,kind){
 kind=kind||"reminder";
 var caps=CAP[kind]||CAP.reminder;
 var value=atRiskKg*valuePerKg(t.crop);
 var scored=OPTIONS.map(function(o){
  var recov=value*(caps[o.k]!==undefined?caps[o.k]:o.rec);
  return {o:o,recov:recov,net:recov-o.cost};
 });
 /* Minimum effective intervention: take the best net value, but if a
    cheaper channel lands within 5% of it, take the cheaper one. Spending
    850 pesos to beat a 130-peso call by 80 pesos is not a good trade
    once you multiply it across a few thousand farms. */
 var bestNet=Math.max.apply(null,scored.map(function(x){return x.net;}));
 var viable=scored.filter(function(x){return x.net>0&&x.net>=bestNet*0.95;});
 var pick=viable.sort(function(a,b){return a.o.cost-b.o.cost;})[0];
 if(!pick)pick=scored.filter(function(x){return x.o.k==="none";})[0];
 var alt=scored.filter(function(x){return x.o.k!=="none"&&x.o.cost>pick.o.cost;})
   .sort(function(a,b){return a.o.cost-b.o.cost;})[0];
 return {choice:pick.o,kind:kind,expectedRecovery:Math.round(pick.recov),
  cost:pick.o.cost,net:Math.round(pick.net),atRiskValue:Math.round(value),atRiskKg:atRiskKg,
  spared:alt?Math.round(alt.o.cost-pick.o.cost):0,alt:alt?alt.o.n:null,
  reason:pick.o.k==="none"
   ? "Nothing at risk today is worth the cost of contacting this farmer. Unnecessary contact trains him to ignore us."
   : "Recovers about \u20b1"+Math.round(pick.recov).toLocaleString()+" of harvest value for \u20b1"+pick.o.cost+
     (alt?". A "+alt.o.n.toLowerCase()+" would cost \u20b1"+alt.o.cost+" and recover little more.":".")};
}

/* ---------- 11. today's mission ----------------------------------- */
function mission(t,rec,today){
 var items=[],mins=0;
 var wx=weatherToday(t,today);
 t.tasks.forEach(function(x){
  var st=taskState(t,x,today);
  if(st.s==="done")return;
  if(st.s==="due"||st.s==="late"||st.s==="missed"){
   var blocked=wx&&wx.relevant&&wx.w.blocks.indexOf(x.k)>=0;
   items.push({k:x.k,n:x.n,why:x.why,kind:blocked?"hold":(st.s==="due"?"due":"overdue"),
    impact:x.impact,value:Math.round(x.impact*valuePerKg(t.crop)),
    note:blocked?wx.w.act:(st.s==="due"?"Due today":"Overdue by "+(st.by||0)+" days"),
    mins:x.crit?25:12,src:x.src});
   mins+=x.crit?25:12;
  } else if(st.s==="upcoming"&&st.inDays<=3){
   items.push({k:x.k,n:x.n,why:x.why,kind:"soon",impact:x.impact,
    value:Math.round(x.impact*valuePerKg(t.crop)),note:"In "+st.inDays+" days",mins:0});
  }
 });
 var lastPhoto=t.photos.length?t.photos[t.photos.length-1].at:t.plant;
 if(daysBetween(lastPhoto,today)>=14){
  items.push({k:"photo",n:"Upload a photo of your crop",kind:"due",impact:0,value:0,
   why:"A photo lets the system check your crop and catch problems while they are still cheap to fix.",
   note:"Last photo "+daysBetween(lastPhoto,today)+" days ago",mins:3});
  mins+=3;
 }
 if(wx&&wx.relevant)items.unshift({k:"wx",n:wx.w.n,kind:"weather",why:wx.w.act,note:"Weather",
  impact:wx.w.kgIfIgnored,value:Math.round(wx.w.kgIfIgnored*valuePerKg(t.crop)),mins:0});
 return {items:items,minutes:mins,score:scores(t,today)};
}

/* ---------- 12. performance profile + coaching -------------------- */
function profile(t,rec,today){
 var s=scores(t,today);
 var cycles=(rec.cyclesDone||0);
 var level=cycles>=3?"Advanced":cycles>=1?"Intermediate":"First-time";
 var tier=(s.overall>=85&&level!=="First-time")?"light":(s.overall>=65?"standard":"intensive");
 return {level:level,cycles:cycles,score:s,tier:tier,
  style:{light:"Exceptions only. This farmer does not need reminding.",
   standard:"Scheduled reminders plus a nudge when something slips.",
   intensive:"Step-by-step guidance, short videos and confirmation at each stage."}[tier],
  strengths:s.protocol>=85?["Protocol compliance"]:(s.photo>=85?["Photo compliance"]:[]),
  improve:s.protocol<70?["Completing tasks on time"]:(s.photo<70?["Sending crop photos"]:[])};
}

/* ---------- 13. benchmarking (peer group, never named) ------------ */
function benchmark(t,rec,peers,today){
 var mine=scores(t,today);
 var group=peers.filter(function(p){return p.crop===rec.crop&&p.prov===rec.prov;});
 var avg=group.length?Math.round(group.reduce(function(a,p){return a+(p.score||78);},0)/group.length):78;
 return {mine:mine.protocol,peerAvg:avg,n:group.length,
  peerDesc:"Same crop, same province, similar farm size",
  msg:mine.protocol>=avg
   ? "You completed "+mine.protocol+"% of recommended activities. The average for similar farms is "+avg+"%."
   : "You completed "+mine.protocol+"% of recommended activities. The average for similar farms is "+avg+"%. There is room to catch up and the season is not over."};
}

/* ---------- 14. badges -------------------------------------------- */
var BADGES=[
 {k:"ontime",n:"Planted on time",test:function(t){return t.done.plant&&t.done.plant.late<=3;}},
 {k:"photo5",n:"Five crop photos sent",test:function(t){return t.photos.length>=5;}},
 {k:"streak5",n:"Five tasks completed in a row",test:function(t){return Object.keys(t.done).length>=5;}},
 {k:"allcrit",n:"Every critical task done",test:function(t){return t.tasks.filter(function(x){return x.crit;}).every(function(x){return t.done[x.k];});}}
];
function badges(t){return BADGES.filter(function(b){return b.test(t);});}

/* ---------- 15. harvest readiness --------------------------------- */
function harvestReady(t,rec,today){
 var f=forecast(t,today);
 var hv=addD(t.plant,t.cycle);
 var doneCrit=t.tasks.filter(function(x){return x.crit&&daysBetween(x.due,today)>=0;});
 var okCrit=doneCrit.filter(function(x){return t.done[x.k];}).length;
 var pct=doneCrit.length?Math.round(okCrit/doneCrit.length*100):100;
 var value=f.expected*valuePerKg(t.crop);
 return {pct:pct,date:hv,expected:f.expected,unit:t.unit,
  value:value,coverage:rec.amt?value/rec.amt:0};
}
return {PROTO:PROTO,build:build,ensure:ensure,twin:twin,saveTwin:saveTwin,
 READY:READY,readiness:readiness,taskState:taskState,complete:complete,
 forecast:forecast,scores:scores,WX:WX,weatherToday:weatherToday,
 analysePhoto:analysePhoto,OPTIONS:OPTIONS,decide:decide,valuePerKg:valuePerKg,
 mission:mission,profile:profile,benchmark:benchmark,BADGES:BADGES,badges:badges,
 harvestReady:harvestReady,addD:addD,daysBetween:daysBetween,dISO:dISO,KEY:KEY};
})();
</script>
<script>/* ==================================================================
   CXNPL — predictive non-performing-loan engine
   Predicts default risk from the things that actually caused it:
   price collapse, import policy, weather in the wrong week, fuel and
   logistics cost, execution on the farm, and whether the harvest has
   a buyer. Every prediction carries ranked drivers and a costed action
   plan, and every closed cycle is written back as training data.
   ================================================================== */
var CXNPL=(function(){
"use strict";
var LKEY="cxnpl_learn_v1";

/* ---------- exogenous signal set (MOCK feeds, real structure) ----- */
var SIGNALS={
 asOf:"2026-11-20",
 weather:{
  paganso:"La Niña weak",
  cyclones90d:2,
  rainfallAnomaly:+0.18,     /* vs 30-yr normal */
  note:"Two cyclone entries into PAR forecast in the next 90 days. Rainfall running 18% above normal in Central Luzon.",
  src:"MOCK — production source: PAGASA seasonal outlook and tropical cyclone tracks"},
 policy:{
  riceFloor:20, riceFloorSrc:"EO 100 statutory floor",
  onionImportWindow:"Dec 15 – Feb 15",
  cornTariff:"Feed wheat substitution pressure elevated",
  note:"An onion import permit released into the local harvest is the single largest policy risk in the book.",
  src:"MOCK — production source: DA administrative orders and BOC import releases"},
 fuel:{dieselPHP:71.4, chg90d:+0.09,
  note:"Diesel up 9% in 90 days. Haulage cost rises fastest for bulky low-value crops.",
  src:"MOCK — production source: DOE weekly fuel price monitor"},
 price:{
  palay:{spot:23.1,chg30d:-0.02,vs5yr:+0.04},
  corn:{spot:16.4,chg30d:+0.01,vs5yr:+0.06},
  ube:{spot:86,chg30d:0,vs5yr:+0.11},
  chili:{spot:171,chg30d:-0.08,vs5yr:-0.03},
  mungbean:{spot:88,chg30d:+0.02,vs5yr:+0.05},
  onion:{spot:44,chg30d:-0.14,vs5yr:-0.16},
  citronella:{spot:6.4,chg30d:0,vs5yr:0},
  src:"MOCK — production source: PSA farmgate series and DA Bantay Presyo"}
};

/* ---------- per-crop structural exposure ------------------------- */
var EXPOSURE={
 palay:{price:0.10,policy:0.05,weather:0.22,logi:0.06,note:"Policy floor caps the downside; typhoon at flowering is the real risk."},
 corn:{price:0.14,policy:0.10,weather:0.20,logi:0.14,note:"Aflatoxin after wet harvest and haulage cost to the mill."},
 ube:{price:0.12,policy:0.04,weather:0.26,logi:0.12,note:"Eight months in the ground means two typhoon seasons of exposure."},
 chili:{price:0.30,policy:0.04,weather:0.18,logi:0.06,note:"Highly perishable with no policy support. Price is the exposure."},
 mungbean:{price:0.10,policy:0.04,weather:0.10,logi:0.04,note:"Short cycle, dry grain, storable. Structurally the safest crop in the book."},
 onion:{price:0.34,policy:0.30,weather:0.16,logi:0.14,note:"Import timing plus price volatility. This is the crop that produced the 2025 loss."},
 citronella:{price:0.18,policy:0.04,weather:0.16,logi:0.16,note:"Thin data. Treat the estimate with caution."}
};

/* ---------- model ------------------------------------------------- */
var MODEL={version:"0.4-demo",trained:"2026-11-01",n:0,
 note:"Coefficients are hand-set from the 2025 cohort post-mortem, not fitted. They become fitted parameters once one full cycle of outcomes exists."};

function priceStress(crop){
 var p=SIGNALS.price[crop]||{chg30d:0,vs5yr:0};
 /* falling 30-day price and below the 5-year mean both raise risk */
 return Math.max(0,(-p.chg30d*2.2)+Math.max(0,-p.vs5yr*1.4));
}
function weatherStress(t,rec){
 var w=SIGNALS.weather;
 /* a systemic signal should tilt the book, not add a floor to every loan */
 var base=Math.min(0.35,(w.cyclones90d*0.055)+Math.max(0,w.rainfallAnomaly*0.28));
 /* worse if a critical task falls inside the exposure window */
 return base;
}
function policyStress(crop){
 if(crop==="onion")return 0.55;
 if(crop==="corn")return 0.18;
 if(crop==="palay")return -0.10;   /* floor protects */
 return 0.05;
}
function fuelStress(){return Math.max(0,SIGNALS.fuel.chg90d*1.1);}

function predict(rec,twin,today){
 var crop=rec.crop, ex=EXPOSURE[crop]||EXPOSURE.palay;
 var drivers=[],p=0.012;  /* base hazard on a controlled, buyer-backed book */

 /* 1. execution — the strongest single signal we control */
 var sc=twin?CXFARM.scores(twin,today):{overall:80,protocol:80};
 /* execution only starts costing below 75; a farm at 85 is not a risk */
 var execPenalty=Math.max(0,(75-sc.overall)/100)*0.30;
 p+=execPenalty;
 drivers.push({k:"exec",n:"Farm execution",v:sc.overall+"/100",w:execPenalty,
  d:sc.overall>=85?"Protocol is being followed. This is the strongest protective factor we have."
   :"Protocol compliance at "+sc.overall+". Missed or late tasks translate directly into a smaller harvest.",
  act:sc.overall<78?"intervene":null});

 /* 2. repayment cover */
 var f=twin?CXFARM.forecast(twin,today):{expected:0};
 var value=(f.expected||0)*(CXFARM.valuePerKg?CXFARM.valuePerKg(crop):20);
 var cover=rec.amt?value/rec.amt:0;
 var coverPenalty=cover>=2?-0.010:cover>=1.5?-0.004:cover>=1.3?0:(1.3-cover)*0.30;
 p+=coverPenalty;
 drivers.push({k:"cover",n:"Projected repayment cover",v:cover.toFixed(2)+"×",w:coverPenalty,
  d:cover>=2?"Projected crop value is more than twice the loan."
   :cover>=1.3?"Adequate cover with little margin for a bad harvest."
   :"Projected crop value does not comfortably clear the loan.",
  act:cover<1.3?"escalate":null});

 /* 3. buyer allocation */
 var noBuyer=!rec.buyerId;
 if(noBuyer){p+=0.085;drivers.push({k:"buyer",n:"Buyer allocation",v:"none",w:0.085,
  d:"No committed buyer. The harvest sells at whatever the market offers on the day, which is how the 2025 cohort failed.",act:"allocate"});}
 else drivers.push({k:"buyer",n:"Buyer allocation",v:"contracted",w:-0.05,
  d:"Output is contracted with an agreed floor price.",act:null});

 /* 4. price stress */
 var ps=priceStress(crop)*ex.price*0.85;
 p+=ps;
 var pr=SIGNALS.price[crop]||{};
 drivers.push({k:"price",n:"Price signal",v:(pr.spot!==undefined?"₱"+pr.spot:"—")+" spot, "+
  ((pr.chg30d||0)*100).toFixed(0)+"% in 30 days",w:ps,
  d:(pr.chg30d||0)<-0.05?"Farmgate price is falling and this crop has high price exposure."
   :"Price is stable against the five-year mean.",act:ps>0.05?"collar":null});

 /* 5. policy */
 var pol=policyStress(crop)*ex.policy*0.9;
 p+=pol;
 drivers.push({k:"policy",n:"Government policy",v:crop==="onion"?SIGNALS.policy.onionImportWindow:
  (crop==="palay"?"floor ₱"+SIGNALS.policy.riceFloor:"neutral"),w:pol,
  d:crop==="onion"?"Import window overlaps the harvest. A permit released into the local crop halves the farmgate price."
   :crop==="palay"?"The statutory floor limits how far the price can fall."
   :"No material policy exposure identified.",act:pol>0.06?"gate":null});

 /* 6. weather */
 var ws=weatherStress(twin,rec)*ex.weather*0.28;
 p+=ws;
 drivers.push({k:"weather",n:"Weather outlook",v:SIGNALS.weather.cyclones90d+" cyclones forecast, rainfall +"+
  Math.round(SIGNALS.weather.rainfallAnomaly*100)+"%",w:ws,
  d:SIGNALS.weather.note,act:ws>0.06?"pcic":null});

 /* 7. fuel and logistics */
 var fs=fuelStress()*ex.logi*0.30;
 p+=fs;
 drivers.push({k:"fuel",n:"Fuel and logistics",v:"₱"+SIGNALS.fuel.dieselPHP+", +"+Math.round(SIGNALS.fuel.chg90d*100)+"% in 90 days",w:fs,
  d:SIGNALS.fuel.note,act:null});

 /* 8. insurance */
 if(!rec.pcic){p+=0.022;drivers.push({k:"pcic",n:"PCIC cover",v:"none",w:0.030,
  d:"No parametric cover. A weather loss becomes a credit loss.",act:"pcic"});}

 p=Math.max(0.005,Math.min(0.95,p));
 drivers.sort(function(a,b){return b.w-a.w;});
 return {p:p,pct:p*100,
  band:p<0.03?"low":p<0.07?"watch":p<0.15?"elevated":"high",
  cover:cover,exposureNote:ex.note,drivers:drivers,
  top:drivers.filter(function(d){return d.w>0.02;}).slice(0,3),
  atRisk:Math.round(rec.amt*p*(1-Math.min(1,cover/2)))};
}

/* ---------- costed action plan ----------------------------------- */
var PLAYS={
 intervene:{n:"Field intervention on execution",cost:850,cut:0.35,who:"FRO",
  d:"Visit the farm, complete the overdue task with the farmer and verify it."},
 escalate:{n:"Credit review with the lending centre",cost:0,cut:0.10,who:"LANDBANK",
  d:"Flag for the account officer before maturity rather than after."},
 allocate:{n:"Allocate a contracted buyer",cost:0,cut:0.30,who:"Kita",
  d:"Assign the harvest to a signed offtake contract with a floor price."},
 collar:{n:"Confirm the price collar before harvest",cost:0,cut:0.18,who:"Kita",
  d:"Lock the floor so a falling market cannot reach the loan."},
 gate:{n:"Hold release until the policy window clears",cost:0,cut:0.40,who:"LANDBANK",
  d:"Do not release into a harvest that will collide with an import window."},
 pcic:{n:"Enrol in PCIC parametric cover",cost:0,cut:0.22,who:"Kita",
  d:"Converts a weather loss into an insurance payout assigned to the loan."}
};
function plan(pred,rec){
 var acts=[];
 pred.drivers.forEach(function(d){
  if(!d.act||!PLAYS[d.act])return;
  var pl=PLAYS[d.act];
  var reduced=pred.p*pl.cut;
  var saved=Math.round(rec.amt*reduced);
  acts.push({k:d.act,n:pl.n,who:pl.who,cost:pl.cost,d:pl.d,
   cutPct:pl.cut*100,ppReduced:+(pred.pct*pl.cut).toFixed(1),saved:saved,
   net:saved-pl.cost,driver:d.n});
 });
 acts.sort(function(a,b){return b.net-a.net;});
 var total=acts.reduce(function(a,x){return a+x.ppReduced;},0);
 return {actions:acts,ppReduced:+Math.min(pred.pct*0.85,total).toFixed(1),
  residual:+Math.max(pred.pct*0.15,pred.pct-total).toFixed(1)};
}

/* ---------- portfolio roll-up ------------------------------------ */
function portfolio(book,today){
 var rows=book.map(function(r){
  var t=null;
  try{t=CXFARM.twin(r.id)||CXFARM.ensure(r,today);}catch(e){}
  var pr=predict(r,t,today);
  return {rec:r,pred:pr,plan:plan(pr,r)};
 });
 var exposure=rows.reduce(function(a,x){return a+x.rec.amt;},0);
 var expected=rows.reduce(function(a,x){return a+x.rec.amt*x.pred.p;},0);
 var byCrop={},byProv={},byBand={low:0,watch:0,elevated:0,high:0};
 rows.forEach(function(x){
  var c=x.rec.crop,p=x.rec.prov;
  byCrop[c]=byCrop[c]||{n:0,amt:0,exp:0};byCrop[c].n++;byCrop[c].amt+=x.rec.amt;byCrop[c].exp+=x.rec.amt*x.pred.p;
  byProv[p]=byProv[p]||{n:0,amt:0,exp:0};byProv[p].n++;byProv[p].amt+=x.rec.amt;byProv[p].exp+=x.rec.amt*x.pred.p;
  byBand[x.pred.band]=(byBand[x.pred.band]||0)+1;
 });
 var avoidable=rows.reduce(function(a,x){
  return a+x.plan.actions.reduce(function(b,y){return b+Math.max(0,y.net);},0);},0);
 return {rows:rows,exposure:exposure,expectedLoss:expected,
  predictedNPL:exposure?expected/exposure:0,
  byCrop:byCrop,byProv:byProv,byBand:byBand,avoidable:avoidable,
  cost:rows.reduce(function(a,x){return a+x.plan.actions.reduce(function(b,y){return b+y.cost;},0);},0)};
}

/* ---------- risk feed -------------------------------------------- */
function feed(book,today){
 var P=portfolio(book,today),out=[];
 var noBuyer=P.rows.filter(function(x){return !x.rec.buyerId;});
 if(noBuyer.length){
  var byC={};noBuyer.forEach(function(x){byC[x.rec.crop]=(byC[x.rec.crop]||0)+1;});
  Object.keys(byC).forEach(function(c){
   out.push({sev:"warn",t:byC[c]+" "+(CX.CROPS[c]||{n:c}).n.toLowerCase()+" farms have no confirmed buyer allocation",
    d:"Output with no committed home is repaid at whatever the market offers on the day.",
    act:"Allocate to a contracted buyer before harvest."});});
 }
 var weak=P.rows.filter(function(x){return x.pred.cover<1.3&&x.rec.status!=="repaid";});
 if(weak.length)out.push({sev:"bad",t:weak.length+" loans have projected repayment cover below 1.3×",
  d:"Exposure "+CX.peso(weak.reduce(function(a,x){return a+x.rec.amt;},0))+". These are visible now, months before maturity.",
  act:"Credit review with the lending centre and a field intervention on execution."});
 var lowExec=P.rows.filter(function(x){
  var t=CXFARM.twin(x.rec.id); if(!t)return false;
  return CXFARM.scores(t,today).overall<70;});
 if(lowExec.length){
  var byP={};lowExec.forEach(function(x){byP[x.rec.prov]=(byP[x.rec.prov]||0)+1;});
  Object.keys(byP).forEach(function(pv){
   out.push({sev:"warn",t:byP[pv]+" farms in "+pv+" are behind on the production protocol",
    d:"Expected yields below plan. Execution is the largest single driver in the model.",
    act:"Field officer intervention — the cheapest channel that recovers the value."});});
 }
 if(SIGNALS.price.onion.chg30d<-0.10){
  var on=P.rows.filter(function(x){return x.rec.crop==="onion";});
  if(on.length)out.push({sev:"bad",t:"Onion farmgate down "+Math.round(-SIGNALS.price.onion.chg30d*100)+"% in 30 days, with "+on.length+" financed farms exposed",
   d:SIGNALS.policy.note,act:"Confirm the collar floor is signed on every onion contract before harvest."});
 }
 var good=P.rows.filter(function(x){return x.pred.band==="low";}).length;
 if(good)out.push({sev:"ok",t:good+" loans are in the low-risk band",
  d:"Contracted buyer, protocol on track and cover above 2×.",act:"No action. Do not spend field time here."});
 return out;
}

/* ---------- learning loop ---------------------------------------- */
function learn(){try{return JSON.parse(localStorage.getItem(LKEY)||"null")||{obs:[],version:MODEL.version};}catch(e){return {obs:[],version:MODEL.version};}}
function record(rec,predicted,outcome){
 var L=learn();
 L.obs.push({id:rec.id,crop:rec.crop,prov:rec.prov,predicted:predicted,outcome:outcome,at:new Date().toISOString()});
 try{localStorage.setItem(LKEY,JSON.stringify(L));}catch(e){}
 return L;
}
function accuracy(){
 var L=learn(),o=L.obs;
 if(o.length<5)return {n:o.length,ready:false,
  msg:"The model has "+o.length+" recorded outcomes. It needs a completed cohort before any accuracy claim is meaningful. Until then these are structured estimates, not predictions with a track record."};
 var brier=o.reduce(function(a,x){return a+Math.pow(x.predicted-(x.outcome?1:0),2);},0)/o.length;
 return {n:o.length,ready:true,brier:+brier.toFixed(3),
  msg:"Brier score "+brier.toFixed(3)+" across "+o.length+" closed loans. Lower is better; 0.25 is the score of guessing the base rate."};
}
return {SIGNALS:SIGNALS,EXPOSURE:EXPOSURE,MODEL:MODEL,predict:predict,PLAYS:PLAYS,plan:plan,
 portfolio:portfolio,feed:feed,learn:learn,record:record,accuracy:accuracy};
})();
</script>
<script>/* ==================================================================
   CXOS — the operating-system spine
   The event log is canonical. Every projection is derived by replay,
   which is the test of whether this is an operating system or a set
   of screens sharing a database. If replay reproduces state exactly,
   the claim holds.
   ================================================================== */
var CXOS=(function(){
"use strict";
var EKEY="cxos_events_v1", SKEY="cxos_snap_v1";

/* ---------- 1. Bounded contexts ----------------------------------
   The brief listed 34 "domains". Most are not domains — Notifications,
   Document Management, Analytics and Administration are infrastructure,
   and Fraud, Compliance and Risk are policies applied inside other
   contexts. Splitting them creates coordination cost with no
   independence gained. Eight contexts own data and publish events;
   the rest are capabilities that live inside them.               */
var DOMAINS=[
 {k:"identity",n:"Identity and Party",owns:"Farmer, buyer, supplier, processor, institution, staff. One party model, many roles.",
