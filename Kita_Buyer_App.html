  emits:["party.registered","party.verified","party.role.granted","consent.given"],
  consumes:[],
  why:"A farmer can also be a supplier and a cooperative officer. Modelling them as separate entities is the mistake that forces a rewrite at scale."},
 {k:"land",n:"Land and Production Asset",owns:"Parcel, polygon, tenure, soil, water, cropping history.",
  emits:["parcel.registered","parcel.mapped","tenure.evidenced","parcel.cropped"],
  consumes:["party.registered"],
  why:"The parcel outlives the loan, the farmer's tenancy and the crop. Attaching land to a loan record is why duplicate-financing fraud is hard to detect."},
 {k:"credit",n:"Credit",owns:"Application, facility, disbursement, repayment, exposure.",
  emits:["application.submitted","application.decided","facility.released","repayment.received","facility.closed"],
  consumes:["party.verified","parcel.mapped","plan.approved","offtake.contracted"],
  why:"Bank-agnostic by construction: the facility references an institution, it does not embed one."},
 {k:"agronomy",n:"Agronomy and Production",owns:"Crop protocol, farm plan, task execution, observation, yield forecast.",
  emits:["plan.approved","task.completed","observation.recorded","forecast.revised","harvest.recorded"],
  consumes:["facility.released","parcel.mapped","weather.observed"],
  why:"The only context that can say what the harvest will actually be. Everything downstream depends on it."},
 {k:"supply",n:"Input Supply",owns:"SKU, supplier, purchase order, delivery, receipt, reimbursement claim.",
  emits:["po.issued","delivery.dispatched","delivery.confirmed","claim.submitted","claim.settled"],
  consumes:["plan.approved","facility.released"],
  why:"This is where Kita's revenue and its working-capital risk both live."},
 {k:"market",n:"Offtake and Market",owns:"Buyer demand, contract, allocation, price collar, grade, settlement.",
  emits:["demand.registered","offtake.contracted","allocation.made","lot.graded","settlement.executed"],
  consumes:["forecast.revised","harvest.recorded"],
  why:"Demand-first is the structural difference. This context drives credit, not the other way round."},
 {k:"ledger",n:"Money and Ledger",owns:"Every movement of cash between the four parties. Double-entry, immutable.",
  emits:["obligation.created","payment.instructed","payment.settled","position.changed"],
  consumes:["claim.settled","settlement.executed","repayment.received"],
  why:"Missing from the brief and it is the most dangerous omission. See the working-capital note."},
 {k:"intelligence",n:"Intelligence",owns:"Signals, models, predictions, recommendations, interventions, outcomes.",
  emits:["signal.ingested","prediction.made","intervention.recommended","intervention.executed","outcome.observed"],
  consumes:["*"],
  why:"Reads everything, owns nothing operational. Predictions are events so they can be scored against outcomes later — a model that is not recorded cannot be evaluated."}
];
var CAPABILITIES=[
 {n:"Notifications",in:"infrastructure",note:"A delivery channel, not a domain. Every context emits; one service delivers."},
 {n:"Document management",in:"infrastructure",note:"Storage and OCR. The meaning of a document belongs to the context that requires it."},
 {n:"Analytics",in:"intelligence",note:"A read model over the event log, not a separate source of truth."},
 {n:"Administration",in:"infrastructure",note:"Tenancy, users, configuration."},
 {n:"Risk",in:"intelligence",note:"A policy applied to credit and market state, not a data owner."},
 {n:"Fraud",in:"intelligence",note:"Pattern detection over the graph. Owns no entities."},
 {n:"Compliance",in:"credit + identity",note:"Rules enforced at the boundary of the contexts that hold the obligation."},
 {n:"Weather, climate, remote sensing",in:"intelligence",note:"External signals ingested as events. Not a domain we own."},
 {n:"Behavioural performance, training",in:"agronomy",note:"Coaching is an intervention on execution. It belongs where execution is measured."},
 {n:"Processing, logistics, warehousing",in:"market",note:"Stages of moving a lot from farm to buyer. Separate contexts only once owned assets exist."}
];

/* ---------- 2. Event log ------------------------------------------ */
var SCHEMA_V=1;
function rd(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function log(){return rd(EKEY,[]);}
function emit(type,subject,payload,actor){
 var l=log();
 var e={seq:l.length+1,id:"evt_"+(l.length+1),ts:new Date().toISOString(),v:SCHEMA_V,
  type:type,domain:type.split(".")[0],subject:subject,actor:actor||"system",payload:payload||{}};
 l.push(e); wr(EKEY,l);
 return e;
}
function since(seq){return log().filter(function(e){return e.seq>(seq||0);});}
function byType(t){return log().filter(function(e){return e.type===t;});}
function bySubject(s){return log().filter(function(e){return e.subject===s;});}

/* ---------- 3. Projections — state derived only by replay --------- */
/* A reducer per read model. Nothing reads a stored object; everything
   is folded from the log. This is what makes the log canonical. */
var REDUCERS={
 portfolio:function(s,e){
  s=s||{parties:{},parcels:{},facilities:{},exposure:0,released:0,repaid:0};
  if(e.type==="party.registered")s.parties[e.subject]={id:e.subject,role:e.payload.role,name:e.payload.name};
  if(e.type==="parcel.registered")s.parcels[e.subject]={id:e.subject,ha:e.payload.ha,party:e.payload.party};
  if(e.type==="application.submitted")s.facilities[e.subject]={id:e.subject,state:"submitted",amt:e.payload.amt,party:e.payload.party};
  if(e.type==="application.decided"&&s.facilities[e.subject])s.facilities[e.subject].state=e.payload.decision;
  if(e.type==="facility.released"&&s.facilities[e.subject]){s.facilities[e.subject].state="released";s.released+=e.payload.amt||0;s.exposure+=e.payload.amt||0;}
  if(e.type==="repayment.received"&&s.facilities[e.subject]){s.repaid+=e.payload.amt||0;s.exposure-=e.payload.amt||0;}
  if(e.type==="facility.closed"&&s.facilities[e.subject])s.facilities[e.subject].state="closed";
  return s;},
 production:function(s,e){
  s=s||{plans:0,tasksDone:0,observations:0,forecastKg:0,harvestedKg:0};
  if(e.type==="plan.approved")s.plans++;
  if(e.type==="task.completed")s.tasksDone++;
  if(e.type==="observation.recorded")s.observations++;
  if(e.type==="forecast.revised")s.forecastKg=e.payload.kg||s.forecastKg;
  if(e.type==="harvest.recorded")s.harvestedKg+=e.payload.kg||0;
  return s;},
 money:function(s,e){
  s=s||{claims:0,claimValue:0,settled:0,settledValue:0,owedToCompanyX:0};
  if(e.type==="claim.submitted"){s.claims++;s.claimValue+=e.payload.amt||0;s.owedToCompanyX+=e.payload.amt||0;}
  if(e.type==="claim.settled"){s.settled++;s.settledValue+=e.payload.amt||0;s.owedToCompanyX-=e.payload.amt||0;}
  return s;},
 intelligence:function(s,e){
  s=s||{predictions:0,recommended:0,executed:0,outcomes:0,scored:[]};
  if(e.type==="prediction.made"){s.predictions++;}
  if(e.type==="intervention.recommended")s.recommended++;
  if(e.type==="intervention.executed")s.executed++;
  if(e.type==="outcome.observed"){s.outcomes++;s.scored.push({p:e.payload.predicted,o:e.payload.actual});}
  return s;}
};
function project(name,upto){
 var r=REDUCERS[name]; if(!r)return null;
 var s=null;
 log().forEach(function(e){ if(upto&&e.seq>upto)return; s=r(s,e); });
 return s||r(null,{type:"__init__",payload:{}});
}
/* replay determinism check — the OS claim, testable */
function verifyReplay(){
 var a=JSON.stringify(project("portfolio"));
 var b=JSON.stringify(project("portfolio"));
 var half=Math.floor(log().length/2);
 var partial=project("portfolio",half);
 var full=project("portfolio");
 return {deterministic:a===b,
  incrementalOk:JSON.stringify(partial)!==JSON.stringify(full)||log().length<2,
  events:log().length,
  msg:a===b?"Replay is deterministic. State is a pure function of the log."
   :"Replay is NOT deterministic — a reducer has a side effect and must be fixed."};
}

/* ---------- 4. Transaction graph ---------------------------------- */
var EDGES=[
 {e:"party.registered",from:"party",to:null},
 {e:"parcel.registered",from:"parcel",to:"party",rel:"farmed_by"},
 {e:"application.submitted",from:"facility",to:"party",rel:"borrower"},
 {e:"facility.released",from:"facility",to:"parcel",rel:"finances"},
 {e:"plan.approved",from:"plan",to:"facility",rel:"funded_by"},
 {e:"po.issued",from:"po",to:"plan",rel:"fulfils"},
 {e:"delivery.confirmed",from:"delivery",to:"po",rel:"against"},
 {e:"claim.submitted",from:"claim",to:"delivery",rel:"evidences"},
 {e:"task.completed",from:"task",to:"plan",rel:"executes"},
 {e:"observation.recorded",from:"obs",to:"parcel",rel:"observes"},
 {e:"harvest.recorded",from:"lot",to:"parcel",rel:"harvested_from"},
 {e:"allocation.made",from:"lot",to:"contract",rel:"allocated_to"},
 {e:"lot.graded",from:"grade",to:"lot",rel:"grades"},
 {e:"settlement.executed",from:"payment",to:"lot",rel:"pays_for"},
 {e:"repayment.received",from:"payment",to:"facility",rel:"repays"},
 {e:"outcome.observed",from:"outcome",to:"prediction",rel:"scores"}
];
function graph(){
 var nodes={},edges=[];
 log().forEach(function(e){
  var d=EDGES.filter(function(x){return x.e===e.type;})[0];
  if(!d)return;
  var a=d.from+":"+e.subject;
  nodes[a]=nodes[a]||{id:a,kind:d.from,deg:0};
  if(d.to&&e.payload[d.to]){
   var b=d.to+":"+e.payload[d.to];
   nodes[b]=nodes[b]||{id:b,kind:d.to,deg:0};
   edges.push({a:a,b:b,rel:d.rel});
   nodes[a].deg++;nodes[b].deg++;
  }
 });
 var byKind={};
 Object.keys(nodes).forEach(function(k){byKind[nodes[k].kind]=(byKind[nodes[k].kind]||0)+1;});
 return {nodes:Object.keys(nodes).map(function(k){return nodes[k];}),edges:edges,byKind:byKind,
  density:Object.keys(nodes).length?edges.length/Object.keys(nodes).length:0};
}

/* ---------- 5. Honest defensibility test -------------------------- */
/* The brief asserts the graph is the moat. Tested properly, most of it
   is not. This scores each asset on whether a competitor with money
   and time could reproduce it. */
var MOAT=[
 {a:"Agronomic protocols and yield-response curves",repro:"Weeks",
  why:"IRRI, CGIAR, PhilRice and the DA publish this. A competent agronomist reproduces it from public sources.",
  defensible:false},
 {a:"Farm polygons and parcel registry",repro:"One season",
  why:"Any operator with field staff and a phone captures the same polygons. It is work, not a moat.",
  defensible:false},
 {a:"Input price and supplier data",repro:"Months",
  why:"Distributors quote anyone. Scale buys better pricing, but scale is capital, not data.",
  defensible:false},
 {a:"Crop photos and observations",repro:"One to two seasons",
  why:"Volume helps a vision model, but the marginal value falls fast and the models are commoditising.",
  defensible:false},
 {a:"Repayment performance linked to execution and parcel",repro:"Three to five years",
  why:"This is the asset. Nobody can synthesise it, buy it, or accelerate it — it accrues only by lending and waiting. It is also the one thing a bank cannot obtain elsewhere.",
  defensible:true},
 {a:"Quadripartite contract position",repro:"Very hard",
  why:"Four counterparties bound in one agreement. Displacing Kita requires the farmer, the bank and the buyer to move together and simultaneously.",
  defensible:true},
 {a:"LANDBANK accreditation and integration",repro:"Years, and not purely commercial",
  why:"Institutional trust and a completed integration are slow to earn and slow to transfer.",
  defensible:true},
 {a:"Buyer contracts with committed volume",repro:"One to two years",
  why:"Relationship and delivery track record. Defensible in the medium term, not permanent.",
  defensible:"partial"}
];
function moatScore(){
 var d=MOAT.filter(function(x){return x.defensible===true;}).length;
 return {defensible:d,total:MOAT.length,
  verdict:"Three of eight assets are genuinely hard to reproduce, and none of the three is the raw graph. "+
   "The defensible core is repayment history bound into a four-party contract inside an accredited bank relationship. "+
   "The graph is the substrate that makes those three compound — it is necessary and it is not sufficient."};
}

/* ---------- 6. Scale reality check -------------------------------- */
function scaleCheck(current){
 var target={farmers:1000000,portfolio:100e9,banks:100};
 var f=current.farmers||0, p=current.portfolio||0;
 return {
  farmers:{now:f,target:target.farmers,x:target.farmers/Math.max(1,f)},
  portfolio:{now:p,target:target.portfolio,x:target.portfolio/Math.max(1,p)},
  binding:"Neither storage nor compute is the constraint at one million farmers. The binding constraints are field operations headcount, working capital to carry input purchases before reimbursement, and bank accreditation in each new institution.",
  mustBeFutureProof:["Party and parcel identity","Event schema and versioning","The ledger","Permission model"],
  deliberatelyDisposable:["Every screen","Report layouts","The current scoring coefficients","Crop protocol content","This entire UI layer"],
  note:"Designing the disposable parts for a million farmers now is the most expensive mistake available. Design the four permanent things properly and rewrite the rest twice."};
}

/* ---------- 7. Seed the log from current state -------------------- */
function seedFromState(){
 if(log().length)return log().length;
 var b=CX.book();
 b.forEach(function(f){
  emit("party.registered",f.id,{role:"farmer",name:f.name},"seed");
  emit("parcel.registered","P-"+f.id,{party:f.id,ha:f.ha,muni:f.muni},"seed");
  emit("parcel.mapped","P-"+f.id,{party:f.id,verified:!!f.gpsOk},"seed");
  emit("application.submitted","L-"+f.id,{party:f.id,amt:f.amt,crop:f.crop},"seed");
  emit("application.decided","L-"+f.id,{decision:"approved"},"lbp_credit");
  if(f.status!=="in-season"){
   emit("facility.released","L-"+f.id,{parcel:"P-"+f.id,amt:f.amt},"lbp_mgr");
   emit("plan.approved","PL-"+f.id,{facility:"L-"+f.id,crop:f.crop},"agronomist");
   emit("po.issued","PO-"+f.id,{plan:"PL-"+f.id,value:Math.round(f.amt*0.65)},"procurement");
   emit("delivery.confirmed","D-"+f.id,{po:"PO-"+f.id,party:f.id},"farmer");
   emit("claim.submitted","C-"+f.id,{delivery:"D-"+f.id,amt:Math.round(f.amt*0.65)},"ops");
   if(CX.rnd(f.id+"c")<0.7)emit("claim.settled","C-"+f.id,{amt:Math.round(f.amt*0.65)},"lbp_mgr");
  }
  if(f.buyerId)emit("allocation.made","LOT-"+f.id,{contract:f.buyerId,parcel:"P-"+f.id},"ops");
  if(f.status==="repaid"){
   emit("harvest.recorded","LOT-"+f.id,{parcel:"P-"+f.id,kg:Math.round(CX.CROPS[f.crop].yld*f.ha)},"farmer");
   emit("lot.graded","G-"+f.id,{lot:"LOT-"+f.id,grade:"A"},"buyer");
   emit("settlement.executed","S-"+f.id,{lot:"LOT-"+f.id,amt:Math.round(CX.projValue(f))},"buyer");
   emit("repayment.received","L-"+f.id,{facility:"L-"+f.id,amt:f.amt},"lbp_credit");
   emit("facility.closed","L-"+f.id,{},"lbp_credit");
  }
 });
 return log().length;
}
function reset(){wr(EKEY,[]);wr(SKEY,null);}
return {DOMAINS:DOMAINS,CAPABILITIES:CAPABILITIES,SCHEMA_V:SCHEMA_V,
 emit:emit,log:log,since:since,byType:byType,bySubject:bySubject,
 REDUCERS:REDUCERS,project:project,verifyReplay:verifyReplay,
 EDGES:EDGES,graph:graph,MOAT:MOAT,moatScore:moatScore,scaleCheck:scaleCheck,
 seedFromState:seedFromState,reset:reset,EKEY:EKEY};
})();
</script>
<script>/* ==================================================================
   CXLO — Lending Officer Workbench engine
   Designed around one principle: the officer is an exception manager.
   AI completes the administrative work and presents a decision; the
   officer decides, attests and signs. The attestation is explicit and
   recorded, because "the officer did not open the file" is not a
   defensible position in a credit review and never will be.
   ================================================================== */
var CXLO=(function(){
"use strict";
var KEY="cxlo_v1";

/* ---------- configurable policy ---------------------------------
   Codes are placeholders. Point them at the live circular numbers in
   configuration; nothing in the engine hard-codes a rule.        */
var POLICY={
 version:"cfg-2026.11",
 note:"Policy codes are configurable placeholders. Map them to current LANDBANK circulars before go-live.",
 rules:[
  {k:"officerLimit",n:"Loan officer approval limit",v:300000,ref:"LC-AUTH-01",
   d:"Above this the file must be endorsed to the Lending Centre Head."},
  {k:"ageBand",n:"Borrower age band",v:[18,65],ref:"AGRI-ELIG-02",
   d:"At least 18 and not more than 65 at application, per the published programme criteria."},
  {k:"financePct",n:"Maximum share of production cost",v:0.90,ref:"AGRI-LOAN-03"},
  {k:"minCover",n:"Minimum projected repayment cover",v:1.30,ref:"AGRI-RISK-04",
   d:"Below this the file requires a documented justification."},
  {k:"areaTol",n:"Declared vs mapped area tolerance",v:0.10,ref:"AGRI-FARM-05",
   d:"Beyond this a field verification is required before release."},
  {k:"leaseBuffer",n:"Lease must outlast maturity by",v:60,ref:"AGRI-TEN-06",
   d:"Days. A lease expiring inside the loan term is a security defect."},
  {k:"idValidity",n:"Government ID must be valid at approval",v:true,ref:"KYC-01"},
  {k:"buyerRequired",n:"Buyer allocation required before release",v:["ube","onion","citronella"],ref:"AGRI-MKT-07",
   d:"For crops with no deep local market and high price volatility."}
 ]
};
function P(k){var r=POLICY.rules.filter(function(x){return x.k===k;})[0];return r?r.v:null;}
function ref(k){var r=POLICY.rules.filter(function(x){return x.k===k;})[0];return r?r.ref:"";}

/* ---------- document taxonomy ----------------------------------- */
var DOCTYPES=[
 {k:"id",cat:"Identity",n:"Government-issued ID",fields:["fullName","birthDate","idNumber","expiry"],esign:false},
 {k:"rsbsa",cat:"RSBSA",n:"RSBSA card or MAO-signed enrolment stub",fields:["rsbsaNo","registeredName","location","area"],esign:false},
 {k:"title",cat:"Land documents",n:"Certified true copy of title",fields:["titleNo","registeredOwner","area","lotNo"],esign:false},
 {k:"tenancy",cat:"Land documents",n:"Tenancy certification or lease contract",fields:["landowner","tenant","term","expiry"],esign:false},
 {k:"nia",cat:"Land documents",n:"NIA endorsement",fields:["masterlistNo","serviceArea"],esign:false},
 {k:"farmplan",cat:"Farm plan",n:"Farm plan and budget",fields:["crop","area","totalCost","loanRequested"],esign:true},
 {k:"income",cat:"Income projection",n:"Income projection",fields:["yieldKg","price","grossIncome","netIncome"],esign:true},
 {k:"appform",cat:"Application",n:"Loan application form with photographs",fields:["borrower","amount","purpose","term"],esign:true},
 {k:"consent",cat:"Consents",n:"Data privacy and credit evaluation consents",fields:["version","acceptedAt"],esign:true},
 {k:"buyer",cat:"Buyer documents",n:"Offtake contract or allocation letter",fields:["buyer","volume","price","terms"],esign:false},
 {k:"map",cat:"Maps",n:"Farm polygon and location map",fields:["mappedArea","centroid"],esign:false},
 {k:"photos",cat:"Photos",n:"Farmer and farm photographs",fields:["count","capturedAt"],esign:false},
 {k:"orientation",cat:"Application",n:"Loan orientation attendance",fields:["sessionDate"],esign:false},
 {k:"prev",cat:"Previous loans",n:"Previous loan record and repayment history",fields:["cycles","repaid"],esign:false}
];
function catOf(k){var d=DOCTYPES.filter(function(x){return x.k===k;})[0];return d?d.cat:"Other";}

/* ---------- build an application from the book ------------------- */
function rnd(s){var h=2166136261;s=""+s;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)/4294967295;}
function required(f){
 var need=["id","rsbsa","farmplan","income","appform","consent","map","photos"];
 if(f.prov==="Nueva Ecija")need.push("title");
 if(f.tenure!=="owner")need.push("tenancy");
 if(f.crop==="palay"&&f.water==="irrigated")need.push("nia");
 if((P("buyerRequired")||[]).indexOf(f.crop)>=0)need.push("buyer");
 if(!f.reAvailer)need.push("orientation");
 if(f.cyclesDone)need.push("prev");
 return need;
}
function extract(f,k){
 /* AI extraction with per-field confidence and provenance */
 var base=0.86+rnd(f.id+k)*0.13;
 var d=DOCTYPES.filter(function(x){return x.k===k;})[0];
 if(!d&&window.CXDOC){
  var rr=CXDOC.REQ.filter(function(x){return x.k===k;})[0];
  if(rr)d={k:k,cat:rr.cat,n:rr.n,fields:[],esign:!!rr.form};
 }
 d=d||{fields:[]};
 var vals={
  fullName:f.name,birthDate:"1978-04-12",idNumber:"XXXX-XXXX-XXXX-XX",expiry:"2031-04-12",
  rsbsaNo:"03-49-12-001-0"+String(100000+Math.floor(rnd(f.id)*899999)).slice(0,5),
  registeredName:f.name,location:f.brgy+", "+f.muni+", "+f.prov,area:f.ha,
  titleNo:"TCT-"+Math.floor(10000+rnd(f.id+"t")*89999),registeredOwner:f.name,lotNo:"Lot "+Math.ceil(rnd(f.id)*40),
  landowner:"—",tenant:f.name,term:"3 years",expiry2:"2028-06-30",
  masterlistNo:"NIA-"+f.muni.slice(0,3).toUpperCase()+"-"+Math.floor(1000+rnd(f.id)*8999),serviceArea:f.muni,
  crop:CX.CROPS[f.crop].n,totalCost:Math.round(CX.CROPS[f.crop].costHa*f.ha),loanRequested:f.amt,
  yieldKg:Math.round(CX.CROPS[f.crop].yld*f.ha),price:CX.CROPS[f.crop].price,
  grossIncome:Math.round(CX.projValue(f)),netIncome:Math.round(CX.projValue(f)-CX.CROPS[f.crop].costHa*f.ha),
  borrower:f.name,amount:f.amt,purpose:"Crop production",term:"360 days",
  version:"v1.2",acceptedAt:"2026-11-02",
  buyer:(CX.buyers().filter(function(b){return b.id===f.buyerId;})[0]||{}).n||"—",
  volume:"—",terms:"—",mappedArea:+(f.ha*(0.92+rnd(f.id+"m")*0.2)).toFixed(2),centroid:"15.5°N 120.9°E",
  count:6,capturedAt:"2026-11-01",sessionDate:"2026-10-18",cycles:f.cyclesDone||0,repaid:"100%"
 };
 return d.fields.map(function(fl){
  return {f:fl,v:vals[fl]!==undefined?vals[fl]:(fl==="expiry"&&k==="tenancy"?vals.expiry2:"—"),
   conf:+(base-(rnd(f.id+k+fl)*0.10)).toFixed(2)};
 });
}
function docState(f,k){
 var r=rnd(f.id+"|"+k);
 /* Kita resolves most defects before submitting, so the residual
    rate here is what genuinely survives their own quality assurance. */
 if(!f.docsOk&&r<0.055)return "missing";
 if(r<0.022)return "needs-review";
 if(k==="id"&&r>0.985)return "expired";
 if(r>=0.022&&r<0.032)return "unreadable";
 return "verified";
}
function build(f){
 var need=required(f);
 /* checklist generated from the canonical registry, not a hand-maintained list */
 if(window.CXDOC){
  need=CXDOC.required(f).map(function(r){return r.k;});
 }
 var docs=need.map(function(k){
  var st=docState(f,k);
  var meta=DOCTYPES.filter(function(x){return x.k===k;})[0];
  if(!meta&&window.CXDOC)meta=CXDOC.REQ.filter(function(x){return x.k===k;})[0];
  meta=meta||{};
  return {k:k,cat:meta.cat||catOf(k),n:meta.n||k,fields:meta.fields||[],
   state:st,fields:st==="missing"?[]:extract(f,k),
   conf:st==="missing"?0:+(0.86+rnd(f.id+k)*0.13).toFixed(2)};
 });
 var present=docs.filter(function(d){return d.state==="verified";}).length;
 var completeness=Math.round(present/docs.length*100);
 return {fid:f.id,rec:f,docs:docs,required:need,completeness:completeness};
}

/* ---------- exception engine ------------------------------------- */
function exceptions(pkg){
 var f=pkg.rec,ex=[];
 function add(sev,t,evidence,action,policyKey,conf){
  ex.push({sev:sev,t:t,evidence:evidence,action:action,ref:ref(policyKey),
   policy:(POLICY.rules.filter(function(r){return r.k===policyKey;})[0]||{}).d||"",conf:conf||0.9,open:true});
 }
 pkg.docs.filter(function(d){return d.state==="missing";}).forEach(function(d){
  add("blocking","Missing document — "+d.n,"Not present in the submitted package.",
   "Request from Kita. The file cannot be endorsed without it.","idValidity",0.99);});
 pkg.docs.filter(function(d){return d.state==="expired";}).forEach(function(d){
  add("blocking",d.n+" has expired","Expiry date read from the document is before today.",
   "Request a current document.","idValidity",0.96);});
 pkg.docs.filter(function(d){return d.state==="needs-review";}).forEach(function(d){
  add("review",d.n+" needs a look","Extraction confidence below the auto-accept threshold on one or more fields.",
   "Open the document alongside the extracted fields and confirm or correct.","idValidity",0.79);});
 pkg.docs.filter(function(d){return d.state==="unreadable";}).forEach(function(d){
  add("clarify",d.n+" could not be read","Image quality below the extraction threshold.",
   "Request a clearer scan. No manual re-typing required once received.","idValidity",0.88);});
 var mapDoc=docOf(pkg,"map")[0];
 if(mapDoc&&mapDoc.fields.length){
  var mapped=+((mapDoc.fields.filter(function(x){return x.f==="mappedArea";})[0]||{}).v||0);
  if(mapped){
   var diff=Math.abs(mapped-f.ha)/f.ha;
   if(diff>P("areaTol"))add("review","Farm area differs by "+Math.round(diff*100)+"%",
    "Declared "+f.ha+" ha on the application; polygon measures "+mapped+" ha.",
    "Field verification before release, or amend the declared area and recompute the budget.","areaTol",0.94);
  }
 }
 var ten=docOf(pkg,["tenancy","lease","title","cloa"])[0];
 if(ten&&ten.fields.length){
  var exp=(ten.fields.filter(function(x){return x.f==="expiry";})[0]||{}).v;
  if(exp&&exp!=="—"){
   var mat=CXFARM?CXFARM.addD(f.plant,360):null;
   if(mat&&exp<mat)add("blocking","Lease expires before loan maturity",
    "Lease ends "+exp+"; the facility matures "+mat+".",
    "Obtain a lease extension or a landowner undertaking covering the term.","leaseBuffer",0.97);
  }
 }
 if(f.amt>P("officerLimit"))add("route","Above the officer approval limit",
  CX.pesoX(f.amt)+" exceeds the "+CX.pesoX(P("officerLimit"))+" limit.",
  "Endorse to the Lending Centre Head. This is routing, not a defect.","officerLimit",1.0);
 var t=null;try{t=CXFARM.ensure(f,CX.dISO(CX.NOW()));}catch(e){}
 var cover=t?(CXFARM.forecast(t,CX.dISO(CX.NOW())).expected*CXFARM.valuePerKg(f.crop))/f.amt:0;
 if(cover&&cover<P("minCover"))add("review","Projected repayment cover below policy",
  "Cover "+cover.toFixed(2)+"× against a "+P("minCover")+"× minimum.",
  "Document the justification, reduce the amount, or require additional security.","minCover",0.91);
 if((P("buyerRequired")||[]).indexOf(f.crop)>=0&&!f.buyerId)
  add("blocking","Buyer not yet allocated for "+CX.CROPS[f.crop].n,
   "No offtake contract attached to the file.",
   "Kita to allocate a contracted buyer before release.","buyerRequired",0.99);
 var dup=CX.book().filter(function(o){return o.id!==f.id&&o.muni===f.muni&&
  o.name.split(" ").pop()===f.name.split(" ").pop();});
 if(dup.length&&!f.gpsOk)add("review","Possible duplicate parcel",
  "Same surname in "+f.muni+" on "+dup.length+" other file(s), and no polygon captured on this one.",
  "Capture the polygon and run the overlap test before release.","areaTol",0.72);
 return ex;
}

/* ---------- AI assessment ---------------------------------------- */
/* Documents are named by the canonical registry. Look them up defensively:
   a registry rename must degrade, never throw. */
function docOf(pkg,keys){
 keys=(keys instanceof Array)?keys:[keys];
 var hit=pkg.docs.filter(function(d){return keys.indexOf(d.k)>=0;});
 return hit.length?hit:[{k:keys[0],state:"missing",n:keys[0],cat:"Other",fields:[],esign:false}];
}
function docOk(pkg,keys){
 return docOf(pkg,keys).every(function(d){return d.state==="verified";});
}
function assess(pkg){
 var f=pkg.rec,ex=exceptions(pkg);
 var blocking=ex.filter(function(x){return x.sev==="blocking";});
 var review=ex.filter(function(x){return x.sev==="review";});
 var clarify=ex.filter(function(x){return x.sev==="clarify";});
 var route=ex.filter(function(x){return x.sev==="route";});
 var t=null;try{t=CXFARM.ensure(f,CX.dISO(CX.NOW()));}catch(e){}
 var fc=t?CXFARM.forecast(t,CX.dISO(CX.NOW())):null;
 var value=fc?fc.expected*CXFARM.valuePerKg(f.crop):CX.projValue(f);
 var cover=f.amt?value/f.amt:0;
 var risk=null;try{risk=CXNPL.predict(f,t,CX.dISO(CX.NOW()));}catch(e){}
 var rec,conf;
 if(blocking.length){rec="return";conf=0.97;}
 else if(clarify.length){rec="clarify";conf=0.9;}
 else if(review.length){rec="review";conf=0.82;}
 else if(route.length){rec="endorse";conf=0.94;}
 else {rec="approve";conf=0.93;}
 var mins=2+blocking.length*3+review.length*4+clarify.length*2+(rec==="approve"?0:2);
 return {pkg:pkg,ex:ex,blocking:blocking,review:review,clarify:clarify,route:route,
  completeness:pkg.completeness,cover:cover,value:value,forecast:fc,risk:risk,
  recommendation:rec,confidence:conf,estMinutes:mins,
  checks:[
   ["Application completeness",pkg.completeness+"%",pkg.completeness>=95],
   ["Identity",docOk(pkg,["id","id1","id2"])?"Verified":"Open",docOk(pkg,["id","id1","id2"])],
   ["RSBSA",docOk(pkg,"rsbsa")?"Verified":"Open",docOk(pkg,"rsbsa")],
   ["Land tenure",docOk(pkg,["tenancy","title","cloa","lease"])?"Verified":"Open",
    docOk(pkg,["tenancy","title","cloa","lease"])],
   ["Crop insurance (PCIC)",docOk(pkg,"pcic")?"Enrolled":"Open",docOk(pkg,"pcic")],
   ["Credit life cover (CLIP)",docOk(pkg,"clip")?"Enrolled":"Open",docOk(pkg,"clip")],
   ["Farm area",docOk(pkg,"map")&&!ex.some(function(x){return /area differs/.test(x.t);})?"Verified":"Variance",
    !ex.some(function(x){return /area differs/.test(x.t);})],
   ["Farm plan","Matches the approved template",true],
   ["Projected repayment cover",cover.toFixed(2)+"×",cover>=P("minCover")],
   ["Policy exceptions",ex.length?ex.length+" open":"None",ex.length===0]
  ]};
}

/* ---------- e-signature and wet-signature policy ----------------- */
var SIGPOLICY={
 note:"RA 8792 recognises electronic signatures. Whether a given document may be e-signed is a bank policy decision, not a technical one — this matrix is configuration.",
 matrix:DOCTYPES.map(function(d){return {k:d.k,n:d.n,esign:d.esign,
  reason:d.esign?"Electronic signature permitted under the configured policy."
   :"Wet signature required by policy. A print pack and routing sheet are generated automatically."};})
};
function signable(k){var m=SIGPOLICY.matrix.filter(function(x){return x.k===k;})[0];return m?m.esign:false;}
function esign(pkg,who,role,docKeys){
 var rec={id:"SIG-"+pkg.fid+"-"+Date.now().toString().slice(-5),
  signer:who,role:role,at:new Date().toISOString(),
  method:"Platform credential + one-time passcode",
  device:(typeof navigator!=="undefined"?navigator.userAgent.slice(0,54):"server"),
  docs:docKeys,version:"v1",hash:"sha256:"+Math.abs(Math.round(rnd(pkg.fid+who)*1e15)).toString(16)};
 CXP.log({obj:"loan",id:pkg.fid,from:"—",to:"E-signed by "+role,role:role,actor:who,ai:null});
 return rec;
}
function wetPack(pkg){
 var wet=pkg.docs.filter(function(d){return !signable(d.k);});
 return {docs:wet.map(function(d){return d.n;}),
  signatories:["Borrower","Co-maker (if any)","Loan Officer","Lending Centre Head"],
  routing:["Kita field officer","Borrower","Lending centre","Records"],
  barcode:"CX-"+pkg.fid+"-WET",qr:"cx://pack/"+pkg.fid,
  manifest:pkg.docs.map(function(d,i){return {seq:i+1,doc:d.n,state:d.state,sig:signable(d.k)?"e-sign":"wet"};})};
}

/* ---------- attestation ------------------------------------------
   The design challenge the brief creates: an officer who never opens a
   file cannot defend the decision later. The resolution is not to force
   him to read everything — it is to make what he relied on explicit and
   recorded. */
function attest(pkg,a,who,role,decision,note,openedExceptions){
 var rec={id:"ATT-"+pkg.fid,at:new Date().toISOString(),officer:who,role:role,
  decision:decision,note:note||"",
  reliedOn:{aiVersion:(CXNPL&&CXNPL.MODEL?CXNPL.MODEL.version:"—"),
   completeness:a.completeness,confidence:a.confidence,
   recommendation:a.recommendation,cover:+a.cover.toFixed(2),
   exceptionsOpen:a.ex.length,exceptionsReviewed:openedExceptions||[]},
  statement:"I relied on the AI-prepared assessment recorded above, reviewed the exceptions listed, "+
   "and make this decision on that basis."};
 CXP.log({obj:"loan",id:pkg.fid,from:"Under Credit Evaluation",to:decision,role:role,actor:who,
  ai:"risk",approval:true});
 CXOS&&CXOS.emit&&CXOS.emit("application.decided",pkg.fid,{decision:decision,officer:who,attested:true},who);
 return rec;
}

/* ---------- queue ------------------------------------------------- */
var ACTIONS={approve:"Ready to approve",endorse:"Ready to endorse",review:"Ready for review",
 clarify:"Needs clarification",return:"Missing document"};
function queue(lc){
 var b=CX.book().filter(function(f){return f.status==="in-season";});
 if(lc)b=b.filter(function(f){return f.lc===lc;});
 return b.map(function(f){
  var pkg=build(f),a=assess(pkg);
  var age=3+Math.round(rnd(f.id+"age")*26);
  return {f:f,pkg:pkg,a:a,age:age,
   action:ACTIONS[a.recommendation],
   priority:(a.blocking.length?0:0)+(age>21?3:age>14?2:0)+(f.amt>500000?1:0)+(a.recommendation==="approve"?2:0)};
 }).sort(function(x,y){return y.priority-x.priority;});
}
function bulkEligible(q){
 /* Only zero-exception files inside the officer limit. Bulk is a
    keystroke saving, never a review saving — each still writes its own
    attestation. */
 return q.filter(function(x){return x.a.ex.length===0&&x.f.amt<=P("officerLimit")&&x.a.completeness>=95;});
}
return {POLICY:POLICY,P:P,ref:ref,DOCTYPES:DOCTYPES,build:build,exceptions:exceptions,assess:assess,
 SIGPOLICY:SIGPOLICY,signable:signable,esign:esign,wetPack:wetPack,attest:attest,
 queue:queue,bulkEligible:bulkEligible,ACTIONS:ACTIONS,required:required};
})();

/* ==================================================================
   CXRG — Readiness, Gate, Package, Lifecycle
   The submission is event-driven, not document-driven. Kita may
   not submit until the gate passes; the officer receives a versioned,
   AI-generated credit package rather than a folder of PDFs.
   ================================================================== */
var CXRG=(function(){
"use strict";
var PKEY="cxrg_pkg_v1";

/* ---------- 1. Approval Readiness Score --------------------------- */
var COMPONENTS=[
 {k:"identity",n:"Identity verified",w:12,
  test:function(p,a){var d=p.docs.filter(function(x){return x.k==="id";})[0];return d&&d.state==="verified";},
  fail:"Government ID not verified."},
 {k:"rsbsa",n:"RSBSA verified",w:8,
  test:function(p){var d=p.docs.filter(function(x){return x.k==="rsbsa";})[0];return d&&d.state==="verified";},
  fail:"RSBSA registration not verified."},
 {k:"polygon",n:"Farm polygon verified",w:12,
  test:function(p,a){return !a.ex.some(function(e){return /area differs|duplicate parcel/i.test(e.t);})&&
   (p.docs.filter(function(x){return x.k==="map";})[0]||{}).state==="verified";},
  fail:"Farm polygon differs from the declared area, or has not been captured."},
 {k:"tenure",n:"Land tenure verified",w:12,
  test:function(p,a){return p.docs.filter(function(x){return x.k==="tenancy"||x.k==="title";})
    .every(function(d){return d.state==="verified";})&&!a.ex.some(function(e){return /lease expires/i.test(e.t);});},
  fail:"Land tenure evidence incomplete, or the lease expires before maturity."},
 {k:"docs",n:"Required documents complete",w:16,
  test:function(p){return p.docs.every(function(d){return d.state==="verified";});},
  fail:function(p){var m=p.docs.filter(function(d){return d.state!=="verified";});
   return m.length+" document"+(m.length>1?"s":"")+" outstanding: "+m.map(function(d){return d.n;}).join(", ")+".";}},
 {k:"plan",n:"Farm plan generated",w:6,
  test:function(p){return (p.docs.filter(function(x){return x.k==="farmplan";})[0]||{}).state==="verified";},
  fail:"Farm plan and budget not on file."},
 {k:"budget",n:"Budget validated",w:6,
  test:function(p,a){return a.cover>0;},fail:"Production budget could not be validated."},
 {k:"income",n:"Income projection complete",w:5,
  test:function(p){return (p.docs.filter(function(x){return x.k==="income";})[0]||{}).state==="verified";},
  fail:"Income projection not on file."},
 {k:"buyer",n:"Buyer allocated where required",w:8,
  test:function(p,a){return !a.ex.some(function(e){return /Buyer not yet allocated/i.test(e.t);});},
  fail:function(p){return "Buyer allocation missing for the "+CX.CROPS[p.rec.crop].n+" programme.";}},
 {k:"policy",n:"Policy rules passed",w:9,
  test:function(p,a){return !a.ex.some(function(e){return e.sev==="blocking"||e.sev==="review";});},
  fail:function(p,a){var n=a.ex.filter(function(e){return e.sev==="blocking"||e.sev==="review";}).length;
   return n+" policy exception"+(n>1?"s":"")+" open.";}},
 {k:"consent",n:"Consents signed",w:4,
  test:function(p){return (p.docs.filter(function(x){return x.k==="consent";})[0]||{}).state==="verified";},
  fail:"One or more consents unsigned."},
 {k:"xdoc",n:"Cross-document consistency",w:2,
  test:function(p,a){return !a.ex.some(function(e){return /needs a look|could not be read/i.test(e.t);});},
  fail:function(p,a){var n=a.ex.filter(function(e){return /needs a look|could not be read/i.test(e.t);}).length;
   return n+" document"+(n>1?"s":"")+(n>1?" require":" requires")+" manual verification.";}}
];
function readiness(pkg,a){
 var got=0,reasons=[],passed=[];
 COMPONENTS.forEach(function(c){
  var ok=false;try{ok=c.test(pkg,a);}catch(e){}
  if(ok){got+=c.w;passed.push(c.n);}
  else reasons.push({k:c.k,n:c.n,w:c.w,
   why:typeof c.fail==="function"?c.fail(pkg,a):c.fail});
 });
 var score=Math.round(got);
 var band=score>=95?"Ready for approval":score>=80?"Minor items outstanding":
  score>=60?"Needs work before submission":"Not ready";
 var conf=a.confidence>=0.9&&score>=90?"High":a.confidence>=0.8&&score>=70?"Medium":"Low";
 var mins=Math.max(2,Math.round(2+reasons.reduce(function(t,r){return t+r.w*0.55;},0)));
 var stmt;
 if(score>=95){
  stmt="Ready for approval. No policy exceptions detected. All required documents verified. "+
   "Repayment coverage estimated at "+a.cover.toFixed(1)+"× based on the approved farm plan.";
 } else {
  stmt="Not yet ready for a decision. "+reasons.length+" item"+(reasons.length>1?"s":"")+
   " account for the "+(100-score)+" point"+((100-score)>1?"s":"")+" deducted.";
 }
 return {score:score,band:band,confidence:conf,estMinutes:mins,
  reasons:reasons,passed:passed,statement:stmt,
  colour:score>=95?"ok":score>=80?"info":score>=60?"warn":"bad"};
}

/* ---------- 2. Submission readiness gate -------------------------- */
var GATE=[
 {k:"identity",n:"Identity verified",mandatory:true},
 {k:"farm",n:"Farm verified and polygon captured",mandatory:true},
 {k:"docs",n:"Required documents complete",mandatory:true},
 {k:"plan",n:"Farm plan generated",mandatory:true},
 {k:"budget",n:"Budget verified",mandatory:true},
 {k:"income",n:"Income projection complete",mandatory:true},
 {k:"policy",n:"Policy rules passed",mandatory:true},
 {k:"consent",n:"Required consents signed",mandatory:true},
 {k:"esign",n:"Mandatory e-signatures completed",mandatory:true},
 {k:"wet",n:"Wet-signature requirements identified",mandatory:false},
 {k:"xdoc",n:"Cross-document consistency verified",mandatory:true},
 {k:"threshold",n:"Completeness above the configured threshold",mandatory:true},
 {k:"fraud",n:"Fraud checks completed",mandatory:true},
 {k:"dupe",n:"Duplicate application check completed",mandatory:true}
];
var GATE_THRESHOLD=95;
function gate(pkg,a,r){
 r=r||readiness(pkg,a);
 var res=GATE.map(function(g){
  var ok=true,why="";
  switch(g.k){
   case "identity": ok=r.passed.indexOf("Identity verified")>=0; break;
   case "farm": ok=r.passed.indexOf("Farm polygon verified")>=0; break;
   case "docs": ok=r.passed.indexOf("Required documents complete")>=0; break;
   case "plan": ok=r.passed.indexOf("Farm plan generated")>=0; break;
   case "budget": ok=r.passed.indexOf("Budget validated")>=0; break;
   case "income": ok=r.passed.indexOf("Income projection complete")>=0; break;
   case "policy": ok=r.passed.indexOf("Policy rules passed")>=0; break;
   case "consent": ok=r.passed.indexOf("Consents signed")>=0; break;
   case "esign": ok=(pkg.docs.filter(function(d){return CXLO.signable(d.k);})
     .every(function(d){return d.state==="verified";})); break;
   case "wet": ok=true; break;
   case "xdoc": ok=r.passed.indexOf("Cross-document consistency")>=0; break;
   case "threshold": ok=pkg.completeness>=GATE_THRESHOLD;
    why=ok?"":"Completeness "+pkg.completeness+"% against a "+GATE_THRESHOLD+"% threshold."; break;
   case "fraud": ok=!a.ex.some(function(e){return /duplicate parcel/i.test(e.t);}); break;
   case "dupe": ok=!a.ex.some(function(e){return /duplicate/i.test(e.t);}); break;
  }
  if(!ok&&!why){
   var rr=r.reasons.filter(function(z){return z.k===g.k;})[0];
   why=rr?rr.why:"Outstanding.";
  }
  return {k:g.k,n:g.n,mandatory:g.mandatory,ok:ok,why:why};
 });
 var blocked=res.filter(function(x){return x.mandatory&&!x.ok;});
 return {items:res,pass:blocked.length===0,blocked:blocked,threshold:GATE_THRESHOLD,
  msg:blocked.length===0
   ? "Gate passed. This application may be submitted to LANDBANK."
   : "Submission blocked. "+blocked.length+" mandatory requirement"+(blocked.length>1?"s are":" is")+" unresolved."};
}

/* ---------- 3. Versioned credit package --------------------------- */
function pkgStore(){try{return JSON.parse(localStorage.getItem(PKEY)||"{}");}catch(e){return {};}}
function pkgSave(s){try{localStorage.setItem(PKEY,JSON.stringify(s));}catch(e){}}
function dataHash(x){
 var s=[x.f.id,x.f.amt,x.f.ha,x.f.crop,x.f.buyerId,x.pkg.completeness,
   x.pkg.docs.map(function(d){return d.k+d.state;}).join("")].join("|");
 var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
 return (h>>>0).toString(16);
}
var SECTIONS=["Executive summary","Borrower profile","Farm profile","Digital twin snapshot",
 "Farm plan","Production budget","Projected cash flow","Repayment analysis","Risk analysis",
 "Policy compliance","Supporting documents","Maps","Photographs","AI recommendations",
 "Officer checklist","Approval memo draft","Endorsement draft","Routing slip","Document manifest"];
function generate(x,reason){
 var s=pkgStore(),id=x.f.id;
 var hist=s[id]||[];
 var hash=dataHash(x);
 if(hist.length&&hist[hist.length-1].hash===hash)return hist[hist.length-1];
 var r=readiness(x.pkg,x.a);
 var v={version:"v"+(hist.length+1),at:new Date().toISOString(),hash:hash,
  reason:reason||(hist.length?"Underlying data changed":"First generation"),
  aiVersion:(typeof CXNPL!=="undefined"&&CXNPL.MODEL?CXNPL.MODEL.version:"—"),
  dataVersion:"book@"+hash,
  readiness:r.score,completeness:x.pkg.completeness,cover:+x.a.cover.toFixed(2),
  recommendation:x.a.recommendation,exceptions:x.a.ex.length,
  sections:SECTIONS.length,
  summary:r.statement,
  manifest:x.pkg.docs.map(function(d,i){return {seq:i+1,doc:d.n,state:d.state,
   sig:CXLO.signable(d.k)?"e-sign":"wet"};})};
 hist.push(v);s[id]=hist;pkgSave(s);
 emitLC("LoanPackage.Generated",id,{version:v.version,readiness:r.score,reason:v.reason});
 return v;
}
function history(id){return (pkgStore()[id]||[]);}

/* ---------- 4. Lifecycle events ----------------------------------- */
var LIFECYCLE=[
 {e:"LoanApplication.Created",who:"Farmer app",d:"Farmer starts the application."},
 {e:"Identity.Verified",who:"Farmer app · AI",d:"ID captured, extracted and confirmed by the farmer."},
 {e:"FarmPolygon.Verified",who:"FRO app · GPS",d:"Boundary walked or verified in the field."},
 {e:"FarmPlan.Generated",who:"Kita · AI",d:"Crop protocol, area and location produce the plan."},
 {e:"Budget.Validated",who:"Kita",d:"Production budget checked against regional norms."},
 {e:"LoanReadiness.Passed",who:"Kita · gate",d:"Every mandatory gate component resolved."},
 {e:"CompanyX.Endorsed",who:"Kita operations",d:"Quality assurance complete; package endorsed."},
 {e:"LoanPackage.Generated",who:"AI",d:"Versioned credit package produced."},
 {e:"LoanPackage.SubmittedToLandBank",who:"Kita",d:"Package transmitted. This is the only submission event."},
 {e:"LendingOfficer.Assigned",who:"LANDBANK",d:"Routed to a named officer in the lending centre."},
 {e:"Clarification.Requested",who:"LANDBANK",d:"Appears instantly in the farmer, FRO and Kita apps."},
 {e:"Clarification.Resolved",who:"Farmer · AI · Kita",d:"Uploaded, validated, reviewed, closed."},
 {e:"Loan.Approved",who:"LANDBANK",d:"Decision recorded with attestation and signature."},
 {e:"Loan.Released",who:"LANDBANK",d:"Disbursement instructed."}
];
function emitLC(type,subject,payload,actor){
 try{ return CXOS.emit(type,subject,payload||{},actor||"system"); }catch(e){ return null; }
}
function lifecycleOf(id){
 var seen={};
 try{ CXOS.bySubject(id).forEach(function(e){ if(!seen[e.type])seen[e.type]=e; }); }catch(e){}
 return LIFECYCLE.map(function(l){return {e:l.e,who:l.who,d:l.d,at:seen[l.e]?seen[l.e].ts:null,done:!!seen[l.e]};});
}
function runSubmission(x){
 /* the full event-driven submission, emitted in order */
 var id=x.f.id,out=[];
 var r=readiness(x.pkg,x.a), g=gate(x.pkg,x.a,r);
 out.push(emitLC("LoanApplication.Created",id,{crop:x.f.crop,amt:x.f.amt},"farmer"));
 if(r.passed.indexOf("Identity verified")>=0)out.push(emitLC("Identity.Verified",id,{},"ai"));
 if(r.passed.indexOf("Farm polygon verified")>=0)out.push(emitLC("FarmPolygon.Verified",id,{},"fro"));
 if(r.passed.indexOf("Farm plan generated")>=0)out.push(emitLC("FarmPlan.Generated",id,{},"ai"));
 if(r.passed.indexOf("Budget validated")>=0)out.push(emitLC("Budget.Validated",id,{},"ops"));
 if(!g.pass)return {ok:false,gate:g,readiness:r,events:out.filter(Boolean),
  msg:"Submission blocked at the gate. "+g.blocked.length+" mandatory item(s) unresolved."};
 out.push(emitLC("LoanReadiness.Passed",id,{score:r.score},"ops"));
 out.push(emitLC("CompanyX.Endorsed",id,{},"ops"));
 var v=generate(x,"Submission");
 out.push(emitLC("LoanPackage.SubmittedToLandBank",id,{version:v.version,readiness:r.score},"ops"));
 out.push(emitLC("LendingOfficer.Assigned",id,{officer:"LO1",centre:x.f.lc},"landbank"));
 return {ok:true,gate:g,readiness:r,pkgVersion:v,events:out.filter(Boolean),
  msg:"Submitted. Readiness "+r.score+"/100, package "+v.version+"."};
}
/* Kita may submit a file that fails the gate, but only by naming it
   an exception and giving a written justification. The officer then sees
   both the low readiness score and who chose to send it anyway. */
function exceptionSubmit(x){
 var r=readiness(x.pkg,x.a), g=gate(x.pkg,x.a,r);
 if(g.pass)return null;
 var seed=0,id=x.f.id;
 for(var i=0;i<id.length;i++)seed=(seed*31+id.charCodeAt(i))>>>0;
 if((seed%100)>=45)return null;           /* Kita sends about 45% of them */
 var why=[
  "Borrower is a repeat client with a clean repayment record; the outstanding item is documentary only.",
  "Harvest window closes in three weeks. Submitting now to preserve the planting date; the missing item follows within five days.",
  "Field officer has verified the item physically and will upload the document on return to the office.",
  "Cooperative has vouched for the outstanding requirement in writing."
 ][seed%4];
 return {flagged:true,by:"Kita operations",at:new Date().toISOString(),
  unresolved:g.blocked.map(function(b){return b.n;}),justification:why};
}
function requestClarification(id,what){
 return emitLC("Clarification.Requested",id,{item:what},"lbp_credit");
}
function resolveClarification(id,what){
 return emitLC("Clarification.Resolved",id,{item:what},"farmer");
}
return {COMPONENTS:COMPONENTS,readiness:readiness,GATE:GATE,GATE_THRESHOLD:GATE_THRESHOLD,gate:gate,
 SECTIONS:SECTIONS,generate:generate,history:history,dataHash:dataHash,
 LIFECYCLE:LIFECYCLE,emitLC:emitLC,exceptionSubmit:exceptionSubmit,lifecycleOf:lifecycleOf,runSubmission:runSubmission,
 requestClarification:requestClarification,resolveClarification:resolveClarification};
})();
</script>
<script>/* ==================================================================
   CXSIG - Digital Approval & Signature Centre
   ------------------------------------------------------------------
   Three ideas carry this module.

   1. Signature type is a RULE OUTPUT, never a field. Nobody is ever
      asked "is this wet or electronic?" - the engine answers it from
      the form's legal attributes and the institution's policy row.
      Change the policy, every application re-evaluates. No code edit.

   2. An approval is attached to a DOCUMENT VERSION, not a document.
      Change the underlying data and prior approvals stay bound to the
      version they approved. The chain re-opens from the earliest
      affected stage.

   3. The package has a HOLDER at every moment. Most loan delay is not
      decision time - it is custody time nobody is measuring.
   ================================================================== */
(function(){
function rnd(s){var h=2166136261;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return ((h>>>0)%1e6)/1e6;}

function fmt(d){if(!d)return "-";try{return new Date(d).toLocaleString("en-PH",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});}catch(e){return String(d).slice(0,16);}}
function fmtD(d){if(!d)return "-";try{return new Date(d).toLocaleDateString("en-PH",{month:"short",day:"numeric",year:"numeric"});}catch(e){return String(d).slice(0,10);}}

/* ---------- 1. FORM LIBRARY -------------------------------------- */

 {k:"disclose",n:"Disclosure Statement on Loan Transaction",inst:"LANDBANK",ver:"RA3765-2022",eff:"2022-01-01",lang:"English",
  pages:2,parties:1,notarised:false,registrable:false,policy:"wet",

    ver:dv.ver,pages:f.pages,inst:f.inst});
  });
 });
 var wetPending=board.filter(function(b){return b.type==="wet"&&b.status==="pending";});
 var ePending=board.filter(function(b){return b.type==="esign"&&b.status==="pending";});
 var signedN=board.filter(function(b){return b.status==="signed";}).length;
 return {fid:fid,f:x.f,stages:stages,stageIdx:stageIdx,holder:holder,reopened:reopened,
  board:board,forms:need,submitted:submitted,signedN:signedN,total:board.length,
  wetPending:wetPending,ePending:ePending,
  pct:Math.round(signedN/Math.max(1,board.length)*100),daysOpen:age};
}

/* ---------- 6. ELECTRONIC SIGNING FLOW --------------------------- */
var ESIGN_FLOW=[
 {k:"review",n:"Review the final immutable document",d:"The rendered document is frozen. Nothing on the page can change between review and signature."},
 {k:"summary",n:"Display signing summary",d:"What is being signed, on whose behalf, in which role, against which document version."},
 {k:"confirm",n:"User confirms",d:"An explicit act, distinct from opening the document."},
 {k:"auth",n:"Authenticate - MFA / OTP / enterprise SSO",d:"Method is recorded in the evidence record. LANDBANK users authenticate against the bank directory."},
 {k:"apply",n:"Apply electronic signature",d:"Signature block rendered into the document with signer, role, timestamp and version."},
 {k:"gen",n:"Generate signed version",d:"A new immutable artefact. The unsigned version is retained."},
 {k:"lock",n:"Lock document version",d:"No further edit is possible. A change creates a new version and re-opens approval."},
 {k:"audit",n:"Update audit trail",d:"Evidence record written and the document becomes visible to every authorised user at once."}
];

/* ---------- 7. WET SIGNATURE PACKAGE ----------------------------- */
function wetPackage(c){
 var wet=c.forms.filter(function(k){return sigType(k).type==="wet";});
 var front=[{n:"Cover Sheet",p:1},{n:"Routing Slip",p:1},{n:"Document Manifest",p:1},
  {n:"Signature Routing Checklist",p:1},{n:"Table of Contents",p:1},{n:"Application Summary",p:2},
  {n:"Farmer Profile",p:1},{n:"Farm Plan",p:6},{n:"Production Budget",p:3},
  {n:"Income Projection",p:3},{n:"Farm Maps and Polygon",p:2},
  {n:"Approval Sheets",p:Math.max(1,c.stages.filter(function(s){return s.status==="done";}).length)}];
 var p=1,items=[];
 front.forEach(function(f){items.push({n:f.n,inst:"Kita",pages:f.p,from:p,to:p+f.p-1,sig:"-",sep:false});p+=f.p;});
 wet.forEach(function(k){var f=form(k);
  items.push({n:f.n,inst:f.inst,pages:f.pages,from:p,to:p+f.pages-1,
   sig:f.sigs.map(function(s){return s.n;}).join(", "),sep:true,ver:f.ver,rule:sigType(k).rule});
  p+=f.pages;});
 [{n:"Supporting Documents - identity, tenure, buyer",p:9},{n:"Photographs",p:2}].forEach(function(f){
  items.push({n:f.n,inst:"-",pages:f.p,from:p,to:p+f.p-1,sig:"-",sep:true});p+=f.p;});
 return {id:"PKG-"+c.fid+"-W2026",qr:"cx://pack/"+c.fid+"/wet",
  barcode:"*CX"+String(c.fid).replace(/\D/g,"")+"W*",generated:iso(new Date()),
  version:"v"+(1+(rnd(c.fid+"pk")<0.3?1:0)),items:items,totalPages:p-1,
  wetForms:wet.length,bookmarks:items.length,separators:items.filter(function(i){return i.sep;}).length};
}

/* ---------- 8. SCANNED RETURN - AI INTAKE ------------------------ */
function scanIntake(c){
 return c.forms.filter(function(k){return sigType(k).type==="wet";}).map(function(k){
  var f=form(k),r=rnd(c.fid+k+"scan"),conf=0.72+rnd(c.fid+k+"c")*0.27;
  var missing=r<0.12?[f.pages]:[];
  var st=missing.length?"exception":(conf<0.85?"review":"accepted");
  return {doc:f.n,key:k,pages:f.pages,detected:f.n,matched:c.fid,confidence:+conf.toFixed(2),
   pageOrder:r<0.09?"out of order - reordered automatically":"correct",missingPages:missing,
   signatures:missing.length?Math.max(0,f.sigs.length-1):f.sigs.length,expected:f.sigs.length,
   initials:r<0.2?("one initial box unmarked on page "+Math.max(1,f.pages-1)):"complete",
   ocr:"searchable PDF created",status:st,
   scanDate:iso(ago(Math.round(rnd(c.fid+k)*6)+1)),uploadedBy:person("fro",c.fid),
   verifiedBy:st==="accepted"?"AI - auto-accepted above threshold":"Pending human confirmation"};
 });
}

/* ---------- 9. EVIDENCE OF SIGNATURE ----------------------------- */
function evidence(c){
 var out=[];
 c.stages.filter(function(s){return s.sig;}).forEach(function(s){
  out.push({signer:s.sig.signer,role:s.sig.role,type:"Electronic",auth:s.sig.method,at:s.sig.at,
   docVersion:s.sig.docVersion,appVersion:s.sig.appVersion,device:s.sig.device,notes:s.sig.notes,
   hash:s.sig.hash,audit:"AUD-"+c.fid+"-"+s.k.toUpperCase(),wet:null});
 });
 scanIntake(c).filter(function(s){return s.status!=="exception";}).slice(0,2).forEach(function(s){
  out.push({signer:"Multiple parties",role:s.doc,type:"Wet",
   auth:"Notarised original, scanned and matched",at:s.scanDate,docVersion:"v1",appVersion:"A1",
   device:"Canon DR-C240 - barangay office",notes:"",
   hash:"sha256:"+Math.abs(Math.round(rnd(c.fid+s.key)*1e15)).toString(16).slice(0,16),
   audit:"AUD-"+c.fid+"-WET",
   wet:{scanDate:s.scanDate,uploadedBy:s.uploadedBy,verifiedBy:s.verifiedBy,original:"stored",
    ocr:s.ocr,confidence:s.confidence,completeness:s.missingPages.length?"incomplete":"complete"}});
 });
 return out;
}

/* ---------- 10. WHERE TIME IS ACTUALLY GOING --------------------- */
function stall(c){
 if(c.stageIdx>=5){
  var d=Math.max(1,Math.round((new Date("2026-08-10T09:00:00+08:00")-new Date(c.holder.since))/864e5));
  return {where:"Wet-signature circulation",days:d,
   why:"Approved. Waiting on paper to come back from "+c.wetPending.length+" outstanding signator"+(c.wetPending.length===1?"y":"ies")+"."};
 }
 var a=c.stages[c.stageIdx];
 if(!a)return {where:"-",days:0,why:""};
 return {where:a.n,days:Math.round((a.heldHours||0)/24*10)/10,
  why:"Held "+(a.heldHours||0)+" hours against a "+(a.sla*24)+"-hour service level."};
}

window.CXSIG={FORMS:FORMS,form:form,SIGRULES:SIGRULES,sigType:sigType,CHAIN:CHAIN,ACTIONS:ACTIONS,
 ESIGN_FLOW:ESIGN_FLOW,centre:centre,wetPackage:wetPackage,scanIntake:scanIntake,evidence:evidence,
 stall:stall,requiredForms:requiredForms,fmt:fmt,fmtD:fmtD};
})();
</script>
<script>/* ==================================================================

(function(){
var S=function(){return window.CXSIG;};

 h+='<div class="tl-rail">';
 c.stages.forEach(function(s,i){

  h+='<div class="tl-node '+cls+'">'+
   '<div class="tl-dot">'+(s.status==="done"?"&#10003;":s.status==="active"?"&bull;":"")+'</div>'+
   '<div class="tl-org '+(s.org==="LANDBANK"?"lb":"cx")+'">'+e(s.org)+'</div>'+

     : s.status==="active"
       ? '<div class="tl-live">HAS IT NOW &middot; '+s.heldHours+'h<div class="tl-v">SLA '+(s.sla*24)+'h</div></div>'

 });
 h+='<div class="tl-link '+(c.stageIdx>=5?"on":"")+'"></div>';
 h+='<div class="tl-node wet '+(c.stageIdx>=5?"active":"wait")+'">'+
   '<div class="tl-dot">'+(c.stageIdx>=5?"&bull;":"")+'</div>'+

                 :'<div class="tl-wait">not yet printed</div>')+
   '</div>';
 h+='</div>';

 h+='<div class="tl-foot">'+
  '<div class="tl-m"><div class="l">Signatures complete</div><div class="v">'+c.signedN+' of '+c.total+'</div>'+
  '<div class="tl-bar"><i style="width:'+c.pct+'%"></i></div></div>'+
  '<div class="tl-m"><div class="l">Electronic outstanding</div><div class="v">'+c.ePending.length+'</div></div>'+
  '<div class="tl-m"><div class="l">Wet outstanding</div><div class="v'+(c.wetPending.length?" bad":"")+'">'+c.wetPending.length+'</div></div>'+
  '<div class="tl-m wide"><div class="l">Where the time is going</div>'+
  '<div class="v sm">'+e(st.where)+' &middot; '+st.days+'d</div><div class="d">'+e(st.why)+'</div></div>'+
 '</div>';

 if(c.reopened){
  h+='<div class="tl-re"><b>Version control re-opened this chain.</b> '+e(c.reopened.what)+
   ' '+e(c.reopened.effect)+' <span class="tl-v">Prior signature retained: '+e(c.reopened.prior.signer)+
   ' on '+e(c.reopened.prior.ver)+', '+e(S().fmtD(c.reopened.prior.at))+'.</span></div>';
 }
 h+='</div>';
 return h;
}

/* ---------- ACTION PANEL ----------------------------------------- */
function panel(c,stageKey,onAct){
 var s=null;c.stages.forEach(function(x){if(x.k===stageKey)s=x;});
 if(!s)return "";
 var acts=S().ACTIONS[stageKey]||[];
 var live=s.status==="active";
 var h='<div class="card sigpanel'+(live?" live":"")+'">'+
  '<div class="sp-hd"><div><b>'+e(s.n)+'</b><div class="sub">'+e(s.does)+'</div></div>'+

 h+='<div class="sp-acts">'+acts.map(function(a,i){

   return '<button class="ab '+kind+'" onclick="sigAct(\''+stageKey+'\',\''+e(a).replace(/'/g,"")+'\')"'+(live?"":" disabled")+'>'+e(a)+'</button>';
  }).join("")+'</div>';
 if(s.status==="done"&&s.sig){

   '<div class="sub">Document '+e(s.doc.n)+' '+e(s.sig.docVersion)+' &middot; application '+e(s.sig.appVersion)+

 }

/* ---------- SIGNATURE STATUS BOARD ------------------------------- */
function board(c){
 var rows=c.board.slice().sort(function(a,b){

 return '<div class="card"><table class="sigboard">'+

   return '<tr class="'+(r.status==="pending"?"pend":"")+'">'+

}

function wetpack(c){

 var h='<div class="card"><div class="pk-hd">'+

 h+='<table class="pk"><tr><th class="right">Pages</th><th>Document</th><th>Source</th><th>Wet signatories</th></tr>'+

    '<td>'+(i.sep?'<span class="sep">&#9642;</span> ':'')+e(i.n)+(i.ver?' <span class="sub">'+e(i.ver)+'</span>':'')+'</td>'+
    '<td class="sub">'+e(i.inst)+'</td><td class="sub">'+e(i.sig)+'</td></tr>';
  }).join("")+'</table></div>';
 return h;
}

/* ---------- SCAN INTAKE ------------------------------------------ */
function scans(c){
 var sc=S().scanIntake(c);
 return '<div class="card"><table>'+
  '<tr><th>Returned document</th><th>AI detection</th><th>Pages</th><th>Signatures</th><th>Initials</th><th class="right">Confidence</th><th>Status</th></tr>'+

  }).join("")+'</table>'+

}

function evid(c){
 return '<div class="card"><table>'+
  '<tr><th>Signer</th><th>Role</th><th>Type</th><th>Authentication</th><th>When</th><th>Versions</th><th>Integrity</th></tr>'+

  }).join("")+'</table></div>';

/* ---------- E-SIGN MODAL ----------------------------------------- */
function esignModal(c,stageKey,step){
 var s=null;c.stages.forEach(function(x){if(x.k===stageKey)s=x;});
 if(!s)return "";
 var F=S().ESIGN_FLOW,f=S().form(s.produces);
 step=Math.max(0,Math.min(F.length-1,step||0));
 var h='<div class="mdl"><div class="mdl-box">'+
  '<div class="mdl-hd"><b>Electronic signature</b>'+

 h+='<div class="mdl-steps">'+F.map(function(x,i){
  return '<div class="ms '+(i<step?"done":i===step?"now":"")+'"><i>'+(i<step?"&#10003;":i+1)+'</i>'+e(x.n)+'</div>';
 }).join("")+'</div>';
 h+='<div class="mdl-body"><div class="mdl-cur"><b>'+e(F[step].n)+'</b><p>'+e(F[step].d)+'</p></div>';

   '<tr><td>Signing as</td><td><b>'+e(s.actor)+'</b> &middot; '+e(s.n)+'</td></tr>'+
   '<tr><td>On behalf of</td><td>'+e(s.org)+'</td></tr>'+
   '<tr><td>Application</td><td>'+e(c.f.name)+' &middot; '+e(c.fid)+'</td></tr>'+
   '<tr><td>Signature type</td><td>'+e(S().sigType(s.produces).type==="wet"?"Wet required":"Electronic permitted")+
     ' <span class="sub">('+e(S().sigType(s.produces).rule)+')</span></td></tr>'+
   '</table></div>';
 }
 if(step===3){
  h+='<div class="mdl-otp"><div class="sub">A one-time passcode was sent to the registered mobile ending 4417.</div>'+
   '<div class="otp">'+[0,1,2,3,4,5].map(function(i){return '<i>'+(i<4?"&bull;":"")+'</i>';}).join("")+'</div>'+
   '<div class="sub">Method and device are written into the evidence record.</div></div>';
 }
 if(step===F.length-1){
  h+='<div class="mdl-done"><b>&#10003; Signed and locked.</b><div class="sub">'+
   'Version '+e(s.doc?s.doc.ver:"v1")+' is now immutable. The signed document is visible to every authorised user immediately. '+
   'Any change to the underlying data creates a new version and re-opens this approval.</div></div>';
 }
 h+='</div><div class="mdl-ft">'+
  (step>0?'<button class="ab ghost" onclick="esStep('+(step-1)+')">Back</button>':'<span></span>')+
  (step<F.length-1
    ? '<button class="ab primary" onclick="esStep('+(step+1)+')">'+(step===2?"Confirm and sign":step===3?"Verify":"Continue")+'</button>'
    : '<button class="ab primary" onclick="esClose()">Done</button>')+
  '</div></div></div>';
 return h;
}

/* ---------- FORM LIBRARY ----------------------------------------- */
function library(){
 var F=S().FORMS;
 var h='<div class="card"><table>'+
  '<tr><th>Form</th><th>Institution</th><th>Version</th><th>Effective</th><th>Language</th><th class="right">Pages</th><th>Signatories</th><th>Signature type</th></tr>'+
  F.map(function(f){
   var t=S().sigType(f.k);
   return '<tr><td><b>'+e(f.n)+'</b><div class="sub">'+e(f.autofill)+'</div>'+
    '<div class="sub mut">Validation: '+e(f.validate)+'</div></td>'+
    '<td class="sub">'+e(f.inst)+'</td><td class="mono sub">'+e(f.ver)+'</td>'+
    '<td class="sub">'+e(S().fmtD(f.eff))+'</td><td class="sub">'+e(f.lang)+'</td>'+
    '<td class="right">'+f.pages+'</td>'+
    '<td class="sub">'+f.sigs.map(function(s){return e(s.n);}).join(", ")+'</td>'+
    '<td>'+(t.type==="wet"?'<span class="chip c-warn">Wet</span>':'<span class="chip c-info">Electronic</span>')+
    '<div class="sub">'+e(t.rule)+' &middot; '+e(t.ruleName)+'</div></td></tr>';
  }).join("")+'</table></div>';
 return h;
}
function rules(){
 var R=S().SIGRULES,F=S().FORMS;
 var legal={"SR-0":1,"SR-1":1,"SR-2":1};
 var h='<div class="card"><table>'+
  '<tr><th>Rule</th><th>Condition</th><th>Result</th><th>Authority</th><th>Legal basis</th><th>Why</th><th class="right">Forms</th></tr>'+
  R.map(function(r){
   var n=F.filter(function(f){return S().sigType(f.k).rule===r.id;}).length;
   var shadow=(n===0&&!legal[r.id]);
   return '<tr'+(shadow?' class="pend"':'')+'><td class="mono">'+e(r.id)+'</td><td><b>'+e(r.n)+'</b></td>'+
    '<td>'+(r.type==="wet"?'<span class="chip c-warn">Wet signature</span>':'<span class="chip c-info">Electronic</span>')+'</td>'+
    '<td>'+(legal[r.id]?'<span class="chip c-bad">Statutory</span>':'<span class="chip c-mut">Policy</span>')+'</td>'+
    '<td class="sub mono" style="font-size:10px">'+e(r.law||"—")+'</td>'+
    '<td class="sub">'+e(r.why)+(shadow?' <b>Currently shadowed</b> \u2014 every form it would match is already caught by a statutory rule above it.':'')+'</td>'+
    '<td class="right"><b>'+n+'</b></td></tr>';
  }).join("")+'</table>'+
  '<div class="sub" style="margin-top:8px"><b>What an administrator can and cannot change.</b> '+
  'SR-3 and SR-4 may match nothing, and that is the correct behaviour rather than dead configuration. '+
  'SR-0, SR-1 and SR-2 are statutory: a registrable instrument and a notarised document cannot be made electronically '+
  'executable by policy, so any policy rule pointing the other way is shadowed. An administrator can always make a '+
  'document <i>stricter</i> \u2014 marking an ordinary form wet \u2014 and that takes effect immediately. What no '+
  'administrator can do from this table is make the Real Estate Mortgage electronic, and a system that let them '+
  'would be a compliance defect, not a feature.</div></div>';
 return h;
}
window.CXSIGUI={timeline:timeline,panel:panel,board:board,wetpack:wetpack,scans:scans,
 evid:evid,esignModal:esignModal,library:library,rules:rules};
})();

<script>/* ==================================================================
   CXDEM - buyer demand engine.
   "Tell Kita what you need. We organise the financed agricultural
   supply to produce it."  That sentence is only credible if the
   platform can actually back-solve it, show its assumptions, and admit
   what it cannot promise. This module does all three.
   ================================================================== */
(function(){
function rnd(s){var h=2166136261;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return ((h>>>0)%1e6)/1e6;}
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ---------- assumptions, stated not buried ---------------------- */
var ASSUME={
 ube:{
  conv:{v:6.2,u:"kg fresh per kg powder",lab:"Fresh-to-powder conversion",
   src:"Toll processor trial runs, 2025-26 season, three lots.",band:[5.6,7.1],

   src:"Tuber size and blemish rejection at intake.",band:[0.86,0.95],
