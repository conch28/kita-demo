<style>/* Kita design system — institutional, dense, neutral.
   Reference points: Stripe, Linear, Mercury. Not a government portal. */
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
:root{
 --bg:#ffffff; --canvas:#fafafa; --ink:#0a0a0a; --ink2:#404040; --mut:#737373;

 --r:8px; --sh:0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.06);
}
body{margin:0;background:var(--canvas);color:var(--ink);

/* ---- top bar ---- */
#top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;
 background:var(--bg);border-bottom:1px solid var(--line);padding:0 18px;height:52px}

 display:grid;place-items:center;font-size:11px;font-weight:700}
.brand em{font-style:normal;color:var(--mut);font-weight:450}
#nav{display:flex;gap:1px;margin-left:8px;flex-wrap:wrap}
#nav button{background:none;border:0;padding:6px 11px;border-radius:6px;cursor:pointer;
 font:inherit;font-size:13px;color:var(--mut);white-space:nowrap}
#nav button:hover{background:var(--line2);color:var(--ink)}
#nav button.on{background:var(--ink);color:#fff}
.sp{flex:1}
.util{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--mut)}
.util button{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;
 cursor:pointer;font:inherit;font-size:12px;color:var(--ink2)}
.util button:hover{border-color:var(--mut)}
/* ---- layout ---- */
#main{max-width:1360px;margin:0 auto;padding:20px 18px 64px}
.view{display:none}.view.on{display:block}
h1.pg{font-size:19px;font-weight:640;letter-spacing:-.3px;margin:0 0 3px}
p.lede{color:var(--mut);margin:0 0 18px;max-width:76ch;font-size:13px}
h2.sec{font-size:11px;font-weight:640;letter-spacing:.55px;text-transform:uppercase;
 color:var(--mut);margin:26px 0 9px}
h3{font-size:13.5px;font-weight:620;margin:0 0 7px;letter-spacing:-.1px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
 padding:14px 15px;box-shadow:var(--sh)}
.card+.card{margin-top:10px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:1080px){.g4,.g5,.g6{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
/* ---- metric ---- */
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.kpi .l{font-size:11px;color:var(--mut);letter-spacing:.2px;margin-bottom:5px}
.kpi .v{font-size:21px;font-weight:640;letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1.15}

/* ---- table ---- */
table{width:100%;border-collapse:collapse;font-size:13px}

 color:var(--mut);padding:0 10px 7px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}

tbody tr.click:hover{background:var(--canvas);cursor:pointer}

.chip{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:560;
 line-height:1.5;white-space:nowrap}
.c-ok{background:var(--ok-w);color:var(--ok)} .c-warn{background:var(--warn-w);color:var(--warn)}
.c-bad{background:var(--bad-w);color:var(--bad)} .c-info{background:var(--info-w);color:var(--info)}

.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}

.spark i.on{background:var(--accent)}

.btn.sec:hover{border-color:var(--mut);opacity:1}

function cascade(dm){

function normalise(bk){

/* ---------- 7. Risk ---------------------------------------------- */
function riskScore(f,bk){

 var c=CROPS[f.crop],pts=[],s=0;
 var g=gates(f,bk),bad=g.filter(function(x){return !x.ok;});
 if(bad.length){s+=22*bad.length;pts.push({l:"Gate not clear",d:bad.map(function(x){return x.t;}).join(", "),bad:true});}
 else pts.push({l:"All release gates clear",d:"Soil, concentration and buyer allocation verified.",bad:false});
 if(!f.buyerId){s+=18;pts.push({l:"No buyer allocated",d:"Output has no committed home.",bad:true});}
 if(!f.docsOk){s+=12;pts.push({l:"Documents incomplete",d:"Submission package has open items.",bad:true});}
 if(!f.gpsOk){s+=10;pts.push({l:"Farm polygon unverified",d:"No GPS boundary captured — duplicate-farm risk.",bad:true});}
 if(!f.pcic){s+=8;pts.push({l:"No PCIC cover",d:"Weather loss has no parametric offset.",bad:true});}
 else pts.push({l:"PCIC parametric enrolled",d:"Payout in 3–5 days after the storm exits.",bad:false});
 if(c.extHarvest){s-=10;pts.push({l:"Weekly settlement",d:"Repaid from 26 weekly deliveries, not one harvest.",bad:false});}
 else if(!c.perennial){s+=6;pts.push({l:"Single-harvest settlement",d:"One repayment moment.",bad:true});}
 var cover=projValue(f)/(f.amt||1);
 if(cover<1.35){s+=14;pts.push({l:"Thin repayment cover",d:"Projected crop value is "+cover.toFixed(2)+"× the loan.",bad:true});}
 else pts.push({l:"Repayment cover "+cover.toFixed(2)+"×",d:"Projected crop value against principal.",bad:false});
 s=Math.max(0,Math.min(100,s));
 return {score:s,band:s<20?"low":(s<45?"watch":"high"),factors:pts,cover:cover};
}

 var c=CROPS[f.crop];

function deliveries(){
 var out=[],bk=book();
 bk.forEach(function(f){
  if(f.status==="in-season"&&rnd(f.id+"d")>.5)return;
  var kit=inputKit(f), lines=[], ex=[];
  kit.forEach(function(L,i){
   var r=rnd(f.id+"L"+i), plan=L.sell, deliv=plan, conf=true, code=null;
   if(r<.016){deliv=Math.round(plan*.86);code="SHORT";}
   else if(r<.024){deliv=Math.round(plan*1.07);code="OVER";}
   else if(r<.036){deliv=Math.round(plan*1.05);code="PRICE";}
   else if(r<.044){conf=false;code="NOCONF";}
   else if(r<.050){code="NODOC";}
   lines.push({sku:L.sku,item:L.item,plan:plan,deliv:deliv,conf:conf,code:code});
   if(code)ex.push(code);
  });
  var plan=lines.reduce(function(a,l){return a+l.plan;},0);
  var billed=lines.reduce(function(a,l){return a+l.deliv;},0);
  var pay=lines.filter(function(l){return !l.code;}).reduce(function(a,l){return a+l.deliv;},0);
  var issue=lines.filter(function(l){return l.code;}).reduce(function(a,l){
   return a+((l.code==="NOCONF"||l.code==="NODOC")?l.deliv:Math.abs(l.deliv-l.plan));},0);
  var sub=addD(f.plant,-12), age=Math.round((NOW()-new Date(sub))/864e5);
  var clean=ex.length===0, paid=clean&&rnd(f.id+"p")<.70;
  var overdue=clean&&!paid&&age>10;
  out.push({id:"DR-"+f.id.slice(1),fid:f.id,name:f.name,crop:f.crop,muni:f.muni,lc:f.lc,fro:f.fro,
   lines:lines,plan:plan,billed:billed,payable:pay,atIssue:issue,submitted:sub,age:age,
   clean:clean,paid:paid,status:paid?"paid":(clean?(overdue?"overdue-bank":"ready"):"exception")});
 });

}

<script>/* ==================================================================

   DEFECT FOUND. Three layers held three different document lists.
   The form library carried 27 templates, the officer's checklist that
   actually gates submission carried 11, and the farmer app collected a
   third set. Eleven forms recovered in the archaeology pass never
   reached the checklist, and PCIC crop insurance and credit life
   insurance — both mandatory under the programme — existed as flags
   with no document behind them.

   One registry now drives all of it: what the farmer is asked for,
   what the officer checks, what the readiness gate blocks on, what
   appears on the signature board and what prints in the wet pack.

   Every requirement is CONDITIONAL. A requirement that applies to
   everyone is a special case of a rule, not the other way round.
   ================================================================== */
(function(){
/* condition helpers — ctx = {f (farmer record), amt, tenure, prov, water, crop, coop, hist, buyer, secured} */
var C={
 always:function(){return true;},
 owner:function(x){return x.tenure==="owner";},
 notOwner:function(x){return x.tenure!=="owner";},
 tenant:function(x){return x.tenure==="tenant";},
 lessee:function(x){return x.tenure==="lessee";},
 arb:function(x){return x.tenure==="arb";},
 irrigated:function(x){return x.water==="irrigated";},
 nuevaEcija:function(x){return x.prov==="Nueva Ecija";},
 secured:function(x){return x.amt>=250000;},
 comaker:function(x){return x.hist<2||x.amt>=150000;},
 coop:function(x){return !!x.coop;},
 buyerPaid:function(x){return !!x.buyer;},
 marketing:function(x){return !!x.buyer;},
 export_:function(x){return x.crop==="ubep"||x.crop==="ube"||x.crop==="citronella";},
 perennial:function(x){return x.crop==="coconut";}

/* stage: when it is required.  who: who produces it.  form: template key if one exists. */
var REQ=[
 /* ---------- identity and eligibility ---------- */

 /* ---------- the plan ---------- */

  cond:"always",form:"farmplan",note:"Generated by the crop protocol engine from the verified polygon."},
 {k:"income",n:"Income projection and repayment schedule",cat:"Plan",stage:"application",who:"platform",
  cond:"always",form:"income",note:"Priced at the collar floor, not at the spot price."},
 {k:"appform",n:"LANDBANK loan application form with photographs",cat:"Application",stage:"application",who:"platform",
  cond:"always",form:"appform",note:"Auto-filled. The farmer confirms; nothing is re-keyed."},
 {k:"photos",n:"Farmer and farm photographs",cat:"Application",stage:"application",who:"farmer",

  cond:"always",form:"pcic",note:"Mandatory under AGRISENSO Plus. The parametric weather layer behind every loan in the book."},

 /* ---------- programme conditions ---------- */

  cond:"always",form:"finlit",note:"A release precondition. Missing FINLIT is one of the most common causes of return."},

 /* ---------- export chain ---------- */

 {k:"treecensus",n:"Tree census and age profile",cat:"Land",stage:"application",who:"platform",

 "Cooperative","Marketing","Programme","Consents","Checklist","Release","Export"];
var STAGE={application:"Collected during application",submission:"Produced at submission",
 approval:"Executed on approval",release:"Signed at release",review:"Completed by the bank",
 delivery:"Produced at delivery"};

function ctxOf(f){
 return {f:f,amt:f.amt||0,tenure:f.tenure||"owner",prov:f.prov||"",water:f.water||"",
  crop:f.crop||"palay",coop:f.coop||null,hist:(f.yieldHist||[]).length,
  buyer:f.buyerId||null,secured:(f.amt||0)>=250000};
}
/* the requirement list for one farmer */
function required(f){
 var x=ctxOf(f);
 return REQ.filter(function(r){var fn=C[r.cond];return fn?fn(x):true;})
  .map(function(r){
   return {k:r.k,n:r.n,cat:r.cat,stage:r.stage,who:r.who,form:r.form,note:r.note,
    why:reason(r.cond,x)};
  });
}
function reason(cond,x){
 return {always:"Required of every applicant",
  owner:"Borrower holds the title",
  notOwner:"Borrower is not the titleholder",
  tenant:"Tenure is tenancy",lessee:"Tenure is lease",arb:"Agrarian reform beneficiary",
  irrigated:"Parcel is NIA-irrigated",
  nuevaEcija:"Province requires it",
  secured:"Facility is "+CX.pesoX(x.amt)+", at or above the secured threshold",
  comaker:(x.hist<2?"First or second cycle — no established repayment history":"Facility is "+CX.pesoX(x.amt)),
  coop:"Borrowing through a cooperative",
  buyerPaid:"Repayment is buyer-paid under the quadripartite structure",
  marketing:"A marketing partner is party to the loan",
  export_:"Output is destined for export",
  perennial:"Perennial standing asset"}[cond]||"Conditional";
}
function byCat(f){
 var R=required(f),g={};
 R.forEach(function(r){(g[r.cat]=g[r.cat]||[]).push(r);});
 return CAT.filter(function(c){return g[c];}).map(function(c){return {cat:c,items:g[c]};});
}
function byStage(f){
 var R=required(f),g={};
 R.forEach(function(r){(g[r.stage]=g[r.stage]||[]).push(r);});
 return Object.keys(STAGE).filter(function(s){return g[s];})
  .map(function(s){return {stage:s,n:STAGE[s],items:g[s]};});
}
/* coverage check — does every requirement resolve to something the platform can produce? */
function coverage(){
 var forms=(window.CXSIG&&CXSIG.FORMS)?CXSIG.FORMS.map(function(x){return x.k;}):[];
 return REQ.map(function(r){
  return {k:r.k,n:r.n,cat:r.cat,form:r.form,
   hasForm:!!r.form,formExists:r.form?forms.indexOf(r.form)>=0:null,
   ok:!r.form||forms.indexOf(r.form)>=0};
 });
}
window.CXDOC={REQ:REQ,CAT:CAT,STAGE:STAGE,C:C,required:required,byCat:byCat,byStage:byStage,
 coverage:coverage,ctxOf:ctxOf};
})();

/* ---- step 1: eligibility --------------------------------------- */
function evalElig(e){
 var fail=[],warn=[],ok=[];
 if(e.age===null)fail.push({q:"Age",m:"Not answered."});
 else if(e.age<P("ageMin"))fail.push({q:"Age",m:"Applicants must be at least "+P("ageMin")+".",fix:null});
 else if(e.age>P("ageMax"))warn.push({q:"Age",m:"Above the age band configured for this programme ("+P("ageMax")+"). This band is not published by LANDBANK and must be confirmed — a field officer will check before this becomes a decline.",fix:"talk"});
 else ok.push("Age within the configured band.");
 if(e.rsbsa===false)fail.push({q:"RSBSA",m:"Registration in the Registry System for Basic Sectors in Agriculture is required for this programme.",fix:"rsbsa"});
 else if(e.rsbsa===null)fail.push({q:"RSBSA",m:"Not answered."});
 else ok.push("RSBSA registered.");
 if(e.active===false)fail.push({q:"Farming",m:"You must be farming the land yourself, directly supervising it, or be a leaseholder who farms it personally.",fix:"talk"});
 else if(e.active===true)ok.push("Actively farming or supervising.");
 if(!e.crop)fail.push({q:"Crop",m:"Not answered."});
 else if(!APPCROPS[e.crop])fail.push({q:"Crop",m:"This crop is not in the current programme.",fix:"talk"});
 else ok.push(APPCROPS[e.crop].n+" is supported.");
 if(e.ha===null)fail.push({q:"Area",m:"Not answered."});
 else if(e.ha<P("haMin"))fail.push({q:"Area",m:"Below the minimum of "+P("haMin")+" hectares."});
 else if(e.ha>P("haMax"))warn.push({q:"Area",m:"Above the smallholder band of "+P("haMax")+" hectares. A different facility may fit better.",fix:"talk"});
 else ok.push("Area within the smallholder band.");
 if(!e.prov||!e.muni)fail.push({q:"Location",m:"Not answered."});
 if(e.hasLoan===true)warn.push({q:"Existing loan",m:"An existing agricultural loan does not disqualify you. It does mean additional credit review, and LANDBANK requires that you have no loan elsewhere for this same project and no past-due accounts.",fix:null});
 else if(e.hasLoan===false)ok.push("No existing agricultural loan declared.");
 if(!e.tenure)fail.push({q:"Land use",m:"Not answered."});
 var c=e.crop&&APPCROPS[e.crop];
 var maxFin=c&&e.ha?Math.round(c.cost*e.ha*P("financePct")):null;
 return {eligible:fail.length===0,fail:fail,warn:warn,ok:ok,maxFinance:maxFin,
  track:(e.age!==null&&e.age<=P("ageGradMax"))?"Small farmer · may also qualify for the agriculture-graduate track":"Small farmer"};
}

/* ---- step 2: ID OCR (simulated, three-value audit) ------------- */
/* Which fields each ID type actually carries. Anything on the card is read,
   never asked. The farmer should only ever be asked for what no document holds. */
var ID_FIELDS={
 "PhilSys National ID":["name","dob","sex","address","idNo"],
 "Driver's licence":["name","dob","sex","address","idNo","expiry"],
 "UMID":["name","dob","sex","idNo"],
 "Postal ID":["name","dob","address","idNo","expiry"],
 "Voter's ID":["name","dob","address","idNo"]
};
function ocr(idType,name){
 var conf={"PhilSys National ID":0.97,"Driver's licence":0.93,"UMID":0.91,"Postal ID":0.86,"Voter's ID":0.79}[idType]||0.8;
 var all={name:name||"[read from ID]",dob:"1978-04-12",sex:"Male",
  address:"Brgy. San Isidro, Talavera, Nueva Ecija",
  idNo:"XXXX-XXXX-XXXX-XX",expiry:"2031-04-12"};
 var has=ID_FIELDS[idType]||["name","dob","idNo"];
 var f={}; has.forEach(function(k){f[k]=all[k];});
 return {source:"MOCK OCR",confidence:conf,fields:f,captured:has,low:conf<0.85,
  /* what the card cannot tell us, so the farmer still has to answer */
  stillNeeded:["civil","mobile"].concat(has.indexOf("address")<0?["addr"]:[])};
}
function ageFromDob(dob){
 if(!dob)return null;
 var d=new Date(dob); if(isNaN(d))return null;
 var n=new Date(), a=n.getFullYear()-d.getFullYear();
 var m=n.getMonth()-d.getMonth();
 if(m<0||(m===0&&n.getDate()<d.getDate()))a--;
 return a;
}


/* ---- RSBSA card scan: OCR + cross-check against the ID -------- */
/* The card already carries the number, the registered name, the
   location, the crops and the area. Asking a farmer to type a
   17-digit reference off a card he is holding is a design failure. */
function ocrRsbsa(seed,idName,variant){
 var conf=0.88+((seed||0)%7)/100;
 /* The card is an independent source. Its registered name is whatever was
    captured at registration, which is not always what the ID says — married
    name, dropped middle name, a typo at the MAO desk. That divergence is a
    real control point, so the simulation must be able to produce it. */
 var cardName=idName||"[read from card]";
 if(variant==="mismatch"&&idName){
  var p=idName.split(" ");
  cardName=p[0]+" "+(p.length>2?p[1].charAt(0)+". ":"")+p[p.length-1];
 }
 var f={
  number:"03-49-12-001-0"+String(100000+((seed||1)*7919)%899999).slice(0,5),
  name:cardName,
  address:"Brgy. San Isidro, Talavera, Nueva Ecija",
  province:"Nueva Ecija", municipality:"Talavera", barangay:"San Isidro",
  crops:"Palay", area:2.0, registered:"2021-06-14"
 };
 var issues=[];
 if(idName&&f.name&&idName.trim().toLowerCase()!==f.name.trim().toLowerCase())
  issues.push({field:"name",m:"The name on the RSBSA card does not match the name on the ID.",
   idValue:idName,cardValue:f.name});
 return {source:"MOCK OCR",confidence:+conf.toFixed(2),fields:f,low:conf<0.85,issues:issues};
}

/* ---- step 4: area reconciliation ------------------------------- */
function areaCheck(declared,mapped){
 if(!declared||!mapped)return {state:"NOT_MAPPED",msg:"Farm not yet mapped."};
 var d=Math.abs(mapped-declared)/declared;
 if(d<=P("areaTolerance"))return {state:"OK",diff:d,
  msg:"Mapped area is within "+(P("areaTolerance")*100)+"% of the declared area."};
 return {state:"VERIFY",diff:d,
  msg:"Declared "+declared+" ha, mapped "+mapped.toFixed(2)+" ha — a difference of "+(d*100).toFixed(0)+
      "%. A field officer must verify the boundary before submission.",
  action:"FRO field verification"};
}

/* ---- step 6: farm plan ----------------------------------------- */
function farmPlan(crop,ha,water){
 var c=APPCROPS[crop]; if(!c||!ha)return null;
 var mult=(water==="irrigated")?1.0:0.88;
 var cost=Math.round(c.cost*ha);
 var fin=Math.round(cost*P("financePct"));
 var own=cost-fin;
 var yieldKg=Math.round(c.yld*ha*mult);
 var sales=Math.round(yieldKg*c.price);
 var interest=Math.round(fin*P("interestRate")*(c.days/365));
 var repay=fin+interest;
 var lines=[
  ["Seed or planting material",0.18,true],["Fertiliser",0.30,true],["Crop protection",0.13,true],
  ["Land preparation and services",0.14,false],["Labour",0.15,false],
  ["Harvest and post-harvest",0.07,false],["Transport",0.03,false]
 ].map(function(l){return {item:l[0],amt:Math.round(cost*l[1]),supplied:l[2]};});
 return {crop:c,ha:ha,cost:cost,finance:fin,own:own,yieldKg:yieldKg,sales:sales,
  interest:interest,repay:repay,net:sales-repay,lines:lines,
  suppliedTotal:lines.filter(function(l){return l.supplied;}).reduce(function(a,l){return a+l.amt;},0)};
}

/* ---- step 7: repayment capacity -------------------------------- */
function capacity(plan,debt){
 if(!plan)return null;
 var existing=(debt&&debt.items||[]).reduce(function(a,x){return a+(+x.bal||0);},0);
 var cover=plan.sales/(plan.repay+existing*0.35);
 return {existing:existing,cover:cover,
  band:cover>=1.6?"comfortable":cover>=1.25?"adequate":"tight",
  flag:cover<1.25,
  msg:cover<1.25?"Projected sales cover the repayment "+cover.toFixed(2)+" times. Additional credit review required — this is not a decline."
     :"Projected sales cover the repayment "+cover.toFixed(2)+" times."};
}

/* ---- step 9: personalised checklist ---------------------------- */
/* Built from the published SFF/ARB documentary requirements, filtered by
   what actually applies to this farmer. Nobody is shown a requirement that
   does not apply to them. */
function checklist(a){
 var items=[];
 DOCS_SFF.forEach(function(d){
  if(!d.cond(a))return;
  var done=false;
  if(d.k==="appform")done=!!a.consents.esign;
  else if(d.k==="tenure")done=Object.keys(a.tenureDocs||{}).length>0;
  else if(d.k==="title_ne")done=!!a.docs.title_ne;
  else if(d.k==="rsbsa")done=a.rsbsa.state==="VERIFIED"||!!a.rsbsa.proof;
  else if(d.k==="nia")done=!!a.docs.nia;
  else if(d.k==="dar")done=!!a.docs.dar;
  else if(d.k==="orientation")done=!!a.docs.orientation;
  else if(d.k==="farmplan")done=!!a.plan;
  else if(d.k==="tin")done=!!(a.tin&&a.tin.no);
  else if(d.k==="proforma")done=!!a.docs.proforma;
  items.push({k:d.k,n:d.n,why:d.why,ok:d.ok,src:d.src,done:done});
 });
 items.push({k:"id",n:"Valid government ID",src:"CONFIRMED",
  why:"LANDBANK must confirm who you are.",
  ok:"PhilSys, driver's licence, UMID, postal or voter's ID.",
  done:!!(a.id.idNo&&a.id.confirmed)});
 items.push({k:"map",n:"Farm map",src:"MANUAL",
  why:"Establishes the parcel being financed and prevents the same field being financed twice.",
  ok:"Boundary walked on the app, a dropped pin, or a field officer mapping visit.",
  done:!!a.farm.polygon||a.farm.mapMode==="fro"});
 items.push({k:"consent",n:"Consent forms",src:"MANUAL",

}

<script>/* ==================================================================
   CXPRICE — the collar
   Floor protects the farmer: it must clear the loan plus a margin.
   Ceiling protects the buyer: it caps what a shortage year can cost.
   Both are explainable — every ceiling recommendation lists the
   drivers that produced it, so a buyer can argue with the reasoning
   rather than with the number.
   ================================================================== */
var CXPRICE=(function(){
"use strict";
var FLOOR_MARGIN=0.15;   /* loan + 15% — the farmer's protected margin */

/* Historical anchors per crop. Ranges are indicative operating bands,
   not a published series — replace with PSA farmgate data before use. */
var BANDS={
 palay:{lo:17,typ:23,hi:27,vol:"low",policyFloor:20,
   policy:"Government floor pricing and NFA buying support set a practical base.",
   season:"Wet-season harvest in Sept–Oct depresses price; dry-season crop sells higher.",
   store:"Storable as dry palay, so a glut can be held back.",
   logi:"Short haul to local mills. Fuel is a small share of value."},
 corn:{lo:12,typ:16,hi:21,vol:"low-medium",
   policy:"Feed demand and the import tariff on feed wheat move the price more than any farm policy.",
   season:"Price softens at the main harvest peak when dryer capacity is tight.",
   store:"Storable at 14% moisture. Wet corn cannot wait and sells at a discount.",
   logi:"Haul to the mill matters. Diesel moves delivered cost materially."},
 ube:{lo:60,typ:85,hi:120,vol:"medium",
   policy:"No price policy. Export demand for powder is the driver.",
   season:"Single harvest after 8–10 months, so supply arrives in a narrow window.",
   store:"Cured tubers hold for weeks; as powder, for a year.",
   logi:"Long haul from producing provinces plus processing cost."},
 chili:{lo:90,typ:180,hi:320,vol:"high",
   policy:"No policy support. Purely supply and demand.",
   season:"Picked continuously for 26 weeks, which smooths the farmer's exposure but not the market's.",
   store:"Fresh, highly perishable. Price collapses in a local glut.",
   logi:"Small volumes, high value. Freight is not the constraint."},
 mungbean:{lo:60,typ:85,hi:115,vol:"low",
   policy:"No policy support. Imports fill any shortfall.",
   season:"Short 63-day cycle, so supply responds quickly to price.",
   store:"Dry grain. Holds for 9–12 months, which caps both spikes and crashes.",
   logi:"Light and dry. Freight is a small share of value."},
 onion:{lo:22,typ:52,hi:180,vol:"very high",
   policy:"Import timing is the single biggest driver. A permit released into the local harvest halves the farmgate price.",
   season:"Harvest concentrates in Feb–Apr; the shortage window is Sept–Dec.",
   store:"Cold storage holds for 3–6 months, which is why the trade, not the farmer, captures the spike.",
   logi:"Cold chain cost is real and rises with fuel."},
 citronella:{lo:4,typ:6.5,hi:10,vol:"unknown",placeholder:true,
   policy:"No data held. Essential-oil pricing is set by the distiller contract.",
   season:"Ratooned, harvested several times a year.",
   store:"Oil stores well; fresh herbage does not.",
   logi:"Bulky fresh material. Distillation must be close to the field."}
};

/* Drivers that push the ceiling recommendation up or down. */
function drivers(k){
 var b=BANDS[k]||{},d=[];
 d.push({n:"Historical price band",v:b.lo+"–"+b.hi+" per kg",eff:"sets the range",
  note:"Typical operating band. The ceiling should sit inside it, not above it."});
 d.push({n:"Price volatility",v:b.vol,eff:b.vol==="very high"||b.vol==="high"?"raises the ceiling":"holds the ceiling near typical",
  note:b.vol==="very high"?"A wide ceiling is the only way a buyer will sign, because the downside they are insuring against is enormous."
   :"A narrow band means the ceiling can sit close to the typical price."});
 d.push({n:"Government policy",v:b.policyFloor?("statutory floor "+b.policyFloor):"none",eff:b.policyFloor?"lifts the floor":"neutral",note:b.policy});
 d.push({n:"Season and harvest window",v:"—",eff:"timing risk",note:b.season});
 d.push({n:"Storability",v:"—",eff:b.store&&/Fresh|perishable/.test(b.store)?"raises spike risk":"dampens spikes",note:b.store});
 d.push({n:"Fuel and logistics",v:"—",eff:"raises the delivered floor",note:b.logi});
 return d;
}

/* Floor: the farmer must clear the loan plus a margin, whatever the market does. */
function floorFor(loanAmt,yieldKg,policyFloor){
 var perKg=(loanAmt*(1+FLOOR_MARGIN))/(yieldKg||1);
 var binds="cost-plus";
 if(policyFloor&&policyFloor>perKg){perKg=policyFloor;binds="statutory";}
 return {perKg:perKg,total:perKg*yieldKg,margin:FLOOR_MARGIN,binds:binds};
}

/* Ceiling: capped participation. Above it, the buyer keeps the upside;
   the farmer takes an agreed share so the contract still feels fair. */
function ceilingFor(k,floorKg){
 var b=BANDS[k]||{lo:0,typ:0,hi:0,vol:"medium"};
 var mult={"low":1.35,"low-medium":1.45,"medium":1.60,"high":1.95,"very high":2.40,"unknown":1.60}[b.vol]||1.6;
 /* The ceiling is a market number, not a loan number. Anchoring it to the
    loan-derived floor produced ceilings below the typical market price for
    high-value crops, which would have handed the farmer's entire upside to
    the buyer. It is anchored to the typical price and capped at the
    historical high, with the floor only as a lower bound. */
 var byVol=(b.typ||0)*mult;
 var byHist=b.hi;
 var rec=Math.min(byVol,byHist);
 if(rec<floorKg*1.12)rec=floorKg*1.12;
 return {perKg:rec,mult:mult,byVol:byVol,byHist:byHist,
  share:0.30,   /* farmer's share of anything above the ceiling */
  basis:byVol<byHist?"volatility multiple on the typical price":"historical high",
  floorBound:rec<=floorKg*1.12+0.001,
  band:b};
}
function collar(k,loanAmt,yieldKg){
 var b=BANDS[k]||{};
 var f=floorFor(loanAmt,yieldKg,b.policyFloor);
 var c=ceilingFor(k,f.perKg);
 return {crop:k,floor:f,ceiling:c,typ:b.typ,drivers:drivers(k),placeholder:!!b.placeholder};
}

/* Quality grades — the agreed price is a Grade A price. */
var GRADES={
 palay:[["A","14% moisture, ≥95% purity, no discolouration",1.00],
        ["B","14–16% moisture, minor foreign matter",0.90],
        ["C","Above 16% moisture, needs drying",0.74]],
 corn:[["A","≤14% moisture, aflatoxin under 20 ppb",1.00],
       ["B","14–16% moisture, needs drying",0.88],
       ["C","Above 16% moisture or aflatoxin flag",0.60]],
 ube:[["A","Firm cured tuber, ≥300 g, no rot or cuts",1.00],
      ["B","150–300 g, minor blemish",0.85],
      ["C","Under 150 g, cut or soft",0.58]],
 chili:[["A","Firm, uniform colour, no soft fruit",1.00],
        ["B","Mixed colour, slight softness",0.82],
        ["C","Soft, blemished or wet",0.55]],
 mungbean:[["A","≤12% moisture, ≥98% purity, no weevil",1.00],
           ["B","12–14% moisture or minor foreign matter",0.90],
           ["C","Weevil damage or above 14% moisture",0.62]],
 onion:[["A","Cured, ≥45 mm, firm, no sprouting",1.00],
        ["B","35–45 mm or minor blemish",0.82],
        ["C","Under 35 mm, soft or sprouting",0.55]],
 citronella:[["A","Fresh herbage delivered within 24 hours of cutting",1.00],
             ["B","24–48 hours",0.88],
             ["C","Over 48 hours or wilted",0.65]]
};
function grades(k){return GRADES[k]||GRADES.palay;}

/* Quadripartite settlement */
var QUAD={
 parties:[
  {k:"lbp",n:"LANDBANK",role:"Lends the money and is repaid first from the sale."},
  {k:"farmer",n:"Farmer",role:"Grows the crop and receives whatever is left after the loan is settled."},
  {k:"cx",n:"Kita",role:"Supplies the inputs, monitors the crop and arranges the sale."},
  {k:"buyer",n:"Buyer",role:"Buys the harvest and pays the loan portion directly to LANDBANK."}
 ],
 steps:[
  {n:"Buyer accepts the delivery",d:"Volume and grade are agreed at intake. The grade sets the price."},
  {n:"Buyer pays LANDBANK first",d:"The loan portion goes straight to the bank against the farmer's account. It does not pass through anyone else."},
  {n:"Balance goes to the farmer",d:"Whatever remains after the loan is settled is paid to the farmer."},
  {n:"LANDBANK records repayment",d:"The loan closes and the farmer qualifies for the next cycle."}
 ],
 why:"The farmer never has to set money aside to repay, and the bank is not relying on him to remember. This is the arrangement that makes the loan safe enough to price at a concessional rate."
};
function settle(salePrice,yieldKg,gradeMult,loanAmt){
 var gross=salePrice*yieldKg*(gradeMult||1);
 var toBank=Math.min(gross,loanAmt);
 return {gross:gross,toBank:toBank,toFarmer:Math.max(0,gross-toBank),shortfall:Math.max(0,loanAmt-gross)};
}
return {FLOOR_MARGIN:FLOOR_MARGIN,BANDS:BANDS,drivers:drivers,floorFor:floorFor,
 ceilingFor:ceilingFor,collar:collar,GRADES:GRADES,grades:grades,QUAD:QUAD,settle:settle};
})();
</script>

 citronella:{n:"Citronella",base:22000,unit:"kg",cycle:240,placeholder:true,
  quality:[["Harvest age","Cut at the recommended interval","Oil content peaks at a specific leaf age."],
           ["Freshness to still","Within 24 hours of cutting","Oil recovery falls quickly after cutting."]],
  t:[
