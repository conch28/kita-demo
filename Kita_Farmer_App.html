<script>/* ==================================================================
   CXC - dependency-free SVG chart primitives.
   Every chart obeys the same rules: no chartjunk, no 3D, no dual axes,
   y-axis starts at zero unless the series is a price (where zero is
   meaningless and the convention is a padded range), direct labelling
   in preference to legends, and one idea per chart.
   ================================================================== */
(function(){
function e(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function nice(n){ /* a readable axis step */
 var p=Math.pow(10,Math.floor(Math.log(n)/Math.LN10)),f=n/p;
 return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
}
function ticks(min,max,n){
 var step=nice((max-min)/Math.max(1,n));
 var lo=Math.floor(min/step)*step,out=[];
 for(var v=lo;v<=max+step*0.001;v+=step)if(v>=min-step*0.001)out.push(+v.toFixed(6));
 return out;
}
function path(pts){return pts.map(function(p,i){return (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1);}).join(" ");}

/* ---------- line chart with optional forecast band ---------------
   s = {label, pts:[{x,y}], forecast:[{x,y,lo,hi}], bands:[{y,label,k}],
        shade:[{from,to,label}], fmt, w, h, yZero} */
function line(s){
 var W=s.w||780,H=s.h||260,mL=52,mR=14,mT=14,mB=30;
 var iw=W-mL-mR,ih=H-mT-mB;
 var all=s.pts.slice();
 (s.forecast||[]).forEach(function(p){all.push({x:p.x,y:p.hi!==undefined?p.hi:p.y});
  all.push({x:p.x,y:p.lo!==undefined?p.lo:p.y});});
 (s.bands||[]).forEach(function(b){all.push({x:s.pts[0].x,y:b.y});});
 var xs=all.map(function(p){return p.x;}),ys=all.map(function(p){return p.y;});
 var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
 var y0=s.yZero?0:Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
 var pad=(y1-y0)*0.12||1; y0=s.yZero?0:y0-pad; y1=y1+pad;
 var X=function(v){return mL+(v-x0)/Math.max(1,(x1-x0))*iw;};
 var Y=function(v){return mT+ih-(v-y0)/Math.max(1e-9,(y1-y0))*ih;};
 var h='<svg viewBox="0 0 '+W+' '+H+'" class="cxc" preserveAspectRatio="xMidYMid meet">';
 /* harvest / season shading first, so it sits behind everything */
 (s.shade||[]).forEach(function(z){
  h+='<rect x="'+X(z.from).toFixed(1)+'" y="'+mT+'" width="'+Math.max(0,(X(z.to)-X(z.from))).toFixed(1)+
   '" height="'+ih+'" class="cxc-shade"/>';
  if(z.label)h+='<text x="'+((X(z.from)+X(z.to))/2).toFixed(1)+'" y="'+(mT+11)+'" class="cxc-zl">'+e(z.label)+'</text>';
 });
 /* y grid */
 ticks(y0,y1,4).forEach(function(t){
  h+='<line x1="'+mL+'" y1="'+Y(t).toFixed(1)+'" x2="'+(W-mR)+'" y2="'+Y(t).toFixed(1)+'" class="cxc-g"/>'+
   '<text x="'+(mL-7)+'" y="'+(Y(t)+3.5).toFixed(1)+'" class="cxc-yl">'+e(s.fmt?s.fmt(t):t)+'</text>';
 });
 /* x labels */
 (s.xlabels||[]).forEach(function(l){
  h+='<text x="'+X(l.x).toFixed(1)+'" y="'+(H-9)+'" class="cxc-xl">'+e(l.t)+'</text>';
 });
 /* reference bands (collar floor / ceiling) */
 (s.bands||[]).forEach(function(b){
  h+='<line x1="'+mL+'" y1="'+Y(b.y).toFixed(1)+'" x2="'+(W-mR)+'" y2="'+Y(b.y).toFixed(1)+
   '" class="cxc-ref '+(b.k||"")+'"/>'+
   '<text x="'+(W-mR-3)+'" y="'+(Y(b.y)-4).toFixed(1)+'" class="cxc-rl '+(b.k||"")+'">'+e(b.label)+'</text>';
 });
 /* forecast confidence band */
 if(s.forecast&&s.forecast.length){
  var up=s.forecast.map(function(p){return [X(p.x),Y(p.hi)];});
  var dn=s.forecast.map(function(p){return [X(p.x),Y(p.lo)];}).reverse();
  h+='<path d="'+path(up.concat(dn))+' Z" class="cxc-band"/>';
 }
 /* actual series */
 h+='<path d="'+path(s.pts.map(function(p){return [X(p.x),Y(p.y)];}))+'" class="cxc-line"/>';
 /* forecast centre line */
 if(s.forecast&&s.forecast.length){
  var join=[[X(s.pts[s.pts.length-1].x),Y(s.pts[s.pts.length-1].y)]]
   .concat(s.forecast.map(function(p){return [X(p.x),Y(p.y)];}));
  h+='<path d="'+path(join)+'" class="cxc-fc"/>';
  h+='<line x1="'+X(s.pts[s.pts.length-1].x).toFixed(1)+'" y1="'+mT+'" x2="'+
   X(s.pts[s.pts.length-1].x).toFixed(1)+'" y2="'+(mT+ih)+'" class="cxc-now"/>'+
   '<text x="'+(X(s.pts[s.pts.length-1].x)+4).toFixed(1)+'" y="'+(mT+ih-4)+'" class="cxc-nl">forecast &rarr;</text>';
 }
 /* last actual point marker */
 var lp=s.pts[s.pts.length-1];
 h+='<circle cx="'+X(lp.x).toFixed(1)+'" cy="'+Y(lp.y).toFixed(1)+'" r="3.5" class="cxc-dot"/>';
 h+='</svg>';
 return h;
}

/* ---------- horizontal bars, direct-labelled ---------------------- */
function bars(rows,o){
 o=o||{};var max=Math.max.apply(null,rows.map(function(r){return Math.abs(r.v);}))||1;
 return '<div class="cxb">'+rows.map(function(r){
  var pc=Math.abs(r.v)/max*100;
  return '<div class="cxb-r"><div class="cxb-n">'+e(r.n)+'</div>'+
   '<div class="cxb-t"><i class="'+(r.k||"")+'" style="width:'+pc.toFixed(1)+'%"></i></div>'+
   '<div class="cxb-v">'+e(o.fmt?o.fmt(r.v):r.v)+'</div></div>';
 }).join("")+'</div>';
}

/* ---------- grouped column chart ---------------------------------- */
function cols(groups,o){
 o=o||{};
 /* accept both {v:5} and {v:[5,7]} */
 groups=groups.map(function(g){return {n:g.n,v:(g.v instanceof Array)?g.v:[g.v],k:g.k};});var W=o.w||760,H=o.h||210,mL=52,mR=12,mT=12,mB=34;
 var iw=W-mL-mR,ih=H-mT-mB;
 var max=0;groups.forEach(function(g){g.v.forEach(function(v){if(v>max)max=v;});});
 max=max||1;
 var gw=iw/groups.length,n=groups[0].v.length,bw=Math.min(26,(gw-8)/n);
 var h='<svg viewBox="0 0 '+W+' '+H+'" class="cxc" preserveAspectRatio="xMidYMid meet">';
 ticks(0,max,4).forEach(function(t){
  var y=mT+ih-t/max*ih;
  h+='<line x1="'+mL+'" y1="'+y.toFixed(1)+'" x2="'+(W-mR)+'" y2="'+y.toFixed(1)+'" class="cxc-g"/>'+
   '<text x="'+(mL-7)+'" y="'+(y+3.5).toFixed(1)+'" class="cxc-yl">'+e(o.fmt?o.fmt(t):t)+'</text>';
 });
 groups.forEach(function(g,i){
  var gx=mL+i*gw;
  g.v.forEach(function(v,j){
   var bh=v/max*ih,x=gx+(gw-bw*n)/2+j*bw;
   h+='<rect x="'+x.toFixed(1)+'" y="'+(mT+ih-bh).toFixed(1)+'" width="'+(bw-3).toFixed(1)+
    '" height="'+Math.max(0,bh).toFixed(1)+'" class="cxc-col s'+j+'"/>';
  });
  h+='<text x="'+(gx+gw/2).toFixed(1)+'" y="'+(H-11)+'" class="cxc-xl">'+e(g.n)+'</text>';
 });
 h+='</svg>';
 if(o.series)h+='<div class="cxc-leg">'+o.series.map(function(s,j){
  return '<span class="lg"><i class="s'+j+'"></i>'+e(s)+'</span>';}).join("")+'</div>';
 return h;
}

/* ---------- donut ------------------------------------------------- */
function donut(rows,o){
 o=o||{};var S=o.size||132,r=S/2-8,cx=S/2,cy=S/2,tot=rows.reduce(function(t,x){return t+x.v;},0)||1;
 var a=-Math.PI/2,h='<svg viewBox="0 0 '+S+' '+S+'" class="cxc-d">';
 rows.forEach(function(x,i){
  var sw=x.v/tot*Math.PI*2,a2=a+sw;
  var x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
  h+='<path d="M '+cx+' '+cy+' L '+x1.toFixed(1)+' '+y1.toFixed(1)+
   ' A '+r+' '+r+' 0 '+(sw>Math.PI?1:0)+' 1 '+x2.toFixed(1)+' '+y2.toFixed(1)+' Z" class="cxc-sl s'+(i%6)+'"/>';
  a=a2;
 });
 h+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.58)+'" class="cxc-hole"/>';
 if(o.centre)h+='<text x="'+cx+'" y="'+(cy+2)+'" class="cxc-ct">'+e(o.centre)+'</text>';
 if(o.sub)h+='<text x="'+cx+'" y="'+(cy+15)+'" class="cxc-cs">'+e(o.sub)+'</text>';
 h+='</svg>';
 return '<div class="cxc-dw">'+h+'<div class="cxc-dl">'+rows.map(function(x,i){
  return '<div class="dl"><i class="s'+(i%6)+'"></i><span>'+e(x.n)+'</span><b>'+
   e(o.fmt?o.fmt(x.v):x.v)+'</b></div>';}).join("")+'</div></div>';
}

/* ---------- sparkline --------------------------------------------- */
function spark(vals,o){
 o=o||{};var W=o.w||96,H=o.h||24;
 var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),sp=mx-mn||1;
 var pts=vals.map(function(v,i){return [i/(vals.length-1)*W,H-((v-mn)/sp)*(H-4)-2];});
 var up=vals[vals.length-1]>=vals[0];
 return '<svg viewBox="0 0 '+W+' '+H+'" class="cxc-sp '+(up?"up":"dn")+'"><path d="'+path(pts)+'"/></svg>';
}
window.CXC={line:line,bars:bars,cols:cols,donut:donut,spark:spark,ticks:ticks};
})();
</script>
<script>/* ==================================================================
   CXPX - farmgate price history and forecast.

   AUDIT FINDING. The collar engine set a floor and a ceiling against
   an assumed "typical" price, with no series behind it. A collar with
   no price history is an assertion. This module supplies the series,
   the seasonality that drives it, and a forecast the collar can be
   defended against.

   Model: seasonal index x trend x shock, daily, 24 months back.
   Seasonality is the real driver in Philippine farmgate pricing -
   prices collapse at harvest because everyone harvests at once.
   ================================================================== */
(function(){
function rnd(s){var h=2166136261;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return ((h>>>0)%1e6)/1e6;}
function R(n,d){d=d||0;return Math.round(n*Math.pow(10,d))/Math.pow(10,d);}
var DAY=864e5;
var TODAY=new Date("2026-08-10T00:00:00+08:00");
var START=new Date(TODAY.getTime()-730*DAY);

/* ---- monthly seasonal index, Jan..Dec. 1.00 = annual mean -------- */
var SEASON={
 palay:{ idx:[1.06,1.08,0.94,0.88,0.97,1.03,1.09,1.12,1.10,0.92,0.86,0.95],
  harvest:[[9,10],[2,3]], note:"Two harvests. Prices collapse in October–November and again in March–April when everyone threshes at once, and peak in the July–September lean months."},
 corn:{  idx:[1.04,0.93,0.90,0.98,1.05,1.08,1.10,1.07,0.92,0.88,0.96,1.05],
  harvest:[[8,9],[1,2]], note:"Two croppings. The September–October wet harvest is the deepest trough because grain comes in wet and dries slowly."},
 ube:{   idx:[0.92,0.88,0.85,0.87,0.93,1.00,1.06,1.02,0.98,1.08,1.28,1.22],
  harvest:[[7,8,9,10]], note:"Demand is festive. November–December halaya and ice-cream season lifts fresh ube 25–30% above the annual mean, while the August–November harvest supplies it."},
 ubep:{  idx:[0.90,0.86,0.84,0.86,0.92,1.00,1.08,1.04,1.00,1.10,1.32,1.26],
  harvest:[[8,9,10,11]], note:"Kinampay follows the same festive demand curve as commercial ube but more sharply — the confectionery trade pays a premium for the aroma and will not substitute."},
 chili:{ idx:[1.32,1.18,0.94,0.82,0.78,0.85,1.02,1.14,1.08,0.96,1.18,1.42],
  harvest:[[3,4,5]], note:"The most volatile crop in the book. December and January spikes are routine; a typhoon can triple the price in a fortnight."},
 citronella:{idx:[1.02,1.00,0.99,1.01,1.04,1.06,1.05,1.03,1.01,0.99,0.98,1.00],
  harvest:[[0,3,6,9]], note:"Biomass is cut on a 105-day rotation, so there is no seasonal glut. The oil price moves with world industrial demand, not with Philippine harvest."},
 coconut:{idx:[0.97,0.98,1.00,1.02,1.03,1.04,1.03,1.01,0.99,0.98,0.97,0.98],
  harvest:[], note:"Copra-linked and near-aseasonal. Moves with world vegetable-oil prices rather than with local harvest."}
};
/* annual drift, applied over the 24-month window */
var TREND={citronella:0.031,palay:0.052,corn:0.038,ube:0.115,ubep:0.142,chili:0.061,coconut:0.024};
/* daily volatility */
var VOL={citronella:0.011,palay:0.010,corn:0.013,ube:0.021,ubep:0.019,chili:0.041,coconut:0.008};
/* documented shocks - a price series with no events in it is a sine wave */
var EVENTS=[
 {d:"2024-11-14",crops:["palay","corn"],m:1.09,n:"Typhoon Pepito — Central Luzon standing crop losses"},
 {d:"2025-02-20",crops:["palay"],m:0.94,n:"Rice tariff cut passed through to farmgate"},
 {d:"2025-07-08",crops:["ube","ubep"],m:1.14,n:"Two export enquiries land in the same month"},
 {d:"2025-10-02",crops:["corn"],m:0.91,n:"Import arrivals ahead of the wet harvest"},
 {d:"2026-01-16",crops:["chili"],m:1.55,n:"Cold snap in Nueva Ecija, supply gap for six weeks"},
 {d:"2026-04-11",crops:["ube","ubep"],m:1.08,n:"Processor restocking after a short 2025 harvest"},
 {d:"2026-06-27",crops:["palay","corn"],m:0.96,n:"NFA buffer release"}
];
var _cache={};
function series(k){
 if(_cache[k])return _cache[k];
 var c=CX.CROPS[k],S=SEASON[k]||SEASON.palay;
 var base=c.price,out=[],lvl=1;
 var evs=EVENTS.filter(function(e){return e.crops.indexOf(k)>=0;})
  .map(function(e){return {t:new Date(e.d+"T00:00:00+08:00").getTime(),m:e.m,n:e.n,used:false};});
 for(var i=0;i<730;i++){
  var t=START.getTime()+i*DAY,d=new Date(t);
  var mon=d.getMonth();
  var seas=S.idx[mon];
  var trend=1+TREND[k]*(i/365);
  /* mean-reverting daily noise */
  var sh=(rnd(k+i)-0.5)*2*VOL[k];
  lvl=lvl*(1+sh)-(lvl-1)*0.06;
  var ev=1;
  evs.forEach(function(e){
   var days=(t-e.t)/DAY;
   if(days>=0&&days<45)ev*=1+(e.m-1)*(1-days/45);   /* decays over six weeks */
  });
  out.push({t:t,d:d,v:R(base*seas*trend*lvl*ev,2),mon:mon});
 }
 _cache[k]=out;return out;
}

/* ---- aggregation ------------------------------------------------- */
function agg(k,period){
 var s=series(k);
 if(period==="daily")return s.map(function(p){return {t:p.t,v:p.v};});
 var buck={},order=[];
 s.forEach(function(p){
  var d=p.d,key;
  if(period==="weekly"){var dt=new Date(d);dt.setDate(dt.getDate()-dt.getDay());key=dt.toISOString().slice(0,10);}
  else if(period==="monthly")key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  else key=d.getFullYear()+"-Q"+(Math.floor(d.getMonth()/3)+1);
  if(!buck[key]){buck[key]={k:key,t:p.t,v:[],hi:-1e9,lo:1e9};order.push(key);}
  buck[key].v.push(p.v);
  if(p.v>buck[key].hi)buck[key].hi=p.v;
  if(p.v<buck[key].lo)buck[key].lo=p.v;
 });
 return order.map(function(key){
  var b=buck[key];
  return {t:b.t,key:key,v:R(b.v.reduce(function(a,x){return a+x;},0)/b.v.length,2),
   hi:b.hi,lo:b.lo,n:b.v.length};
 });
}

/* ---- forecast ---------------------------------------------------- */
/* Seasonal-naive with drift: next 12 months = same month last year,
   re-based to the current level and carried forward on trend. The band
   widens with horizon because it should. */
function forecast(k,months){
 months=months||12;
 var s=series(k),S=SEASON[k]||SEASON.palay,c=CX.CROPS[k];
 var last=s[s.length-1];
 var recent=s.slice(-30).reduce(function(a,p){return a+p.v;},0)/30;
 var lastMon=last.d.getMonth();
 var out=[];
 for(var m=1;m<=months;m++){
  var d=new Date(last.t);d.setMonth(d.getMonth()+m);
  var mon=d.getMonth();
  var ratio=S.idx[mon]/S.idx[lastMon];
  var drift=1+TREND[k]*(m/12);
  var v=recent*ratio*drift;
  var wid=VOL[k]*Math.sqrt(m*30)*1.45;     /* random-walk widening */
  out.push({t:d.getTime(),d:d,v:R(v,2),lo:R(v*(1-wid),2),hi:R(v*(1+wid),2),mon:mon});
 }
 return out;
}

/* ---- summary statistics the apps actually need ------------------- */
function stats(k){
 var s=series(k),f=forecast(k,12),c=CX.CROPS[k];
 var cur=s[s.length-1].v;
 var d30=s[s.length-31].v,d90=s[s.length-91].v,y1=s[s.length-366].v;
 var yr=s.slice(-365).map(function(p){return p.v;});
 var hi=Math.max.apply(null,yr),lo=Math.min.apply(null,yr);
 var mean=yr.reduce(function(a,x){return a+x;},0)/yr.length;
 var sd=Math.sqrt(yr.reduce(function(a,x){return a+(x-mean)*(x-mean);},0)/yr.length);
 var hIdx=(SEASON[k]||SEASON.palay).harvest;
 var hMons=[];hIdx.forEach(function(w){w.forEach(function(m){hMons.push(m);});});
 var atHarvest=f.filter(function(p){return hMons.indexOf(p.mon)>=0;});
 var harvestP=atHarvest.length?R(atHarvest.reduce(function(a,p){return a+p.v;},0)/atHarvest.length,2):R(f[0].v,2);
 return {crop:k,cur:cur,
  d30:R((cur/d30-1)*100,1),d90:R((cur/d90-1)*100,1),y1:R((cur/y1-1)*100,1),
  hi52:hi,lo52:lo,mean:R(mean,2),sd:R(sd,2),cv:R(sd/mean*100,1),
  floor:c.floor,ceil:c.ceil,ref:c.price,
  fc12:f[f.length-1],harvestPrice:harvestP,
  harvestMons:hMons,season:(SEASON[k]||SEASON.palay).note,
  belowFloor:s.slice(-365).filter(function(p){return p.v<c.floor;}).length,
  spark:s.filter(function(p,i){return i%30===0;}).map(function(p){return p.v;})};
}
function events(k){
 return EVENTS.filter(function(e){return e.crops.indexOf(k)>=0;})
  .map(function(e){return {d:e.d,t:new Date(e.d+"T00:00:00+08:00").getTime(),n:e.n,m:e.m};});
}
window.CXPX={series:series,agg:agg,forecast:forecast,stats:stats,events:events,
 SEASON:SEASON,TODAY:TODAY,EVENTS:EVENTS};
})();
</script>
<script>/* ==================================================================
   CXAI - the only shape an AI output is allowed to take here.

   AUDIT FINDING. Six surfaces in this codebase were decorative: they
   answered a question nobody had to act on. They are deleted, not
   restyled. What replaces them is a single structure -

     OBSERVATION   what is true, with the number
     REASON        why, itemised, each line traceable to a field
     IMPACT        financial or operational, in pesos or days
     ACTION        a button that changes state

   A card that cannot produce the fourth element does not get built.
   ================================================================== */
(function(){
function rnd(s){var h=2166136261;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return ((h>>>0)%1e6)/1e6;}
function R(n,d){return Math.round(n*Math.pow(10,d||0))/Math.pow(10,d||0);}

/* ---------- the action vocabulary -------------------------------- */
var VERBS={
 approve:      {n:"Approve",              k:"primary", d:"Records the credit decision and advances the loan state."},
 contact:      {n:"Contact farmer",       k:"ghost",   d:"Opens an SMS or in-app message with the context attached."},
 document:     {n:"Request document",     k:"ghost",   d:"Raises a document request that appears in the farmer app."},
 reassign:     {n:"Reassign buyer",       k:"ghost",   d:"Moves allocated volume to a different offtake contract."},
 po:           {n:"Create PO",            k:"primary", d:"Raises a purchase order against the selected supplier."},
 dr:           {n:"Submit DR",            k:"primary", d:"Submits the delivery receipt batch for reimbursement."},
 escalate:     {n:"Escalate to LANDBANK", k:"ghost",   d:"Raises the item with the lending centre with the file attached."},
 agronomist:   {n:"Send agronomist",      k:"ghost",   d:"Schedules a field visit against the named cluster."},
 report:       {n:"Generate report",      k:"ghost",   d:"Produces a dated PDF of this finding and its evidence."}
};
var LEDGER=[];
function fire(verb,ctx,label){
 var v=VERBS[verb]||{n:verb};
 var rec={id:"AX-"+(LEDGER.length+1),verb:verb,n:v.n,label:label||"",ctx:ctx||"",
  at:new Date().toISOString(),by:(typeof CXP!=="undefined"&&CXP.role?CXP.role():"user")};
 LEDGER.push(rec);
 try{CXP.log({obj:"action",id:rec.id,from:"—",to:v.n+(label?" · "+label:""),role:rec.by,actor:"AI-recommended",ai:null});}catch(e){}
 try{toast(v.n+(label?" — "+label:"")+" recorded");}catch(e){}
 return rec;
}
function ledger(){return LEDGER;}
function clearLedger(){LEDGER=[];}

/* ---------- the card --------------------------------------------- */
/* o = {obs, score, band, reasons[], impact{v,d}, rec, actions[{verb,label,ctx}], src} */
function card(o){
 var e=function(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");};
 var h='<div class="oria '+(o.band||"")+'">';
 h+='<div class="or-hd"><div class="or-l">Observation</div>';
 if(o.score!==undefined)h+='<div class="or-sc">'+o.score+'<span>/100</span></div>';
 h+='</div>';
 h+='<div class="or-obs">'+e(o.obs)+'</div>';
 if(o.reasons&&o.reasons.length){
  h+='<div class="or-l">Reasons</div><ul class="or-rs">'+o.reasons.map(function(r){
   return '<li>'+e(typeof r==="string"?r:r.t)+(typeof r!=="string"&&r.v?' <b>'+e(r.v)+'</b>':'')+'</li>';}).join("")+'</ul>';
 }
 if(o.impact){
  h+='<div class="or-l">'+(o.impact.l||"Financial impact")+'</div>'+
   '<div class="or-im"><div class="or-iv">'+e(o.impact.v)+'</div>'+
   (o.impact.d?'<div class="or-id">'+e(o.impact.d)+'</div>':'')+'</div>';
 }
 if(o.rec)h+='<div class="or-l">Recommended</div><div class="or-rec">'+e(o.rec)+'</div>';
 if(o.actions&&o.actions.length){
  h+='<div class="or-act">'+o.actions.map(function(a){
   var v=VERBS[a.verb]||{n:a.verb,k:"ghost"};
   return '<button class="ab '+v.k+'" title="'+e(v.d)+'" onclick="CXAI.fire(\''+a.verb+'\',\''+
    e(a.ctx||"").replace(/'/g,"") +'\',\''+e(a.label||"").replace(/'/g,"")+'\')">'+e(a.label||v.n)+'</button>';
  }).join("")+'</div>';
 }
 if(o.src)h+='<div class="or-src">Read from: '+e(o.src)+'</div>';
 h+='</div>';
 return h;
}

/* ==================================================================
   1. FARMER CREDIT ASSESSMENT  (replaces "AI says this farmer is low risk")
   ================================================================== */
function farmerCredit(f,p,sc,b){
 var c=CX.CROPS[f.crop];
 var reasons=[],score=100;
 var hist=(f.yieldHist||[]);
 var avg=hist.length?R(hist.reduce(function(a,x){return a+x;},0)/hist.length,1):null;
 if(hist.length>=3)reasons.push({t:hist.length+" consecutive completed "+c.n.toLowerCase()+" cycles",v:""});
 else {score-=8;reasons.push({t:"Only "+hist.length+" completed cycle"+(hist.length===1?"":"s")+" on record",v:""});}
 if(f.status==="repaid"||f.collected>=1)reasons.push({t:"100% historical repayment",v:""});
 else if(hist.length>=2)reasons.push({t:"No arrears recorded on prior cycles",v:""});
 if(avg)reasons.push({t:"Average yield",v:avg+" MT/ha"});
 if(f.water==="irrigated")reasons.push({t:"Irrigated farm",v:""}); else {score-=6;reasons.push({t:"Rain-fed — yield variance is materially higher",v:""});}
 if(f.tenure==="owner")reasons.push({t:"Verified land tenure",v:"titled"});
 else {score-=4;reasons.push({t:"Tenure is "+f.tenure+" — landowner consent required",v:""});}
 if(b){
  var proj=CX.projValue(f)/c.price/1000;
  reasons.push({t:"Buyer demand exceeds projected harvest",v:b.n});
 } else {score-=22;reasons.push({t:"No buyer allocated — output has no committed home",v:""});}
 if(f.pcic)reasons.push({t:"PCIC parametric cover enrolled",v:""}); else score-=7;
 if(!f.gpsOk){score-=9;reasons.push({t:"Farm polygon not captured — duplicate-parcel risk unresolved",v:""});}
 if(!f.docsOk){score-=11;reasons.push({t:"Submission package has open document items",v:""});}
 if(sc&&sc.overall)reasons.push({t:"Protocol compliance",v:sc.overall+"/100"});
 if(p.cover<1.3){score-=12;reasons.push({t:"Thin repayment cover",v:p.cover.toFixed(2)+"×"});}
 score=Math.max(20,Math.min(100,Math.round(score-p.pct*1.4)));
 var band=score>=82?"ok":score>=65?"info":score>=50?"warn":"bad";
 var verdict=score>=82?"Low risk":score>=65?"Acceptable":score>=50?"Elevated risk":"High risk";
 var rec,acts=[];
 if(score>=82){
  rec="Approve under the standard "+c.n.toLowerCase()+" programme.";
  acts=[{verb:"approve",ctx:f.id,label:"Approve — standard "+c.n.toLowerCase()+" programme"},
        {verb:"report",ctx:f.id,label:"Generate credit memo"}];
 } else if(!b){
  rec="Do not approve without an offtake allocation. Repayment would depend on a spot sale nobody controls.";
  acts=[{verb:"reassign",ctx:f.id,label:"Allocate a buyer"},
        {verb:"contact",ctx:f.id,label:"Contact farmer"},
        {verb:"escalate",ctx:f.id,label:"Escalate to LANDBANK"}];
 } else if(!f.docsOk||!f.gpsOk){
  rec="Hold. "+(!f.docsOk?"Documents incomplete":"Polygon not captured")+" — resolve before submission.";
  acts=[{verb:"document",ctx:f.id,label:"Request the missing document"},
        {verb:"contact",ctx:f.id,label:"Contact farmer"}];
 } else {
  rec="Approve with conditions: monitor protocol compliance at 30 and 60 days.";
  acts=[{verb:"approve",ctx:f.id,label:"Approve with conditions"},
        {verb:"agronomist",ctx:f.id,label:"Schedule a 30-day visit"}];
 }
 return {obs:verdict+" — "+score+"/100. Predicted default "+p.pct.toFixed(1)+"% on "+CX.pesoX(f.amt)+".",
  score:score,band:band,reasons:reasons,
  impact:{l:"Exposure",v:CX.pesoX(Math.round(f.amt*(1-(f.collected||0)))),
   d:"Repayment cover "+p.cover.toFixed(2)+"× at the collar floor. "+
     (b?("Output contracted with "+b.n+"."):"No offtake contract in place.")},
  rec:rec,actions:acts,
  src:"RSBSA record, "+(hist.length||0)+" prior cycles, farm polygon, tenure document, PCIC enrolment, offtake register, protocol log."};
}

/* ==================================================================
   2. YIELD SHORTFALL BY CLUSTER  (replaces "AI detects risk")
   ================================================================== */
function projYield(f){
 var c=CX.CROPS[f.crop],r=rnd(f.id+"py");
 var base=c.yld/1000;
 var hist=(f.yieldHist||[]);
 var h=hist.length?hist[hist.length-1]:base;
 var late=rnd(f.id+"late")<0.28;
 var lateD=late?7+Math.round(rnd(f.id+"ld")*9):0;
 var fertD=rnd(f.id+"fert")<0.24?5+Math.round(rnd(f.id+"fd")*8):0;
 var y=h*(1-(lateD*0.011)-(fertD*0.014)-(f.water==="irrigated"?0:0.09));
 return {y:R(y,2),plan:R(base,2),lateDays:lateD,fertDays:fertD,short:y<base*0.86};
}
function yieldShortfall(crop,prov,threshold){
 crop=crop||"corn";prov=prov||"Tarlac";
 var c=CX.CROPS[crop];
 threshold=threshold||R(c.yld/1000*0.77,1);
 var bk=CX.book().filter(function(f){return f.crop===crop&&f.status!=="waitlist"&&(!prov||f.prov===prov);});
 var flagged=bk.map(function(f){var p=projYield(f);return {f:f,p:p};})
  .filter(function(x){return x.p.y<threshold;});
 var widened=false;
 if(flagged.length<3){
  /* Naming a province the model has almost no farms in produces a card that is
     technically true and operationally useless. Widen and say so. */
  bk=CX.book().filter(function(f){return f.crop===crop&&f.status!=="waitlist";});
  flagged=bk.map(function(f){var p=projYield(f);return {f:f,p:p};})
   .filter(function(x){return x.p.y<threshold;});
  widened=true;
 }
 if(!flagged.length)return null;
 var lostT=flagged.reduce(function(t,x){return t+(x.p.plan-x.p.y)*x.f.ha;},0);
 var lostV=lostT*1000*c.price;
 var late=flagged.filter(function(x){return x.p.lateDays;});
 var fert=flagged.filter(function(x){return x.p.fertDays;});
 var avgFert=fert.length?Math.round(fert.reduce(function(t,x){return t+x.p.fertDays;},0)/fert.length):0;
 var avgLate=late.length?Math.round(late.reduce(function(t,x){return t+x.p.lateDays;},0)/late.length):0;
 var ha=flagged.reduce(function(t,x){return t+x.f.ha;},0);
 var reasons=[];
 if(late.length)reasons.push({t:"Late planting on "+late.length+" farms",v:"average "+avgLate+" days behind calendar"});
 if(fert.length)reasons.push({t:"Fertiliser delivery delayed on "+fert.length+" farms",v:"average "+avgFert+" days"});
 var rain=flagged.filter(function(x){return x.f.water!=="irrigated";});
 if(rain.length)reasons.push({t:rain.length+" of the flagged farms are rain-fed",v:""});
 var clusters={};flagged.forEach(function(x){clusters[x.f.muni]=(clusters[x.f.muni]||0)+1;});
 var worst=Object.keys(clusters).sort(function(a,b){return clusters[b]-clusters[a];})[0];
 var allocCut=Math.round(lostT);
 var provs=[];flagged.forEach(function(x){if(provs.indexOf(x.f.prov)<0)provs.push(x.f.prov);});
 var where=widened?provs.join(", "):prov;
 return {obs:flagged.length+" "+where+" "+c.n.toLowerCase()+" farm"+(flagged.length===1?" is":"s are")+
   " projected below "+threshold+" MT/ha.",
  band:"warn",reasons:reasons,
  impact:{v:CX.pesoX(Math.round(lostV))+" lower expected crop value",
   d:R(lostT,1)+" MT below plan across "+R(ha,1)+" ha. Repayment cover on those loans falls by roughly "+
     R((lostV/flagged.reduce(function(t,x){return t+x.f.amt;},0)),2)+"×."},
  rec:"Send an agronomist to "+worst+", prioritise the outstanding fertiliser deliveries, and cut the buyer allocation before the buyer plans around a number we cannot meet.",
  actions:[{verb:"agronomist",ctx:prov,label:"Send agronomist to "+worst},
   {verb:"po",ctx:prov,label:"Prioritise fertiliser delivery"},
   {verb:"reassign",ctx:prov,label:"Reduce buyer allocation by "+allocCut+" MT"},
   {verb:"report",ctx:prov,label:"Generate cluster report"}],
  src:"Planting dates, delivery receipts, irrigation status, three-season yield history, crop calendar."+
   (widened?" Scan widened beyond "+prov+" — too few contracted farms there to draw a conclusion from.":""),
  detail:flagged};
}

/* ==================================================================
   3. BUYER SHORTFALL  (replaces "market matching AI")
   ================================================================== */
function buyerShortfall(buyerId){
 var b=CX.buyers().filter(function(x){return x.id===buyerId;})[0];
 if(!b)return null;
 var c=CX.CROPS[b.crop];
 var mine=CX.book().filter(function(f){return f.buyerId===b.id&&f.status!=="waitlist";});
 var proj=mine.reduce(function(t,f){var p=projYield(f);return t+p.y*f.ha;},0);
 var req=b.mtYr;
 var gapMt=req-proj;
 if(gapMt<=0)return null;
 var haNeed=Math.ceil(gapMt/(c.yld/1000));
 var plot=c.k==="palay"?1.6:(c.k==="ube"?0.75:1.3);
 var others=CX.book().filter(function(f){return f.crop===b.crop&&f.buyerId!==b.id&&f.status!=="waitlist";});
 var sourceable=R(others.reduce(function(t,f){var p=projYield(f);return t+p.y*f.ha;},0)*0.35,0);
 return {obs:b.n+" requires "+CX.num(req)+" MT. Confirmed projected harvest is "+R(proj,0)+" MT.",
  band:"warn",
  reasons:[{t:"Contracted farms allocated to this buyer",v:mine.length+" farms, "+R(mine.reduce(function(t,f){return t+f.ha;},0),1)+" ha"},
   {t:"Projected output at current execution",v:R(proj,0)+" MT"},
   {t:"Shortfall",v:R(gapMt,0)+" MT"}],
  impact:{v:R(gapMt,0)+" MT short — "+CX.pesoX(Math.round(gapMt*1000*b.price))+" of contract value at risk",
   d:"A shortfall discovered at delivery is a broken contract. Discovered now it is a planning decision."},
  rec:"Three options, in order of cost: allocate "+CX.num(haNeed)+" additional hectares, source "+
   sourceable+" MT from an unallocated cluster, or move the delivery to the next window.",
  actions:[{verb:"po",ctx:b.id,label:"Allocate "+CX.num(haNeed)+" additional hectares"},
   {verb:"reassign",ctx:b.id,label:"Source "+sourceable+" MT from another cluster"},
   {verb:"contact",ctx:b.id,label:"Propose a later delivery window"},
   {verb:"report",ctx:b.id,label:"Generate shortfall note"}],
  src:"Offtake register, allocated farm list, projected yields, unallocated cluster inventory.",
  options:[{n:"Allocate "+CX.num(haNeed)+" additional hectares",d:"Requires "+Math.ceil(haNeed/plot)+
    " more financed farmers and "+CX.pesoX(haNeed*c.loanHa)+" of credit. Only works if the planting window is still open.",k:"po"},
   {n:"Source "+sourceable+" MT from another cluster",d:"Available today, but it takes volume from farms currently uncommitted — it moves the problem rather than solving it.",k:"reassign"},
   {n:"Move delivery to the next window",d:"Cheapest for us, most expensive for the buyer's production schedule. Ask before assuming.",k:"contact"}]};
}

/* ==================================================================
   4. DELIVERY ANOMALY  (was a table with no exit)
   ================================================================== */
function deliveryAction(d){
 if(!d.an||!d.an.length)return null;
 var worst=d.an.filter(function(a){return a.k==="bad";})[0]||d.an[0];
 var acts=[];
 if(/GPS/.test(worst.t))acts=[{verb:"contact",ctx:d.id,label:"Contact farmer to confirm the delivery point"},
  {verb:"agronomist",ctx:d.id,label:"Field verification visit"}];
 else if(/exceeds/.test(worst.t))acts=[{verb:"document",ctx:d.id,label:"Request the amended farm plan"},
  {verb:"escalate",ctx:d.id,label:"Escalate the variance to LANDBANK"}];
 else if(/Duplicate/.test(worst.t))acts=[{verb:"document",ctx:d.id,label:"Request the original DR book page"}];
 else if(/signature/.test(worst.t))acts=[{verb:"contact",ctx:d.id,label:"Re-confirm with the farmer"},
  {verb:"document",ctx:d.id,label:"Request a fresh specimen signature"}];
 else acts=[{verb:"contact",ctx:d.id,label:"Contact farmer"}];
 acts.push({verb:"report",ctx:d.id,label:"Generate exception note"});
 var days=3;
 return {obs:worst.t+" on "+d.id+" — "+d.name+", "+d.muni+".",
  band:worst.k==="bad"?"bad":"warn",
  reasons:d.an.map(function(a){return {t:a.t,v:""};}),
  impact:{v:CX.pesoX(d.payable)+" blocked from reimbursement",
   d:"Held receipts age at roughly "+days+" days before anyone notices. At a 14% cost of capital that is "+
     CX.peso(Math.round(d.payable*0.14/365*days))+" per receipt, and it is Kita's own cash."},
  rec:worst.k==="bad"?"Do not submit. Resolve the exception first — LANDBANK will reject the batch and the whole submission ages again."
   :"Resolve within the day and include in tonight's batch.",
  actions:acts,src:"Delivery receipt, purchase order, farm plan, photo geotag, device timestamp, farmer confirmation log."};
}

/* ==================================================================
   5. PORTFOLIO STANDING ORDER  (replaces the copilot trivia deck)
   ================================================================== */
function portfolio(){
 var out=[];
 var ys=yieldShortfall("corn","Tarlac");
 if(ys)out.push(ys);
 CX.buyers().forEach(function(b){var s=buyerShortfall(b.id);if(s)out.push(s);});
 var bk=CX.book().filter(function(f){return f.status!=="waitlist";});
 var noBuyer=bk.filter(function(f){return !f.buyerId;});
 if(noBuyer.length){
  var exp=noBuyer.reduce(function(t,f){return t+f.amt;},0);
  out.push({obs:noBuyer.length+" financed farms have no committed buyer.",band:"bad",
   reasons:noBuyer.slice(0,5).map(function(f){return {t:f.name+" — "+f.muni+", "+CX.CROPS[f.crop].n,v:CX.pesoX(f.amt)};}),
   impact:{v:CX.pesoX(exp)+" of exposure with no contracted offtake",
    d:"Repayment on these loans depends on a spot sale at whatever price prevails at harvest. This is the single largest driver of predicted default in the model."},
   rec:"Allocate each to an existing offtake contract before harvest, or price the risk explicitly.",
   actions:[{verb:"reassign",ctx:"portfolio",label:"Allocate "+noBuyer.length+" farms to a buyer"},
    {verb:"escalate",ctx:"portfolio",label:"Flag to LANDBANK credit committee"},
    {verb:"report",ctx:"portfolio",label:"Generate exposure report"}],
   src:"Loan book, offtake register."});
 }
 return out;
}

/* ==================================================================
   THE AUDIT ITSELF - shown in the app, because the claim needs proof
   ================================================================== */
var AUDIT=[
 {s:"Credit copilot trivia deck (8 canned questions)",app:"Ops console",
  data:"Live book",dec:"None — the answers were facts, not decisions",man:"None",act:"None",
  v:"DELETED",note:"Answered questions nobody had to act on. Replaced by the standing-order portfolio cards."},
 {s:"“AI says this farmer is low risk”",app:"LANDBANK",
  data:"Loan record, risk model",dec:"Credit decision",man:"Reading the file",act:"None",
  v:"REBUILT",note:"Now a scored assessment with itemised reasons, exposure and an Approve / Request document / Escalate action set."},
 {s:"Credit copilot question buttons",app:"Officer workbench",

  v:"REBUILT",note:"Every answer now ends in an action the officer can take without leaving the screen."},
 {s:"Delivery anomaly table",app:"Ops console",

 {s:"Buyer assistant",app:"Buyer app",
  data:"Contracted book, calendar",dec:"Yes",man:"Yes",act:"None",
  v:"REBUILT",note:"Shortfall answers now offer three costed options as buttons rather than prose."},
 {s:"Nine agent cards",app:"Ops console",
  data:"Loan record",dec:"Partly",man:"Yes",act:"None",
  v:"REBUILT",note:"Cards now emit the action that clears the item they raised."},
 {s:"CEO command bar",app:"Ops console",
  data:"Book, DR ledger, P&L",dec:"Yes",man:"Yes",act:"Files actions with an owner",
  v:"PASS",note:"Already conformed. Left as built."},
 {s:"Approval readiness score",app:"Officer workbench",
  data:"Credit package, policy",dec:"Yes",man:"Yes",act:"Submit / block / exception",
  v:"PASS",note:"Already conformed."},
 {s:"Predictive NPL + action plan",app:"LANDBANK",
  data:"Price, weather, execution, cover",dec:"Yes",man:"Yes",act:"Named plays",
  v:"PASS",note:"Already conformed."},
 {s:"Minimum-effective-intervention",app:"Farmer app",
  data:"Digital twin, task log",dec:"Yes",man:"Yes",act:"Chooses the cheapest sufficient channel",
  v:"PASS",note:"Already conformed."},
 {s:"Signature policy engine",app:"All",
  data:"Form attributes, policy",dec:"Yes — wet vs electronic",man:"Yes",act:"Routes the document",
  v:"PASS",note:"Not framed as AI, and correctly so. It is a rule engine and says so."}
];
window.CXAI={VERBS:VERBS,fire:fire,ledger:ledger,clearLedger:clearLedger,card:card,
 farmerCredit:farmerCredit,yieldShortfall:yieldShortfall,buyerShortfall:buyerShortfall,
 deliveryAction:deliveryAction,portfolio:portfolio,projYield:projYield,AUDIT:AUDIT};
})();

<script>/* ==================================================================
   CXPROTO — Crop Protocol Engine.

   PHASE 0 FINDING. Crops were a hard-coded object with nine of the
   twenty-three required configuration elements. Adding a crop meant
   editing core.js and four applications. Citronella did not exist at
   all. Coconut existed as an annual crop with a yield per hectare,
   which is not what a coconut farm is.

   This engine holds the full protocol as CONFIGURATION. A new crop is
   a new entry here and nothing else changes. Three cycle models are
   supported because Philippine agriculture needs three:

     ANNUAL      one planting, one harvest, loan repaid at harvest
     RATOON      one establishment, repeated harvests on an interval
     PERENNIAL   a standing asset measured in trees, not hectares
   ================================================================== */
(function(){
function R(n,d){d=d||0;return Math.round(n*Math.pow(10,d))/Math.pow(10,d);}

 annual:{n:"Annual",d:"One planting, one harvest. The loan matures at harvest."},

};

 crop:"citronella",n:"Citronella",tl:"Tanglad",cycleModel:"ratoon",rank:5,emo:"✽",

 geo:{provs:["Tarlac","Nueva Ecija","Pampanga"],soilOk:["upland","lahar"],
  note:"Tolerates marginal upland and lahar soils that will not carry palay or corn. That is the point of it — it monetises land the rest of the book cannot use."},

 risk:[{n:"Distillation capacity",sev:"high",d:"Biomass with no still to go to is worthless within a day. Capacity must be contracted before hectares are."},
  {n:"Oil price",sev:"med",d:"A traded industrial commodity priced in dollars. The farmer is insulated by a biomass price; Kita is not."},
  {n:"Stand establishment",sev:"med",d:"A failed establishment costs the full facility with no harvest to repay it."}],

};

P.coconut={
 crop:"coconut",n:"Coconut",tl:"Niyog",cycleModel:"perennial",rank:6,emo:"◉",

  {n:"Rhinoceros beetle traps and control",q:1,u:"ha",p:3200,cat:"Crop protection"}],
 production:{treesPerHa:100,nutsPerTree:50,nutsPerHa:5000,
  farmgate:14,unit:"whole mature nut",
  note:"National average is closer to 44 nuts per tree. Fertilised farms reach 70–90. The gap between those two numbers is the entire rehabilitation case."},
 outputs:[

 processing:{route:"Determined by buyer demand, not by Kita preference",

 financing:{loanHa:34000,costHa:41000,inputShare:0.62,

 agronomy:{
  planting:["Plant at 8m x 8m triangular, about 156 palms per hectare, or 10m x 10m square at 100.","Dig 60 cm cubes and refill with topsoil and organic matter.","Ring-weed 1.5 m radius for the first three years."],
  monitoring:["Fertilise twice a year, at the start and end of the rains.","Salt is not folklore — coconut is a chloride-demanding palm and salt is the cheapest source.","Monitor for rhinoceros beetle at the crown; a beetle-damaged spear kills the palm."],

 risk:[{n:"Tree age profile",sev:"high",d:"A farm of senescent palms cannot be financed against harvest. The tree census is the credit decision."},
  {n:"Typhoon",sev:"high",d:"A palm lost is a forty-year asset lost. Replanting is a decade to recover income."},

/* Economics deliberately live in the internal econ module, not here.
   This module ships to every application; gross profit does not. */
/* ---------- coconut digital twin ---------------------------------- */
function rnd(s){var h=2166136261;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return ((h>>>0)%1e6)/1e6;}
function coconutTwin(f){
 var p=P.coconut,r=rnd(f.id+"coco");
 var density=Math.round(92+r*46);
 var total=Math.round(density*f.ha);
 /* age profile — a real farm is a mixture, and that mixture is the credit story */
 var mix=[
  {c:"new",      s:0.06+rnd(f.id+"a1")*0.10},
  {c:"young",    s:0.08+rnd(f.id+"a2")*0.12},
  {c:"mature",   s:0.44+rnd(f.id+"a3")*0.28},
  {c:"senescent",s:0}
 ];
 var used=mix.reduce(function(t,m){return t+m.s;},0);
 mix[3].s=Math.max(0.04,1-used);
 var trees=mix.map(function(m){
  var cls=p.treeClasses.filter(function(c){return c.k===m.c;})[0];
  var n=Math.round(total*m.s);
  return {k:m.c,n:cls.n,years:cls.years,count:n,bearing:cls.bearing,
   nuts:cls.bearing?n*cls.nuts:0,plan:cls.plan};
 });
 var productive=trees.filter(function(t){return t.bearing;}).reduce(function(t,x){return t+x.count;},0);
 var nuts=trees.reduce(function(t,x){return t+x.nuts;},0);
 var senescent=trees.filter(function(t){return t.k==="senescent";})[0];
 var rehabUpside=senescent.count*(50-22);
 return {farm:f,density:density,total:total,trees:trees,
  productive:productive,nonProductive:total-productive,
  productivePct:Math.round(productive/Math.max(1,total)*100),
  nuts:nuts,nutsPerTree:R(nuts/Math.max(1,productive),1),
  nutsPerHa:Math.round(nuts/Math.max(0.1,f.ha)),
  revenue:Math.round(nuts*p.production.farmgate),
  perHarvest:Math.round(nuts*p.production.farmgate/p.calendar.harvestsPerYear),
  condition:productive/total>0.7?"good":productive/total>0.5?"fair":"poor",
  rehabCandidate:senescent.count>total*0.18,
  rehabTrees:senescent.count,rehabUpsideNuts:rehabUpside,
  rehabUpsideValue:Math.round(rehabUpside*p.production.farmgate),
  variety:p.varieties[Math.floor(rnd(f.id+"v")*p.varieties.length)].n,
  history:[0,1,2].map(function(i){return Math.round(nuts*(0.86+rnd(f.id+"h"+i)*0.22));})};
}

/* ---------- intercrop planning agent ------------------------------ */
/* Shade penalty. An intercrop under coconut does not achieve open-field yield,
   and quoting one is the single most common way intercropping business cases
   are overstated. These are yield retention factors, not marketing numbers. */
var SHADE={tolerant:0.72,partial:0.58,intolerant:0.34};
var INTERCROPS=[
 {k:"ubep",n:"Ube — Kinampay",shade:"tolerant",need:"trellis, drainage",
  fit:function(t){return t.trees.filter(function(x){return x.k==="mature"||x.k==="senescent";}).length>0;},
  why:"Ube is a shade-tolerant vine and coconut gives it the light profile it wants. It is also the highest-value crop in the book, so a hectare of mature coconut carrying ube earns twice."},
 {k:"ube",n:"Ube — commercial",shade:"tolerant",need:"trellis, drainage",fit:function(){return true;},
  why:"Same agronomy as Kinampay at lower planting-material cost and lower price. Sensible where certified setts cannot be sourced."},
 {k:"corn",n:"Yellow corn",shade:"intolerant",need:"full sun",
  fit:function(t){return t.trees.filter(function(x){return x.k==="new"||x.k==="young";})
   .reduce(function(a,x){return a+x.count;},0)>t.total*0.35;},
  why:"Only viable under young palms before canopy closure. Under mature coconut the light is not there and the yield assumption fails."},
 {k:"chili",n:"Siling labuyo",shade:"partial",need:"drainage, weekly picking",fit:function(){return true;},
  why:"Partial shade is acceptable and the 26-week picking window converts coconut's dead months into weekly cash."}
];
function intercrop(f,twin){
 twin=twin||coconutTwin(f);
 var p=P.coconut;
 var canopyPct=twin.trees.filter(function(t){return t.k==="mature"||t.k==="senescent";})
  .reduce(function(a,t){return a+t.count;},0)/Math.max(1,twin.total);
 var usable=R(f.ha*(1-canopyPct*0.42),2);   /* interspace available after canopy */
 return INTERCROPS.map(function(ic){
  var c=CX.CROPS[ic.k];if(!c)return null;
  var ok=false;try{ok=ic.fit(twin);}catch(e){}
  var soilOk=(c.soilOk||[]).indexOf(f.soil)>=0;
  var ret=SHADE[ic.shade]||0.6;
  var rev=usable*c.yld*ret*c.price;
  var loan=Math.round(usable*c.loanHa);
  return {k:ic.k,n:ic.n,shade:ic.shade,need:ic.need,why:ic.why,
   viable:ok&&soilOk,blocked:!ok?"canopy or tree-age profile does not suit it":(!soilOk?"soil class "+f.soil+" is not suitable":null),
   usableHa:usable,retention:ret,openField:Math.round(usable*c.yld*c.price),
   revenue:Math.round(rev),loan:loan,
   cover:loan?rev/loan:0,
   combinedRevenue:Math.round(rev+twin.revenue),
   perHa:Math.round((rev+twin.revenue)/Math.max(0.1,f.ha))};
 }).filter(Boolean).sort(function(a,b){
  if(a.viable!==b.viable)return a.viable?-1:1;return b.revenue-a.revenue;});
}

/* ---------- configuration completeness ---------------------------- */
var BASE=["crop","varieties","geo","calendar","duration","inputBOM","production","financing",
 "agronomy","ccp","targets","risk","insurance","benchmark","processing"];
var EXTRA={perennial:["outputs","treeClasses"],ratoon:[],annual:[]};
var ELEMENTS=BASE.concat(["outputs","treeClasses"]);
function required(model){return BASE.concat(EXTRA[model]||[]);}
function completeness(){
 return Object.keys(P).map(function(k){
  var p=P[k],req=required(p.cycleModel);
  var have=req.filter(function(e){return p[e]!==undefined;});
  return {crop:k,n:p.n,model:p.cycleModel,have:have.length,of:req.length,
   missing:req.filter(function(e){return p[e]===undefined;}),
   pct:Math.round(have.length/req.length*100)};
 });
}
window.CXPROTO={CYCLE:CYCLE,P:P,ELEMENTS:ELEMENTS,SHADE:SHADE,required:required,
 coconutTwin:coconutTwin,intercrop:intercrop,INTERCROPS:INTERCROPS,completeness:completeness};
})();
</script>

<script>/* shared UI helpers used by every app */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function openM(h){$("mbody").innerHTML='<button class="mclose" onclick="closeM()">&times;</button>'+h;$("modal").classList.add("on");}
function closeM(){$("modal").classList.remove("on");}
function toast(m){var t=$("toast");t.textContent=m;t.style.opacity="1";clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity="0";},2400);}
function kpi(l,v,d,hi){return '<div class="kpi'+(hi?' hi':'')+'"><div class="l">'+l+'</div><div class="v">'+v+'</div>'+(d?'<div class="d">'+d+'</div>':'')+'</div>';}
function chip(t,k){return '<span class="chip c-'+(k||"mut")+'">'+t+'</span>';}
function note(title,body,k){return '<div class="note'+(k?" "+k:"")+'"><b>'+title+'</b>'+body+'</div>';}
function bar(pct,k){return '<div class="bar"><i class="'+(k||"")+'" style="width:'+Math.max(0,Math.min(100,pct))+'%"></i></div>';}
function statusChip(s){
 return {repaid:chip("Repaid","ok"),performing:chip("Performing","info"),
  "in-season":chip("In season","warn"),overdue:chip("Overdue","bad")}[s]||chip(s);
}
function riskChip(b){return {low:chip("Low","ok"),watch:chip("Watch","warn"),high:chip("High","bad")}[b]||chip(b);}
function agentCard(a,arg){
 var r;
 try{ r=a.run(arg); }catch(e){ r={ok:false,title:"Agent error",items:[e.message],ev:[]}; }
 return '<div class="agent"><div class="hd"><span class="dot'+(r.ok?"":" bad")+'"></span>'+
  '<span class="nm">'+esc(a.n)+'</span></div>'+
  '<div class="st">'+esc(r.title)+'</div>'+
  (r.items&&r.items.length?'<ul>'+r.items.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>':'')+
  (r.ev&&r.ev.length?'<div class="ev">Evidence: '+r.ev.map(esc).join(" · ")+'</div>':'')+'</div>';
}
function setNav(views,def){
 var nav=$("nav");
 nav.innerHTML=views.map(function(v){return '<button data-v="'+v.k+'" onclick="go(\''+v.k+'\')">'+v.n+'</button>';}).join("");
 window.VIEWS=views;
 var start=def;
 try{var q=(location.search.match(/v=(\w+)/)||[])[1]; if(q&&views.filter(function(v){return v.k===q;}).length)start=q;}catch(e){}
 go(start);
}
function go(k){
 window.CURV=k;
 Array.prototype.forEach.call(document.querySelectorAll("#nav button"),function(b){
  b.classList.toggle("on",b.getAttribute("data-v")===k);});
 Array.prototype.forEach.call(document.querySelectorAll(".view"),function(v){
  v.classList.toggle("on",v.id==="v-"+k);});
 render();
}
function render(){
 var v=(window.VIEWS||[]).filter(function(x){return x.k===window.CURV;})[0];
 if(v&&v.r){ try{ $("v-"+v.k).innerHTML=v.r(); }catch(e){ $("v-"+v.k).innerHTML='<div class="note bad"><b>Render error</b>'+esc(e.message)+'</div>'; } }
 var t=$("clock"); if(t)t.textContent=CX.NOW().toISOString().slice(0,10);
}
function doReset(){
 /* Reset must clear everything the platform owns, not just reseed the book.
    Missing the per-app keys is why the button appeared to do nothing. */
 var keys=["cx_state_v1","cx_bus_v1","cx_audit_v1","cx_notify_v1","cx_role",
           "cxa_app_v1","cx_farmer_self","cx_buyer","cx_lang"];
 keys.forEach(function(k){try{localStorage.removeItem(k);}catch(e){}});
 try{CX.seed(true);}catch(e){}
 try{location.reload();}catch(e){}
}
CX.onChange(function(){render();});

<script>/* ============ PRICE INTELLIGENCE VIEW ============ */
var PXC="ube",PXP="monthly",PXH=24;
function pxSet(k,v){if(k==="c")PXC=v;else if(k==="p")PXP=v;else PXH=+v;render();}
function pxFmt(v){return "₱"+(v>=100?Math.round(v):v.toFixed(v<20?1:0));}
function vPrice(){
 var k=PXC,c=CX.CROPS[k],st=CXPX.stats(k),S=CXPX.SEASON[k];
 var a=CXPX.agg(k,PXP),f=CXPX.forecast(k,12);
 var cut=CXPX.TODAY.getTime()-PXH*30.4*864e5;
 var pts=a.filter(function(p){return p.t>=cut;}).map(function(p){return {x:p.t,y:p.v};});
 if(pts.length<2)pts=a.slice(-2).map(function(p){return {x:p.t,y:p.v};});
 var fc=f.map(function(p){return {x:p.t,y:p.v,lo:p.lo,hi:p.hi};});

 /* harvest window shading, drawn from the seasonal model rather than typed in */
 var shade=[],seen={};
 pts.concat(fc).forEach(function(p){
  var d=new Date(p.x),m=d.getMonth(),y=d.getFullYear();
  if(st.harvestMons.indexOf(m)>=0&&!seen[y+"-"+m]){
   seen[y+"-"+m]=1;
   shade.push({from:new Date(y,m,1).getTime(),to:new Date(y,m+1,0).getTime(),label:""});
  }});
 var xl=[];
 var span=(fc[fc.length-1].x-pts[0].x);
 for(var i=0;i<=5;i++){var t=pts[0].x+span*i/5,d=new Date(t);
  xl.push({x:t,t:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]+" "+String(d.getFullYear()).slice(2)});}

 var h='<h1 class="pg">Price intelligence</h1>'+
  '<p class="lede">Twenty-four months of farmgate history and a twelve-month forecast for every financed crop, '+
  'with the collar the platform is actually lending against drawn on top.</p>';

 /* crop selector with sparklines - the comparison happens before you pick */
 h+='<div class="pxsel">'+CX.CKEYS.map(function(x){
  var s=CXPX.stats(x);
  return '<button class="pxc'+(x===k?" on":"")+'" onclick="pxSet(\'c\',\''+x+'\')">'+

 h+='<div class="card pxchart">'+CXC.line({

 /* the numbers that hang off the chart */
 h+='<div class="grid g4">'+

  kpi("Forecast at harvest",pxFmt(st.harvestPrice)+"/kg","when this crop is sold","hi")+
  kpi("Days below collar floor",st.belowFloor,"in the last 365",st.belowFloor>30?"":"")+'</div>';

 /* the decision this chart exists to support */
 var cover=st.harvestPrice/c.floor;
 h+=CXAI.card({
  obs:"Forecast farmgate at harvest is "+pxFmt(st.harvestPrice)+"/kg against a collar floor of "+pxFmt(c.floor)+"/kg.",
  band:cover>=1.15?"ok":cover>=1.0?"warn":"bad",score:undefined,
  reasons:[{t:"Seasonal position at harvest",v:st.harvestMons.length?"harvest months "+st.harvestMons.map(function(m){
     return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m];}).join(", "):"aseasonal"},
   {t:"Forecast versus floor",v:R2(cover)+"×"},
   {t:"Price volatility, 12-month",v:st.cv+"% coefficient of variation"},
   {t:"Days the market traded below our floor in the last year",v:st.belowFloor+" days"},
   {t:"Twelve-month forecast",v:pxFmt(st.fc12.lo)+" – "+pxFmt(st.fc12.hi)+" at 80% confidence"}],
  impact:{v:cover>=1.15?"Floor is defensible":"Floor is exposed at harvest",
   d:cover>=1.15?("The collar floor sits "+Math.round((cover-1)*100)+"% below the forecast harvest price. "+
     "Kita can honour it without buying above market.")
    :("The floor sits within "+Math.round(Math.abs(1-cover)*100)+"% of the forecast harvest price. "+
      "If the forecast is right, honouring the floor costs money on every kilogram.")},
  rec:cover>=1.15?"Hold the collar as set. Review after the next harvest print."
   :"Re-price the collar or hedge the exposure before the next planting window opens.",
  actions:[{verb:"report",ctx:k,label:"Generate the collar review"},
   {verb:"escalate",ctx:k,label:"Flag the floor exposure"}],
  src:"730 daily farmgate observations, monthly seasonal index, documented market events, current collar parameters."});

 /* seasonality, as a chart rather than a sentence */
 h+='<h2 class="sec">Why the price moves</h2>'+
  '<div class="grid g2"><div class="card"><b>Seasonal index</b>'+
   '<div class="sub" style="margin-bottom:8px">1.00 is the annual mean. Harvest months are shaded on the chart above.</div>'+
   CXC.cols(S.idx.map(function(v,i){
    return {n:["J","F","M","A","M","J","J","A","S","O","N","D"][i],v:v};}),
    {fmt:function(v){return v.toFixed(2);},h:180})+
   '<div class="sub" style="margin-top:7px">'+esc(S.note)+'</div></div>'+
  '<div class="card"><b>Market events in the series</b>'+
   '<div class="sub" style="margin-bottom:8px">A price series with no events in it is a sine wave. These are in the data.</div>'+
   '<table>'+CXPX.events(k).map(function(e){
    return '<tr><td class="sub mono">'+e.d+'</td><td>'+esc(e.n)+'</td>'+
     '<td class="right '+(e.m>1?"ok":"bad")+'">'+(e.m>1?"+":"")+Math.round((e.m-1)*100)+'%</td></tr>';}).join("")+
   '</table>'+(CXPX.events(k).length?"":'<div class="sub">No recorded shock for this crop in the window.</div>')+
   '</div></div>';

 /* cross-crop comparison */
 h+='<h2 class="sec">All crops, indexed</h2><div class="card">'+
  CXC.bars(CX.CKEYS.map(function(x){var s=CXPX.stats(x);
   return {n:CX.CROPS[x].n+" — "+pxFmt(s.cur)+"/kg",v:s.cv,k:s.cv>25?"bad":s.cv>14?"warn":""};}),
   {fmt:function(v){return v+"% CV";}})+
  '<div class="sub" style="margin-top:7px">Coefficient of variation over twelve months. '+
  'Volatility is what the collar is protecting the farmer from, so it is also what determines how wide the collar has to be.</div></div>';

}
function R2(n){return Math.round(n*100)/100;}

function doOcr(){

  else if(k==="dob")A.id.dob=r.fields.dob;
  else if(k==="sex")A.id.sex=r.fields.sex;
  else if(k==="address")A.id.addr=r.fields.address;
  else if(k==="idNo")A.id.idNo=r.fields.idNo;
 });
 var a=CXA.ageFromDob(A.id.dob);
 A.id.ageFromId=a;
 A.id.ageIssue=(a!==null&&A.elig.age!==null&&Math.abs(a-A.elig.age)>1);
 if(A.id.ageIssue)CXP.log({obj:"exception",id:"self",from:"—",to:"Age mismatch: answered "+A.elig.age+", ID says "+a,
  role:"farmer",actor:"system",ai:"exception"});
 CXP.log({obj:"application",id:"self",from:"—",to:"ID captured ("+(r.captured||[]).length+" fields)",role:"farmer",actor:"farmer",ai:"document"});
 sv();render();
}

 else{A.id.editing=true;A.id.edited=A.id.edited||Object.assign({},A.id.ocr.fields);}

function doRsbsaOcr(){

 /* every fourth applicant in the demo shows the name-mismatch control */
 var variant=(Math.round(seed)%4===0)?"mismatch":null;
 var r=CXA.ocrRsbsa(seed,A.id.name,variant);
 A.rsbsa.ocr=r; A.rsbsa.no=r.fields.number; A.rsbsa.issues=r.issues;
 A.rsbsa.state=r.issues.length?"MANUAL":"MANUAL";
 CXP.log({obj:"application",id:"self",from:"—",to:"RSBSA card scanned",role:"farmer",actor:"farmer",ai:"document"});
 if(r.issues.length)CXP.log({obj:"exception",id:"self",from:"—",to:"Name mismatch ID vs RSBSA",role:"farmer",actor:"system",ai:"exception"});

}

  A.rsbsa.confirmed=true; A.rsbsa.editing=false; A.rsbsa.proof=true;
  var f=A.rsbsa.ocr.fields;
  /* auto-fill the farm from the card — this is the point of scanning it */
  if(f.province){A.farm.prov=f.province;A.farm.muni=f.municipality;A.farm.brgy=f.barangay;}
  if(f.area)A.farm.areaTotal=f.area;
  if(!A.id.addr&&f.address)A.id.addr=f.address;
  CXP.log({obj:"application",id:"self",from:"OCR",to:"RSBSA farmer-confirmed",role:"farmer",actor:"farmer",ai:null});
 } else { A.rsbsa.editing=true; }
 sv();render();

 CXP.log({obj:"application",id:"self",from:"OCR value",to:"Farmer-edited RSBSA",role:"farmer",actor:"farmer",ai:null});
 toast(T("Naitala","Recorded")); sv(); render();
}
function flagRsbsa(){

/* ---------- STEP 4 — farm + map ---------- */
function s4(){
 var f=A.farm,e=A.elig,h=prog(4,11);
 if(!f.prov)f.prov=e.prov;
 if(!f.muni)f.muni=e.muni;
 if(!f.crop)f.crop=e.crop;
 if(f.areaTotal===null||f.areaTotal===undefined)f.areaTotal=e.ha;
 if(f.areaFinance===null||f.areaFinance===undefined)f.areaFinance=f.areaTotal||e.ha;
 h+='<div class="fq">'+T("Ang bukid mo","Your farm")+'</div>';
 var auto=!!(A.rsbsa.ocr&&A.rsbsa.confirmed);
 h+=field(T("Probinsya","Province"),'<input class="finp" value="'+esc(f.prov||"")+'" readonly>',auto);
 h+=field(T("Bayan","Municipality"),'<input class="finp" value="'+esc(f.muni||"")+'" readonly>',auto);
 var bl=(CXA.BRGY[f.muni]||[]).map(function(b){return [b,b];});
 h+=field(T("Barangay","Barangay"),
   bl.length?sel("brg",bl.concat([["__other",T("Wala sa listahan","Not on the list")]]),f.brgy,"pickBrgy(this.value)")
    :'<input class="finp" value="'+esc(f.brgy||"")+'" onchange="setF(\'farm.brgy\',this.value)">', auto&&!!f.brgy);
 if(f.brgy==="__other")h+='<input class="finp" placeholder="'+T("Isulat ang barangay","Type the barangay")+'" onchange="setF(\'farm.brgy\',this.value)">';
 h+=field(T("Pangalan ng bukid (opsyonal)","Farm name (optional)"),
   '<input class="finp" value="'+esc(f.name||"")+'" onchange="setF(\'farm.name\',this.value)">');
 h+=field(T("Kabuuang laki","Total area"),
   '<div class="unitwrap"><input class="finp" type="number" inputmode="decimal" step="0.1" value="'+(f.areaTotal||"")+
   '" onchange="setF(\'farm.areaTotal\',this.valueAsNumber)"><span>ha</span></div>',auto);
 h+=field(T("Laking tataniman","Area to finance"),
   '<div class="unitwrap"><input class="finp" type="number" inputmode="decimal" step="0.1" value="'+(f.areaFinance||"")+
   '" onchange="setF(\'farm.areaFinance\',this.valueAsNumber)"><span>ha</span></div>');
 var vl=(CXA.VARIETIES[f.crop]||[]).map(function(v){return [v,v];});
 h+=field(T("Klase / variety","Variety"),
   vl.length?sel("vr",vl,f.variety,"setF('farm.variety',this.value)")
    :'<input class="finp" value="'+esc(f.variety||"")+'" onchange="setF(\'farm.variety\',this.value)">');
 h+=field(T("Kailan magtatanim","Target planting date"),
   '<input class="finp" type="date" value="'+esc(f.plantDate||"")+'" onchange="setF(\'farm.plantDate\',this.value)">');
 h+=field(T("Anong tinanim dati","Previous crop"),sel("pc",L("prevCrop"),f.prevCrop,"setF('farm.prevCrop',this.value)"));
 h+=field(T("Patubig","Water"),chips(L("water"),f.water,"setF('farm.water',%v)"));
 h+='<div class="fcard" style="margin-top:14px"><div class="flab">'+T("Mapa ng bukid","Farm map")+'</div>'+
  '<div class="fsub">'+T("Kailangan ito para malaman ang eksaktong lupa at hindi mapondohan ng dalawang beses.",
   "This establishes the exact parcel so the same field is not financed twice.")+'</div>';
 [["pin",T("Mag-drop ng pin","Drop a pin")],["walk",T("Lakarin ang hangganan","Walk the boundary")],
  ["draw",T("Iguhit ang bukid","Draw the farm")],["fro",T("Ipagawa sa field officer","Ask the field officer to map it")]
 ].forEach(function(m){h+=optBtn(m[1],f.mapMode===m[0],"doMap('"+m[0]+"')");});
 if(f.mapMode)h+=farmSvg(f.mapped,f.areaTotal,f.mapMode);
 if(f.mapped){
  var ck=CXA.areaCheck(f.areaTotal,f.mapped);
  h+='<div class="row" style="margin-top:10px"><span>'+T("Sinabi mong laki","Declared area")+'</span><b>'+f.areaTotal+' ha</b></div>'+
   '<div class="row"><span>'+T("Sukat ng mapa","Mapped area")+'</span><b>'+f.mapped.toFixed(2)+' ha</b></div>';
  h+='<div class="fcard '+(ck.state==="OK"?"ok":"warn")+'" style="margin-top:8px"><b>'+
   (ck.state==="OK"?T("Magkatugma","Consistent"):T("Kailangan ng pagsusuri sa bukid","Field verification needed"))+
   '</b><div class="fsub" style="margin-top:4px">'+ck.msg+'</div></div>';
 }
 h+='</div>';
 if(f.brgy&&f.water&&(f.mapped||f.mapMode==="fro"))h+=bigBtn(T("Tuloy","Continue"),"go2(5)");
 return shell(T("Detalye ng bukid","Farm details"),"",h);
}
function doMap(m){
 A.farm.mapMode=m; A.farm.polygon=(m!=="fro");
 if(m!=="fro"){
  var dec=A.farm.areaTotal||1;
  A.farm.mapped=+(dec*(0.78+CX.rnd(m+dec)*0.34)).toFixed(2);
 } else A.farm.mapped=null;
 CXP.log({obj:"application",id:"self",from:"—",to:"Farm mapped ("+m+")",role:"farmer",actor:"farmer",ai:null});
 sv();render();
}

  '<div class="row"><span>'+T("Haba","Term")+'</span><b>'+T("Hanggang","Up to")+' '+CXA.P("tenorDays")+' '+T("araw","days")+'</b></div>'+

 h+='<div class="card"><b>'+T("Saan galing ang dagdag na kita","Where the extra income comes from")+'</b>'+

function mount(){

 };
